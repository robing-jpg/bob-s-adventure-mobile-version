mes later — at step 6."}, {"id": "c", "text": "That customs has released the export and the box may now be loaded", "fb": "The release is a separate customs message."}, {"id": "d", "text": "That the ocean freight has been paid and the B/L can now be issued", "fb": "Payment is a commercial matter, not a gate event."}], "explain": "The gate-in EIR records time and condition at custody transfer: it stops export detention and anchors any damage claim."}, "3": {"prompt": "Clean EIR at depot gate-out, but a fresh dent is recorded on this gate-in EIR (merchant haulage). Who is usually charged for the repair?", "options": [{"id": "a", "correct": true, "text": "The merchant who held the box between the two interchanges"}, {"id": "b", "text": "The terminal, because the damage was found at its own gate", "fb": "The damage was recorded at the terminal's gate, before it took charge."}, {"id": "c", "text": "The carrier, which absorbs small dents as normal wear and tear", "fb": "Possible commercially, but the tariff normally allows a recharge."}, {"id": "d", "text": "The buyer, under any Incoterm, as the final owner of the cargo", "fb": "Equipment damage follows the equipment interchange terms, not the Incoterm."}], "explain": "Two EIRs bracket the period of custody; damage between them is recharged per the carrier's equipment terms. [TO VERIFY:v71]"}}}}, "dossier": {"documents": ["**Gate-in EIR** — time, seal, condition, VGM status. [TO VERIFY:v60]", "**Load list** — boxes cleared for the vessel (VGM, customs, booking).", "**Bay plan (BAPLIE)** — where every box goes. [TO VERIFY:v61]", {"text": "**DG manifest** — dangerous goods on board, for the master and ports. [TO VERIFY:v59]", "when": {"family": ["tank"]}}], "costs": ["**Origin THC** — terminal handling, per tariff or contract. [TO VERIFY:v35]", "**Storage / demurrage** beyond free time in the terminal. [TO VERIFY:v12]", {"text": "**Reefer plug-in / monitoring** charges at some terminals. [TO VERIFY:v57]", "when": {"family": ["reefer"]}}, "**Late-gate fee** if accepted after the cut-off. [TO VERIFY:v12]"], "risks": ["**Customs hold** → box can't be loaded; rolled if not released.", "**Missing VGM** → not on the load list. [TO VERIFY:v01]", "**Damage at gate** → claims and repair recharges.", "**Replanning** after late bookings or wrong weights."], "jobs": ["**Terminal operations liaison** — gate issues, holds, load list.", "**Vessel / stowage planning** — central planners and terminal planners. [TO VERIFY:v61]", "**Customer service** — informing customers of holds and rollings.", "**Equipment (M&R)** — damage reports and recharges."]}, "incoNote": {"_by": "incoterm", "FCA": "Under FCA (terminal), this is the delivery point: risk and cost passed to the buyer on arrival here, ready for unloading. [TO VERIFY:v14]", "CPT": "Under CPT, risk passes on handover to the carrier here, though the seller pays carriage to destination.", "CIP": "Under CIP, risk passes on handover to the carrier here; the seller pays carriage and insurance to destination.", "FAS": "Under FAS, 'alongside' is effectively the terminal for containers — a poor fit; FCA is the right rule. [TO VERIFY:v15]", "FOB": "Under FOB, the seller has lost physical control here but keeps the risk until on board — the classic container gap. [TO VERIFY:v15]", "*": ""}, "keyPoints": {"1": ["At the terminal gate, number, seal and condition are checked and a receipt is issued.", "Boxes wait in the yard; reefers are plugged in, dangerous goods are kept apart.", "Planners decide where every box goes on the ship."], "2": ["Gate-in = custody transfer and evidence point; export detention stops here (per tariff).", "Yard planning groups boxes by vessel, port and weight; special cargo has its own areas.", "The stowage plan needs correct VGMs, DG data and reefer details; only cleared boxes load."], "3": ["Holds must be escalated immediately: broker, shipper, customer — before the load list closes.", "Two EIRs bracket custody: they decide who pays for damage.", "Under FOB/CFR/CIF the seller still carries the risk here — prefer FCA/CPT/CIP for containers."]}, "question": {"1": {"prompt": "I'm stacked in the yard and my place on the ship is planned. What happens next?", "hint": "My ship is about to arrive at the quay.", "options": [{"id": "a", "correct": true, "text": "When my ship arrives, a giant crane lifts me on board.", "confirm": "Yes! A quay crane lifts me from a terminal truck onto the ship, following the plan. Under {incoterm}, risk passes to the buyer at step {riskStep}."}, {"id": "b", "text": "A truck takes me straight to the customer at destination.", "why": "I haven't crossed the ocean yet!", "realLife": "Delivery happens weeks later, after the voyage and import customs.", "whenRight": "That's step 10."}, {"id": "c", "text": "I go back to the seller's warehouse to be checked again.", "why": "I was already checked at the gate. Going back would make me miss my ship.", "realLife": "An extra trip, extra costs and a missed sailing.", "whenRight": "Only if the shipper had to fix a real problem (e.g. damaged cargo)."}]}, "2": {"prompt": "Box in the export yard, VGM received, customs released, stowage planned. What happens next?", "options": [{"id": "a", "correct": true, "text": "The vessel berths; quay cranes load the load-list boxes in planned sequence; lashing follows.", "confirm": "Correct. Only boxes on the load list — VGM, customs release, booking — are loaded, in the terminal's crane sequence. [TO VERIFY:v61]"}, {"id": "b", "text": "The shipped-on-board B/L is issued at once, now that the box is safely stacked in the yard.", "why": "'Shipped on board' needs the box to be on board.", "realLife": "An early on-board B/L is a false statement.", "whenRight": "After loading (step 6). [TO VERIFY:v50]"}, {"id": "c", "text": "The box goes to a container freight station (CFS) for a final check of its contents first.", "why": "FCL boxes stay sealed; CFS handling is for LCL.", "realLife": "Opening an FCL box without reason breaks the seal chain.", "whenRight": "Only if customs orders an inspection."}, {"id": "d", "text": "Boxes are loaded in the order they arrived at the terminal: first in, first loaded on board.", "why": "Loading follows the stowage plan, not arrival order.", "realLife": "Random loading would ruin stability and discharge planning.", "whenRight": "Never."}]}, "3": {"prompt": "Case: your box shows 'CUSTOMS HOLD — documentary check' 12 hours before vessel arrival. What do you do?", "options": [{"id": "a", "correct": true, "text": "Get the customer and broker to supply the documents now; track the hold; warn of a roll if not cleared.", "confirm": "Right. Only the declarant can clear a customs hold; the carrier's role is fast communication and contingency (rolling). A held box is never loaded. [TO VERIFY:v45]"}, {"id": "b", "text": "Ask the terminal to load the box anyway: a documentary hold does not stop the physical loading.", "why": "A hold is a hold: terminals don't load held boxes.", "realLife": "Loading would breach customs rules — fines for terminal and carrier.", "whenRight": "Never."}, {"id": "c", "text": "Wait and do nothing: documentary holds are usually lifted automatically, well before the vessel arrives.", "why": "Documentary checks need documents from the declarant.", "realLife": "The box misses the vessel and the customer hears it too late.", "whenRight": "Never as a strategy."}, {"id": "d", "text": "Contact customs yourself and send them the commercial invoice you have on file for this shipment.", "why": "The carrier isn't the declarant and may not hold the right documents.", "realLife": "Customs deals with the declarant; unofficial documents can make things worse.", "whenRight": "Only if your company acts as customs broker under a mandate."}]}}}, {"id": 6, "short": "Loading", "title": "Loading & vessel departure", "scene": "loading", "sceneDesc": "A container ship arrives at the quay. A terminal truck brings the container under a giant quay crane, which lifts it on board. Lashers secure the stack and the ship sails.", "beats": [{"id": "berth", "ms": 2800, "narration": {"1": "A terminal truck brings me under a giant [[quay-crane|quay crane]], next to my ship {vessel}.", "2": "{vessel} berths in its window; terminal tractors bring boxes from the yard in the crane sequence built from the stowage plan. [TO VERIFY:v61]", "3": "Berth window and crane intensity are agreed between carrier and terminal; a late vessel compresses the window and can leave boxes behind ('cut and run'). [TO VERIFY:v61]"}}, {"id": "load", "ms": 2700, "narration": {"1": "Up I go: the crane places me exactly where the plan says!", "2": "Loading: the crane driver places the box in its planned slot; the terminal tallies every move and updates the bay plan. [TO VERIFY:v62]", "3": "Discrepancies (box loaded in wrong slot, overstow) are fixed or recorded; the final BAPLIE goes to the carrier and the next ports. [TO VERIFY:v61]"}}, {"id": "lash", "ms": 1800, "narration": {"1": {"_by": "family", "reefer": "Workers fix me with steel bars and plug me into the ship's electricity, so I stay cold.", "*": "Workers secure me with steel bars and locks, so I don't move when the sea gets rough."}, "2": {"_by": "family", "reefer": "[[lashing|Lashing]] by terminal lashers; the reefer is plugged into a ship's socket and checked. [TO VERIFY:v57]", "tank": "Lashing, and DG stowage checked against the IMDG segregation and the DG manifest. [TO VERIFY:v59]", "oog": "Special lashing for OOG cargo, often on top of the stack or in dedicated slots. [TO VERIFY:v58]", "*": "[[lashing|Lashing]] with twistlocks, bars and turnbuckles by terminal lashers, per the ship's lashing plan. [TO VERIFY:v62]"}, "3": "Lashing forces depend on stack weight distribution — another reason VGMs and correct stowage matter. Inadequate lashing is a known factor in container losses. [TO VERIFY:v77]"}}, {"id": "docs", "ms": 1600, "narration": {"1": "The ship sails, so the carrier can issue the [[bl|Bill of Lading]]: I'm 'shipped on board'.", "2": "After loading, documentation issues the shipped-on-board B/L (or annotates a received B/L) and finalises the [[manifest]]. [TO VERIFY:v50]", "3": "On-board date and vessel must be true: they're checked against L/C terms. Freight prepaid originals are often released only after payment. [TO VERIFY:v33] [TO VERIFY:v50]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "The day after sailing, the shipper asks to correct the consignee's name, misspelled on the B/L. The three originals were already issued and couriered to the shipper's bank."}}], "fact": {"beat": "load", "text": {"1": "A quay crane can move a container every one to two minutes. [TO VERIFY:v62]", "2": "A quay crane makes about 25–35 moves an hour; big ships use several. [TO VERIFY:v62]"}}, "hotspots": [{"id": "crane", "beat": "berth", "essential": [1], "x": 125, "y": 26, "label": "Quay crane", "kind": "Equipment", "body": {"1": "The giant crane that lifts containers between the quay and the ship.", "2": "Ship-to-shore (STS) cranes reach across 20+ container rows on the largest ships; productivity drives berth time and cost. [TO VERIFY:v62]"}}, {"id": "vessel", "beat": "berth", "x": 880, "y": 390, "label": "Vessel", "kind": "Stakeholder", "body": {"1": "{vessel} — a container ship sailing from {pol} to {pod}.", "2": "Ship sizes depend on the lane: ultra-large ships on Asia–North Europe, smaller ones on lanes with shallower ports or canals. [TO VERIFY:v11] [TO VERIFY:v64]"}}, {"id": "lashing", "beat": "lash", "essential": [2, 3], "x": 556, "y": 250, "label": {"1": "Lashing", "2": "Lashing"}, "kind": "Safety", "body": {"1": "Steel bars and locks keep stacked containers in place during the voyage.", "2": "Twistlocks between tiers, lashing bars and turnbuckles; responsibility for lashing lies with the ship/terminal, but cargo inside the box is the shipper's (SLAC). [TO VERIFY:v62]", "3": "Losses at sea are rare relative to volumes but occur in heavy weather, often with misdeclared weights or lashing failures. [TO VERIFY:v77]"}}, {"id": "reeferplug", "beat": "lash", "when": {"family": ["reefer"]}, "x": 420, "y": 120, "label": "Reefer plugged", "kind": "Equipment", "body": {"1": "On board, I'm plugged into the ship's electricity.", "2": "Ships have a limited number of reefer plugs — one reason reefer bookings need approval. Crew check reefers daily or monitor remotely. [TO VERIFY:v57]"}}, {"id": "blinfo", "beat": "docs", "levels": [1], "essential": [1], "x": 640, "y": 120, "label": "Bill of Lading issued", "kind": "Document", "body": {"1": "Now that I'm loaded, the carrier issues the Bill of Lading: proof that it received me on board, and — for a 'to order' B/L — the 'key' to collect me at destination."}}, {"id": "obl", "beat": "docs", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "obl", "3": "obl"}, "x": 640, "y": 120, "label": "Shipped-on-board B/L", "kind": "Document"}], "docs": {"obl": {"title": "Original Bill of Lading", "heading": "BILL OF LADING — ORIGINAL", "sub": "Fictional example", "stamp": "ORIGINAL", "rows": [{"label": "B/L no.", "value": "{bookingNo}-01"}, {"label": "Consignee", "value": "To order of Demo Trade Bank (fictional)"}, {"label": "Vessel / ports", "value": "{vessel} {voyage} · {pol} → {pod}"}, {"label": "Container / seal", "value": "{containerNo} / {sealNo}"}, {"label": "Description", "value": "1 × {boxCode} STC {cargo} · SLAC"}, {"label": "Shipped on board", "value": "{etd} · {vessel} · {pol}", "zone": 1}, {"label": "Freight", "value": "Freight {freightTerms}"}, {"label": "Originals", "value": "THREE (3/3)", "zone": 2}, {"label": "Issued", "value": "{pol}, {etd} · signed for the carrier", "zone": 3}], "points": {"1": {"2": "The on-board notation (date, vessel, port) makes it a 'shipped on board' B/L — what most L/Cs require. [TO VERIFY:v50]"}, "2": {"2": "A full set of originals; at destination, one original (endorsed if 'to order') is surrendered to obtain release, and the others become void. [TO VERIFY:v68]"}, "3": {"2": "Signed by or for the carrier (or the master/agent). Place and date of issue are checked by banks."}}, "check": {"2": {"prompt": "What makes this a 'shipped on board' B/L?", "options": [{"id": "a", "correct": true, "text": "The on-board notation with the date and the vessel"}, {"id": "b", "text": "The 'freight prepaid' mention in the freight box", "fb": "Freight terms don't say whether the goods are on board."}, {"id": "c", "text": "The full set of three originals issued and signed", "fb": "The number of originals is unrelated."}, {"id": "d", "text": "The 'to order' consignee field, endorsed in blank", "fb": "That makes it negotiable, not 'on board'."}], "explain": "A 'shipped on board' B/L (or a 'received' B/L annotated on board) proves loading on a named vessel at a date — key for letters of credit. [TO VERIFY:v50]"}, "3": {"prompt": "The L/C requires shipment no later than Day 6. The on-board date is {etd}. What now?", "options": [{"id": "a", "correct": true, "text": "Discrepant: seek an L/C amendment or the buyer's waiver; the B/L date stays true"}, {"id": "b", "text": "Re-date the B/L to Day 6 as a courtesy, since the delay is only one or two days", "fb": "Antedating a B/L is fraud."}, {"id": "c", "text": "Issue a second B/L dated Day 6 and keep the true one in the carrier's own file", "fb": "Two B/Ls for one shipment is fraud too."}, {"id": "d", "text": "Nothing to do: banks check amounts and names on the B/L, never the dates", "fb": "Banks check dates strictly under UCP 600."}], "explain": "UCP 600 banks examine dates strictly; the commercial fix is an L/C amendment or waiver, never a false B/L. [TO VERIFY:v50]"}}}}, "dossier": {"documents": ["**Shipped-on-board B/L** — or received B/L annotated on board. [TO VERIFY:v50]", "**Final bay plan (BAPLIE)** and load report. [TO VERIFY:v61]", "**Manifest** — cargo list for customs at the next ports.", {"text": "**DG manifest** for the master. [TO VERIFY:v59]", "when": {"family": ["tank"]}}], "costs": ["**Origin THC** (if not already invoiced). [TO VERIFY:v35]", "**Ocean freight** — prepaid now, or collect at destination ({freightTerms}).", "**B/L amendment fee** after issuance. [TO VERIFY:v12]", "**Courier** for originals."], "risks": ["**Cut and run** — a late vessel sails without some boxes.", "**B/L errors** after issuance → recall originals, amendment fee, L/C problems.", "**Lashing failure** in heavy weather → cargo loss. [TO VERIFY:v77]", "**Antedated B/L** → fraud exposure, loss of carrier defences."], "jobs": ["**Vessel operations** — berth windows, port calls, ETA updates.", "**Documentation** — B/L issuance, amendments, manifest.", "**Finance / credit control** — prepaid freight before release of originals. [TO VERIFY:v33]", "**Customer service** — departure confirmation to customers."]}, "incoNote": {"_by": "group", "C": "Under C-rules the risk passes here, on board — but the seller keeps paying costs to destination.", "*": ""}, "keyPoints": {"1": ["A quay crane loads me onto the ship following the plan.", "Lashing keeps the stacks in place during the voyage.", "Once I'm on board, the carrier issues the Bill of Lading."], "2": ["Only boxes on the load list are loaded, in the planned crane sequence.", "Lashing and stowage are the ship's job; cargo securing inside the box is the shipper's.", "The shipped-on-board B/L proves loading on a named vessel and date."], "3": ["B/L dates and vessels must be true — L/C problems are solved commercially, never by antedating.", "Amending an issued negotiable B/L requires the full set of originals back.", "Under FOB/CFR/CIF, risk passes on board here."]}, "question": {"1": {"prompt": "I'm on board and the ship has sailed. What happens next?", "hint": {"_by": "transship", "yes": "My first ship is a small one — I'll change ship on the way.", "*": "There's a whole ocean between me and {pod}."}, "options": [{"id": "a", "correct": true, "text": {"_by": "transship", "yes": "I sail to {hub}, change ship there, then cross to {pod}.", "*": "I cross the whole ocean to {pod}, a trip of several weeks."}, "confirm": {"_by": "transship", "yes": "Exactly. A feeder takes me to {hub}, where I'm transshipped onto a big mainline ship to {pod}.", "*": "Exactly. The voyage takes {transit}; the carrier tracks the ship and updates the arrival date."}}, {"id": "b", "text": "The ship drops me off at the customer's door the very next day.", "why": "The ship has an ocean to cross first.", "realLife": "Even the fastest services take weeks between continents.", "whenRight": "Short-sea or domestic services can take a day or two — not this route."}, {"id": "c", "text": "I'm unloaded at the next port on the way and checked there.", "why": "Ships call at several ports, but I stay on board until my port of discharge (unless transshipped).", "realLife": "Boxes not due at a port stay on board; unloading the wrong box costs a lot.", "whenRight": "Only for boxes destined for that port."}]}, "2": {"prompt": "{vessel} has sailed with the box on board; B/L issued. What happens next?", "options": [{"id": "a", "correct": true, "text": {"_by": "transship", "yes": "Feeder to {hub}, transshipment onto the mainline vessel, then the long-haul leg to {pod}.", "*": "Ocean voyage to {pod}; the carrier tracks the vessel and sends the arrival notice in time."}, "confirm": {"_by": "transship", "yes": "Correct. At the hub the box is discharged, stacked and reloaded onto {vessel}; missed connections are the main risk. [TO VERIFY:v73]", "*": "Correct. Transit depends on routing (Suez, Cape, Panama) and port rotation. [TO VERIFY:v10] [TO VERIFY:v63]"}}, {"id": "b", "text": "The consignee lodges the import declaration on board, as soon as the vessel has sailed.", "why": "Import declarations are lodged with destination customs, typically when the goods arrive or shortly before.", "realLife": "Early lodging is possible in some regimes, but nothing is done 'on board'.", "whenRight": "Pre-arrival lodging exists in some regimes. [TO VERIFY:v67]"}, {"id": "c", "text": "The original B/L is surrendered to the carrier at departure, so that the release can be prepared early.", "why": "Originals go to the shipper (and banks) and are surrendered at destination to get release.", "realLife": "Surrendering at origin = express (telex) release, a deliberate choice.", "whenRight": "When the shipper chooses express release, originals are surrendered at origin."}, {"id": "d", "text": "The ENS for destination customs is filed now, as the vessel has actually left the port.", "why": "For deep-sea containers, the ENS is due before loading at origin.", "realLife": "Filing after loading would already have triggered problems. [TO VERIFY:v23]", "whenRight": "Other transport modes have different deadlines."}]}, "3": {"prompt": "Case: the consignee's name is misspelled on an issued B/L; the 3/3 originals are already at the bank. What is the correct procedure?", "options": [{"id": "a", "correct": true, "text": "Retrieve all 3/3 originals, cancel them and reissue a corrected set; update manifest and filings.", "confirm": "Right. A negotiable B/L can only be amended against surrender of the full set, otherwise two valid documents would circulate. Manifest/ICS2 data must be corrected too. [TO VERIFY:v12] [TO VERIFY:v68]"}, {"id": "b", "text": "Issue a corrected set of originals now, and tell the bank in writing that the first set no longer counts.", "why": "Two valid negotiable sets would circulate.", "realLife": "Risk of double claims and misdelivery.", "whenRight": "Never while the original set is outstanding."}, {"id": "c", "text": "Correct only the manifest and the advance filings, and leave the issued original B/L set as it is.", "why": "B/L and manifest must match, and the bank will see the error.", "realLife": "Release problems at destination and L/C discrepancies.", "whenRight": "Only for data that isn't on the B/L."}, {"id": "d", "text": "Send the bank a signed carrier letter stating that the consignee's name on the B/L is misspelled.", "why": "A letter doesn't change a document of title.", "realLife": "The bank will still treat the B/L as presented.", "whenRight": "Never as a substitute for reissuing."}]}}}, {"id": 7, "short": "Voyage", "title": "Ocean voyage", "scene": "map", "sceneDesc": "A schematic world map. The ship carrying the container follows the route from the port of loading to the port of discharge, through a canal and, on the transshipment route, via a hub.", "beats": [{"id": "depart", "ms": 1200, "narration": {"1": {"_by": "transship", "yes": "We're off: a small [[feeder]] ship takes me from {pol} to the [[hub]] in {hub}.", "*": "We're off: {vessel} sails from {pol} to {pod} — {transit}."}, "2": {"_by": "transship", "yes": "Feeder {feeder} sails to {hub}; the mainline connection on {vessel} is planned in the booking. [TO VERIFY:v54]", "*": "{vessel} {voyage} departs {pol}; port rotation and routing per the service schedule: {transit}. [TO VERIFY:v10]"}, "3": "Schedule reliability matters: delays cascade into missed connections, berth windows and customer deadlines. ETAs are updated to customers through the voyage."}}, {"id": "hub", "when": {"transship": true}, "ms": 2700, "narration": {"1": "In {hub}, I move from the feeder to the big ship {vessel}: that's [[transshipment]].", "2": "[[transshipment|Transshipment]] at {hub}: discharge from the feeder, short dwell in the hub yard, reload onto {vessel}. Hub dwell is typically 1–3 days. [TO VERIFY:v73]", "3": "Connection risk: feeder delays, hub congestion or mainline omissions roll boxes to the next mainline sailing. Transshipment boxes are re-planned at the hub. [TO VERIFY:v73]"}}, {"id": "canal", "ms": 2700, "narration": {"1": {"_by": "route", "GYE-ANR": "We pass through the Panama Canal, a shortcut between the Pacific and the Atlantic.", "*": "We reach the Suez Canal, the shortcut between Asia and Europe — when it's safe to use."}, "2": {"_by": "route", "GYE-ANR": "Panama Canal transit: draft limits and water levels can restrict sizes and slots. [TO VERIFY:v55]", "*": "Suez routing saves 10+ days versus the Cape of Good Hope; since 2024 many services have been rerouted via the Cape for security reasons. [TO VERIFY:v63]"}, "3": {"_by": "route", "GYE-ANR": "Canal restrictions translate into fewer slots or weight limits; carriers may levy surcharges. [TO VERIFY:v55]", "*": "Routing changes add transit time, fuel cost (BAF / contingency surcharges) and ripple effects on equipment and schedules. [TO VERIFY:v63] [TO VERIFY:v35]"}}}, {"id": "ocean", "ms": 2400, "narration": {"1": {"_by": "family", "reefer": "At sea, my cooling unit keeps {cargo} at {setPoint}, watched from afar by the carrier.", "*": "Out at sea, the crew check the lashings and the ship's route avoids the worst weather."}, "2": {"_by": "family", "reefer": "Reefer monitored by the crew and, often, remotely by the carrier's reefer team: set point, supply/return air, alarms. [TO VERIFY:v57]", "tank": "DG on board: the master holds the DG manifest and emergency information for each class and UN number. [TO VERIFY:v59]", "*": "The carrier tracks position and ETA; customer service updates customers if the ETA changes."}, "3": "Weather routing, lashing checks, reefer and DG monitoring. Incidents at sea (fire, stack collapse) can trigger [[general-average]]. [TO VERIFY:v76]"}}, {"id": "arrive", "ms": 2400, "narration": {"1": "Land ahoy: we're nearing {pod}, and the customer knows I'm coming.", "2": "Approaching {pod}. The carrier has sent the [[arrival-notice]] and filed arrival data with {importCustoms}. [TO VERIFY:v66]", "3": "Arrival: berth window confirmed, discharge list and import manifest transmitted; customs risk analysis already ran on the ENS. [TO VERIFY:v23] [TO VERIFY:v67]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": {"_by": "transship", "yes": "The late feeder in {hub} made your box miss {vessel}; the next mainline sails in 7 days. The consignee has a DAP delivery deadline.", "*": "A hold fire is put out and the owners declare general average. Your customer's cargo was not damaged."}}}], "fact": {"beat": "ocean", "text": {"_by": "transship", "yes": {"1": "Singapore is the world's largest transshipment hub. [TO VERIFY:v73]", "2": "Singapore handles about 39–41 million TEU a year, mostly transshipment. [TO VERIFY:v73]"}, "*": {"1": "Only a few hundred to a few thousand boxes a year are lost at sea. [TO VERIFY:v77]", "2": "The World Shipping Council counted 221 boxes lost at sea in 2023. [TO VERIFY:v77]"}}}, "hotspots": [{"id": "hub", "beat": "hub", "when": {"transship": true}, "essential": [1, 2, 3], "x": 760, "y": 345, "label": "Transshipment hub", "kind": "Operations", "body": {"1": "At the hub, my feeder ship meets the big mainline ship. I change ships there — no truck, no customs.", "2": "Transshipment boxes stay under the carrier's control; they're planned on the connecting vessel by the hub planners. Missed connections are the main risk. [TO VERIFY:v73]"}}, {"id": "canal", "beat": "canal", "essential": [1, 2, 3], "x": {"_by": "route", "GYE-ANR": 250, "*": 560}, "y": {"_by": "route", "GYE-ANR": 215, "*": 150}, "label": {"_by": "route", "GYE-ANR": "Panama Canal", "*": "Suez Canal"}, "kind": "Route", "body": {"_by": "route", "GYE-ANR": {"1": "The Panama Canal links the Pacific and the Atlantic, saving thousands of kilometres around South America.", "2": "Draft and water-level restrictions can limit vessel size and the number of daily transits; carriers adjust services and may add surcharges. [TO VERIFY:v55]"}, "*": {"1": "The Suez Canal saves a long trip around Africa. When it's not safe, ships take the Cape of Good Hope route instead — about 10 more days.", "2": "Since 2024, many Asia–Europe services have avoided the Red Sea and sailed via the Cape: longer transits, more fuel and new surcharges. Check the current situation. [TO VERIFY:v63]"}}}, {"id": "cape", "beat": "canal", "levels": [2, 3], "when": {"route": ["SHA-LEH", "HCM-SIN-LEH"]}, "x": 470, "y": 400, "label": "Cape route", "kind": "Route", "body": {"2": "The Cape of Good Hope route adds roughly 3,000–3,500 nautical miles and 10+ days versus Suez, depending on speed. [TO VERIFY:v63]"}}, {"id": "reefermon", "beat": "ocean", "when": {"family": ["reefer"]}, "essential": [1, 2, 3], "x": 815, "y": 318, "label": "Reefer monitoring", "kind": "Equipment", "body": {"1": "My cooling unit reports its temperature regularly, so the carrier can act if something goes wrong.", "2": "Remote reefer monitoring shows set point, supply/return air and alarms; deviations trigger crew intervention and customer information. [TO VERIFY:v57]", "3": "Temperature logs (unit download) are key evidence in claims; a set point error at booking can't be fixed at sea without the shipper's instruction. [TO VERIFY:v56]"}}, {"id": "ocean", "beat": "ocean", "when": {"family": ["dry", "tank", "oog"]}, "x": 300, "y": 160, "label": "Weather & lashing", "kind": "Safety", "body": {"1": "Big waves make ships roll. Good lashing and correct weights keep containers safe.", "2": "Parametric rolling and heavy weather stress lashings; misdeclared weights increase the risk of stack collapse. [TO VERIFY:v77]"}}, {"id": "eta", "beat": "arrive", "x": {"_by": "route", "GYE-ANR": 300, "*": 640}, "y": {"_by": "route", "GYE-ANR": 340, "*": 110}, "label": "Transit time", "kind": "Schedule", "body": {"1": "{transit}. The exact time depends on the route and the ports the ship calls at.", "2": "{transit}. Published transit times are port-to-port and indicative; door-to-door adds pre-carriage, dwell and on-carriage. [TO VERIFY:v10] [TO VERIFY:v54] [TO VERIFY:v55]"}}], "dossier": {"documents": ["**Manifest** — sent to destination customs and ports.", "**Arrival notice** — prepared for the consignee and notify party. [TO VERIFY:v66]", {"text": "**Reefer temperature log** — downloaded on request or for claims. [TO VERIFY:v57]", "when": {"family": ["reefer"]}}, {"text": "**Transshipment re-planning** at {hub}.", "when": {"transship": true}}], "costs": ["**BAF / emergency surcharges** when routing or fuel changes. [TO VERIFY:v35]", "**Canal-related surcharges** at some carriers. [TO VERIFY:v35]", {"text": "**Transshipment** is included in the freight — no extra charge to the customer by default.", "when": {"transship": true}}, "**General average contributions** after major incidents. [TO VERIFY:v76]"], "risks": ["**Delays** → missed delivery windows and connections.", "**Routing changes** (Suez/Cape) → +10 days or more. [TO VERIFY:v63]", "**Temperature excursion** (reefers) → cargo claims. [TO VERIFY:v57]", "**Incidents at sea** → general average, delays, cargo loss. [TO VERIFY:v76]"], "jobs": ["**Network & vessel operations** — schedules, routing, port calls.", "**Transshipment / hub planning** — connections.", "**Reefer management** — remote monitoring.", "**Customer service** — ETA updates; **Claims** — incidents at sea."]}, "incoNote": {"_by": "group", "C": "Under C-rules, the buyer carries the risk during the voyage although the seller paid the freight — insurance matters (CIF/CIP). [TO VERIFY:v18]", "F": "Under F-rules, the buyer contracted this carriage and carries the voyage risk.", "E": "Under EXW, the buyer carries the voyage risk.", "D": "Under D-rules, the seller still carries the risk during the voyage."}, "keyPoints": {"1": ["The ocean voyage takes weeks; the route depends on canals and safety.", "On some routes, the box changes ship at a hub: that's transshipment.", "Reefers are monitored all the way; the customer is told before arrival."], "2": ["Transit times are indicative and depend on routing (Suez, Cape, Panama). [TO VERIFY:v63]", "Transshipment adds a hub dwell and a connection risk.", "The arrival notice and import manifest are sent before arrival."], "3": ["Missed connections: re-protect the box and update ETAs fast; check delivery commitments.", "General average makes cargo owners provide security before delivery — insurance matters.", "Routing changes drive surcharges and ripple through equipment and schedules."]}, "question": {"1": {"prompt": "The ship is approaching {pod}. What happens next?", "hint": "I'm still on the ship. How do I get onto the quay?", "options": [{"id": "a", "correct": true, "text": "The ship berths, and a big crane lifts me down onto the quay.", "confirm": "Yes! At {pod}, a quay crane discharges me and I go to the import yard."}, {"id": "b", "text": "A truck drives up a ramp onto the ship to pick me up there.", "why": "Container ships are worked by cranes, not trucks driving on board.", "realLife": "Only roll-on/roll-off ships carry trucks on board.", "whenRight": "On ro-ro ships (cars, trailers) — a different kind of shipping."}, {"id": "c", "text": "The ship sails up the river and drops me at the customer's door.", "why": "I have to be unloaded and cleared by customs first.", "realLife": "No box leaves the terminal without customs and carrier release.", "whenRight": "That's step 10."}]}, "2": {"prompt": "{vessel} is approaching {pod}. What happens next?", "options": [{"id": "a", "correct": true, "text": "Berthing and discharge; import yard while customs risk-assesses and the consignee prepares clearance.", "confirm": "Correct. Discharge follows the discharge list; customs has already risk-assessed the ENS and manifest. [TO VERIFY:v67]"}, {"id": "b", "text": "The box goes straight from the ship's side onto the consignee's truck, with no yard stay at all.", "why": "Import boxes go to the yard; customs and carrier releases come first.", "realLife": "Direct delivery is exceptional and needs prior clearance.", "whenRight": "Special cargo with pre-arranged clearance."}, {"id": "c", "text": "Customs clears the goods automatically at discharge, without any import declaration being lodged.", "why": "Goods need an import declaration (or another customs procedure) to enter free circulation.", "realLife": "Undeclared goods stay in temporary storage, then face penalties.", "whenRight": "Transit or transshipment procedures follow different rules."}, {"id": "d", "text": "The box is transshipped again at {pod} onto a feeder before it may be handed over to the consignee.", "why": "{pod} is the final port of discharge in this booking.", "realLife": "Extra transshipment would add time and cost not booked.", "whenRight": "When the booking's final port is a feeder port beyond the hub."}]}, "3": {"_by": "transship", "yes": {"prompt": "Case: the box missed its mainline connection at {hub}; next sailing in 7 days; DAP delivery deadline at risk. What do you do?", "options": [{"id": "a", "correct": true, "text": "Tell the customer the new ETA now, seek faster re-protection (other service or slot), log the cause.", "confirm": "Right. Re-protection options depend on network and slot agreements; transparent, early ETA updates let the seller (DAP) manage its buyer and costs. [TO VERIFY:v73]"}, {"id": "b", "text": "Wait quietly for the next mainline sailing; the ETA will update itself in the tracking system anyway.", "why": "The customer loses the chance to adapt.", "realLife": "Contract penalties and a damaged relationship.", "whenRight": "Never."}, {"id": "c", "text": "Ask the customer to pay a new ocean freight for the next sailing, since the connection was missed.", "why": "The booked freight covers carriage to {pod}, including the connection.", "realLife": "Charging again would breach the contract of carriage.", "whenRight": "Only if the customer asks for a premium service."}, {"id": "d", "text": "Truck the box from {hub} to Europe on a land bridge, to save the seven days lost at the hub.", "why": "There's no practical road link; it's not an option.", "realLife": "Not feasible.", "whenRight": "Never on this lane."}]}, "*": {"prompt": "Case: fire in a hold, general average declared; your customer's cargo is undamaged. What must the consignee do to obtain delivery?", "options": [{"id": "a", "correct": true, "text": "Provide general average security — usually a GA bond plus an insurer's guarantee — before release.", "confirm": "Right. All cargo interests contribute to GA, even undamaged ones. Insured cargo: the insurer provides the guarantee; uninsured cargo may need a cash deposit. [TO VERIFY:v76]"}, {"id": "b", "text": "Nothing: undamaged cargo is not affected by general average and is released as soon as it lands.", "why": "GA is shared by all interests in proportion to value, damaged or not.", "realLife": "Release is withheld until security is provided.", "whenRight": "Never under a GA declaration."}, {"id": "c", "text": "Pay the full cost of the fire and the repairs to the vessel, then claim them back from the shipper.", "why": "GA is shared proportionally among ship and all cargo.", "realLife": "Each interest pays its share after adjustment, which can take years.", "whenRight": "Never."}, {"id": "d", "text": "Present a new set of original B/Ls issued after the fire, since the old set is void under GA rules.", "why": "The B/L doesn't change; security is what's required.", "realLife": "Release depends on GA security plus the usual release conditions.", "whenRight": "Never."}]}}}}, {"id": 8, "short": "Discharge", "title": "Discharge at the port of destination", "scene": "discharge", "sceneDesc": "The ship arrives at the destination quay. A quay crane lifts the container off the ship onto a terminal truck, which takes it to the import yard.", "beats": [{"id": "arrive", "ms": 3300, "narration": {"1": "Welcome to {pod}: my ship berths at {podTerminal}!", "2": "{vessel} berths at {podTerminal}. The discharge list tells the terminal which boxes come off here. [TO VERIFY:v61]", "3": "Discharge planning from the BAPLIE and import manifest; customs has risk-assessed the cargo data, and some boxes may already be flagged for inspection. [TO VERIFY:v67]"}}, {"id": "discharge", "ms": 2600, "narration": {"1": "A crane lifts me off the ship and puts me down on a terminal truck.", "2": "Discharge by quay crane; lashings removed first. Damage found at discharge is recorded — key for claims. [TO VERIFY:v62]", "3": "Discharge and damage survey; seal checked against the manifest. A seal discrepancy here triggers investigation and possibly a customs hold."}}, {"id": "yard", "ms": 2400, "narration": {"1": {"_by": "family", "reefer": "In the import yard I'm plugged in again, and the customer knows I've arrived.", "*": "In the import [[yard]], I wait for my paperwork; the customer knows I've arrived."}, "2": "The [[arrival-notice]] gave the consignee and notify party the charges, free time and release conditions. [[demurrage|Demurrage]] free time starts at discharge. [TO VERIFY:v66]", "3": "Import dwell: demurrage/storage free time running; customs selection (scan, physical) adds moves and days. Combined D&D tariffs may apply. [TO VERIFY:v21] [TO VERIFY:v66]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "Customs picks the box for scan and inspection (3 extra days) and demurrage free time ends tomorrow. The consignee asks the carrier to waive all demurrage 'because it's customs' fault'."}}], "fact": {"beat": "yard", "text": {"_by": "route", "GYE-ANR": {"1": "Antwerp-Bruges is a top European container port and a fruit hub. [TO VERIFY:v74]", "2": "Antwerp-Bruges handles around 13 million TEU a year. [TO VERIFY:v74]"}, "*": {"1": "Le Havre is France's largest container port. [TO VERIFY:v74]", "2": "HAROPA handles about 3 million TEU a year, mostly at Le Havre. [TO VERIFY:v74]"}}}, "hotspots": [{"id": "crane", "beat": "discharge", "essential": [1], "x": 125, "y": 26, "label": "Discharge", "kind": "Operations", "body": {"1": "The crane lifts me off the ship. Workers check that I'm not damaged and that my seal is intact.", "2": "Discharge sequence follows the bay plan; damage and seal checks are recorded. [TO VERIFY:v62]"}}, {"id": "anl1", "beat": "yard", "levels": [1], "essential": [1], "x": 640, "y": 120, "label": "Arrival notice", "kind": "Document", "body": {"1": "A message from the carrier to the customer: 'Your container has arrived. Here is what you need to pay and do to collect it.'"}}, {"id": "an", "beat": "yard", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "an", "3": "an"}, "x": 640, "y": 120, "label": "Arrival notice", "kind": "Document"}, {"id": "dem", "beat": "yard", "levels": [2, 3], "x": 820, "y": 330, "label": "Demurrage clock", "kind": "Charge", "body": {"2": "Import [[demurrage]] runs from discharge (or day after) until full gate-out, after the free time. Illustrative: {freeDays} days free, then {cur}40/day storage-type charges. [TO VERIFY:v21] [TO VERIFY:v12]", "3": "Customs inspections, missing originals or unpaid freight don't stop the clock unless the tariff or contract says so. [TO VERIFY:v72]"}}, {"id": "customs", "beat": "yard", "x": 560, "y": 200, "label": "Customs risk check", "kind": "Stakeholder", "body": {"1": "{importCustoms} check the data about me. Most containers are not opened.", "2": "Risk analysis on ENS and declarations; selected boxes are scanned or inspected, with moves and costs for the cargo side. [TO VERIFY:v67]"}}, {"id": "plug", "beat": "yard", "when": {"family": ["reefer"]}, "x": 420, "y": 120, "label": "Plugged again", "kind": "Equipment", "body": {"1": "Back on electricity so {cargo} stays at {setPoint}.", "2": "Reefer plugged in the import rack; plug-in and monitoring charges may apply after free time. [TO VERIFY:v57]"}}], "docs": {"an": {"title": "Arrival notice", "heading": "ARRIVAL NOTICE", "sub": "{pod} · fictional example", "stamp": "NOTICE", "rows": [{"label": "To", "value": "Consignee / notify party (fictional)"}, {"label": "B/L no.", "value": "{bookingNo}-01"}, {"label": "Vessel / ETA", "value": "{vessel} {voyage} · {eta}"}, {"label": "Container", "value": "{containerNo} · {boxCode} · {cargo}"}, {"label": "Charges due", "value": {"_by": "freight", "Buyer": "Ocean freight (collect) · destination THC · documentation fee", "*": "Destination THC · documentation fee (freight prepaid)"}, "zone": 1}, {"label": "Free time", "value": "Demurrage {freeDays} days from discharge (illustrative)", "zone": 2}, {"label": "Release requires", "value": "1 original B/L (or waybill / express release) · charges paid · customs release", "zone": 3}], "points": {"1": {"2": "Collect freight and destination charges must be paid (or covered by credit) before release. Charge names and amounts vary by carrier and port. [TO VERIFY:v35] [TO VERIFY:v66]"}, "2": {"2": "Free time per tariff or contract; after it, daily charges apply. [TO VERIFY:v21]"}, "3": {"2": "Carrier release (commercial) and customs release (legal) are two different things — both are needed. [TO VERIFY:v68]"}}, "check": {"2": {"prompt": "What does the consignee need to obtain release from the carrier?", "options": [{"id": "a", "correct": true, "text": "An original B/L (or waybill / express release) and the charges paid"}, {"id": "b", "text": "The VGM declaration and the gate-in receipt from the export terminal", "fb": "The VGM matters for loading at origin, not for release."}, {"id": "c", "text": "The booking confirmation and the arrival notice, printed and signed", "fb": "The booking is the shipper's contract document at origin."}, {"id": "d", "text": "The export declaration from origin, stamped by the exporter's customs", "fb": "Export clearance happened at origin."}], "explain": "Carrier release depends on the transport document and payment; customs release is needed in addition. [TO VERIFY:v68]"}, "3": {"prompt": "Freight is collect. The consignee pays destination THC but disputes the ocean freight amount. Can the carrier release?", "options": [{"id": "a", "correct": true, "text": "No: not until the collect freight is paid or secured; the dispute is handled separately"}, {"id": "b", "text": "Yes: THC is the only charge the terminal needs, so the carrier must release the box now", "fb": "Collect freight is part of what must be settled."}, {"id": "c", "text": "Yes, as long as the original B/L is presented, whatever is still owed on the freight", "fb": "The B/L is necessary but not sufficient when freight is collect."}, {"id": "d", "text": "Only customs can decide, because freight disputes block the import declaration too", "fb": "Payment conditions are a carrier matter."}], "explain": "Carriers usually hold cargo until collect freight is paid (lien rights depend on the B/L terms and law); disputes go to sales/credit. [TO VERIFY:v33]"}}}}, "dossier": {"documents": ["**Arrival notice** — charges, free time, release conditions. [TO VERIFY:v66]", "**Import manifest** — filed with {importCustoms}.", "**Discharge report** — damage and seal remarks.", {"text": "**Reefer download** on request. [TO VERIFY:v57]", "when": {"family": ["reefer"]}}], "costs": ["**Destination THC** and documentation fee. [TO VERIFY:v35]", "**Collect freight** when freight terms are collect.", "**Demurrage / storage** after free time. [TO VERIFY:v21]", "**Inspection costs** if customs selects the box. [TO VERIFY:v67]"], "risks": ["**Damage found at discharge** → survey and claims.", "**Customs selection** → extra days and moves.", "**Consignee not reachable** → box sits, demurrage builds.", "**Unpaid collect freight** → cargo held. [TO VERIFY:v33]"], "jobs": ["**Import customer service** — arrival notices, release questions.", "**Port / terminal operations** — discharge, yard, inspections.", "**Finance** — collect freight, destination charges.", "**D&D team** — demurrage invoicing and disputes. [TO VERIFY:v72]"]}, "incoNote": {"_by": "group", "C": "Under C-rules, the seller's costs end here at the destination port; destination charges depend on the contract of carriage.", "D": "Under D-rules, the seller still carries the risk and organises the next steps; import clearance is the buyer's (DAP/DPU) or the seller's (DDP).", "*": "Under {incoterm}, the buyer has carried the risk since step {riskStep}."}, "keyPoints": {"1": ["At {pod}, a crane unloads me and I wait in the import yard.", "The carrier sends an arrival notice to the customer.", "A free-time clock starts: waiting too long costs money."], "2": ["Discharge checks (damage, seal) are evidence for claims.", "The arrival notice sets charges, free time and release conditions.", "Import demurrage runs from discharge until gate-out, after free time."], "3": ["Customs inspections don't stop demurrage by default — check the tariff and contract.", "Collect freight must be settled before release.", "Waivers are commercial decisions, documented and approved."]}, "question": {"1": {"prompt": "I'm in the import yard. What happens next?", "hint": "Two organisations must say 'yes' before I can leave the port.", "options": [{"id": "a", "correct": true, "text": "Customs checks my papers, then the shipping line lets me go to the customer.", "confirm": "Exactly. Customs gives the legal green light; the carrier gives the commercial one (paperwork and payment). Under {incoterm}, import customs is the {importBy}'s job."}, {"id": "b", "text": "A truck takes me straight to the customer, with no papers or checks needed.", "why": "I can't leave the terminal without customs and carrier release.", "realLife": "The gate would refuse the truck.", "whenRight": "After release — that's step 10."}, {"id": "c", "text": "I go back on board and sail on to the next port, because I arrived too early.", "why": "{pod} is my destination.", "realLife": "Taking me back would cost a lot and delay the customer.", "whenRight": "Only if I was discharged by mistake."}]}, "2": {"prompt": "Box discharged at {pod}, arrival notice sent. What happens next?", "options": [{"id": "a", "correct": true, "text": "Import clearance by the broker; B/L surrender and charges paid; carrier and customs releases to the terminal.", "confirm": "Correct. Two releases are needed: customs (legal) and carrier (commercial). Under {incoterm}, import clearance: {importBy}. [TO VERIFY:v67] [TO VERIFY:v68]"}, {"id": "b", "text": "The terminal releases the box to any haulier who shows a copy of the arrival notice sent earlier.", "why": "The arrival notice is information, not a release.", "realLife": "Terminals only release against carrier and customs releases.", "whenRight": "Never."}, {"id": "c", "text": "With freight prepaid, the box is released straight away, without any document or customs release.", "why": "Prepaid freight doesn't replace the B/L, waybill or express release.", "realLife": "Releasing without the right document risks misdelivery.", "whenRight": "With a sea waybill or express release, no original is needed — but release is still controlled. [TO VERIFY:v68]"}, {"id": "d", "text": "The shipper presents its export declaration at {pod}, which then counts as the import clearance there too.", "why": "Export clearance was done at origin.", "realLife": "Destination customs need the import declaration.", "whenRight": "Never."}]}, "3": {"prompt": "Case: customs inspection adds 3 days; free time ends tomorrow; the consignee asks for a full demurrage waiver. What is the correct response?", "options": [{"id": "a", "correct": true, "text": "Demurrage runs per tariff, inspections included; give the daily rate, help clear, escalate any waiver.", "confirm": "Right. Customs delays are normally for cargo account; consistent application of the tariff and documented exceptions avoid disputes. Some regulators set billing rules. [TO VERIFY:v72]"}, {"id": "b", "text": "Waive everything at once: customs inspection delays are never the customer's fault or responsibility.", "why": "Waivers outside the tariff create inconsistency and revenue leakage.", "realLife": "Other customers will ask for the same.", "whenRight": "If the contract has a customs-inspection clause."}, {"id": "c", "text": "Stop the demurrage clock until customs finishes, then restart it with the free days still left.", "why": "Clock events are defined by the tariff, not by the situation.", "realLife": "An unauthorised stop is a billing error.", "whenRight": "If the tariff explicitly suspends free time for inspections."}, {"id": "d", "text": "Tell the consignee to ask customs to pay the demurrage, since the inspection caused the delay.", "why": "Customs doesn't pay carrier charges.", "realLife": "Unhelpful and damaging to the relationship.", "whenRight": "Never."}]}}}, {"id": 9, "short": "Import & release", "title": "Import formalities, customs clearance & release", "scene": "flow", "sceneDesc": "Four illustrated stations show what must happen before the container can leave the port: arrival notice, import declaration, Bill of Lading and payment, and release with a pick-up code.", "flow": {"strip": "Import demurrage free time: {freeDays} days from discharge (illustrative)", "stations": [{"beat": "notice", "icon": "mail", "title": "Arrival notice", "sub": "Carrier → Consignee"}, {"beat": "declare", "icon": "customs", "title": "Import declaration", "sub": "Broker → {importCustoms}"}, {"beat": "bl", "icon": "pay", "title": "B/L + payment", "sub": "Bank → Consignee → Carrier"}, {"beat": "release", "icon": "stamp", "title": "Release & pick-up code", "sub": "Carrier + customs → Terminal"}], "incident": {"station": 2, "text": "ORIGINALS MISSING"}}, "beats": [{"id": "notice", "ms": 1600, "narration": {"1": "With my arrival notice, the customer needs two 'yes': one from customs, one from the carrier.", "2": "Import starts with the arrival notice: charges, free time and release conditions. Two releases are needed — customs (legal) and carrier (commercial). [TO VERIFY:v66]", "3": "Release = customs release + carrier release (transport document, payment, holds) + terminal release (PIN or digital pick-up right). Any one missing blocks the gate-out. [TO VERIFY:v68]"}}, {"id": "declare", "ms": 2400, "narration": {"1": "A customs broker declares me to {importCustoms}, and the importer pays duties and taxes.", "2": "The [[import-declaration]] (HS code, customs value, origin, preferential proofs) is lodged by the importer's broker; duties and import VAT are paid or deferred; [[eori]] required in the EU. [TO VERIFY:v67]", "3": "Customs value, classification and origin drive duties; risk-based selection may add a scan or physical exam. Under DDP the seller is the importer — check EU representation. [TO VERIFY:v26] [TO VERIFY:v67]"}, "caption": {"2": "Under {incoterm}, import clearance is done by the {importBy}."}}, {"id": "bl", "ms": 2400, "narration": {"1": "The customer hands in an original Bill of Lading and pays what's due — like a luggage ticket.", "2": "For a 'to order' B/L, the bank [[endorsement|endorses]] an original to the consignee, who surrenders it to the carrier with payment of collect freight and charges. Sea waybill or express release: no original needed. [TO VERIFY:v68]", "3": "The carrier checks the endorsement chain and that the presenter is the lawful holder; one original surrendered accomplishes the set. Delivery without original = misdelivery exposure. [TO VERIFY:v75]"}}, {"id": "release", "ms": 1800, "narration": {"1": "Customs and carrier both say yes: I'm released, with a secret pick-up code for the truck!", "2": "Customs release and carrier release reach the terminal (often via a port community system); the haulier gets a [[pin]] or digital pick-up right and books a slot. [TO VERIFY:v68]", "3": "Release data must match the collecting haulier; PIN security matters — cargo theft by fraudulent pick-up is a known risk, hence secure digital pick-up schemes. [TO VERIFY:v68]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "The originals are stuck at the buyer's bank (L/C discrepancy) while demurrage runs. The consignee asks you to release the box against a letter of indemnity ([[loi]])."}}], "fact": {"beat": "bl", "text": {"1": "Three original B/Ls are usually issued; one is enough to collect the goods.", "2": "Delivery without the original B/L causes many large claims. [TO VERIFY:v75]"}}, "hotspots": [{"id": "customs", "beat": "declare", "levels": [1], "essential": [1], "x": 364, "y": 236, "label": "Import customs", "kind": "Rule", "body": {"1": "Customs checks what I carry, collects duties and taxes, and makes sure nothing forbidden enters. Under {incoterm}, the {importBy} handles import customs."}}, {"id": "idec", "beat": "declare", "levels": [2, 3], "essential": [2, 3], "x": 364, "y": 236, "label": "Import declaration", "kind": "Document", "body": {"2": "Lodged by the importer or its broker with HS code, customs value, origin and supporting documents (invoice, packing list, certificate of origin). Duties and import VAT paid or deferred. [TO VERIFY:v67]", "3": "Wrong classification or value → penalties and post-clearance audits; preferential origin needs valid proofs. Under DDP, the seller is the importer of record. [TO VERIFY:v26]"}}, {"id": "carrier1", "beat": "release", "levels": [1], "essential": [1], "x": 828, "y": 236, "label": "Carrier release", "kind": "Rule", "body": {"1": "The carrier lets me go only when it has the right paper (or electronic release) and the charges are paid."}}, {"id": "obe", "beat": "bl", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "obe", "3": "obe"}, "x": 596, "y": 236, "label": "Original B/L (endorsed)", "kind": "Document"}, {"id": "do", "beat": "release", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "do", "3": "do"}, "x": 828, "y": 236, "label": "Release order", "kind": "Document"}, {"id": "waybill", "beat": "bl", "levels": [2, 3], "x": 596, "y": 66, "label": "No original?", "kind": "Document", "body": {"2": "With a [[sea-waybill]], the named consignee gets the cargo without an original. With [[telex-release|express release]], originals were surrendered at origin. eB/Ls transfer electronically. [TO VERIFY:v49]"}}], "docs": {"obe": {"title": "Original B/L — back (endorsements)", "heading": "BILL OF LADING — REVERSE", "sub": "Original 1 of 3 · fictional example", "stamp": "SURRENDERED", "rows": [{"label": "Front: consignee", "value": "To order of Demo Trade Bank"}, {"label": "Endorsement", "value": "Deliver to the order of Demo Import SAS — signed for Demo Trade Bank", "zone": 1, "levels": [2]}, {"label": "Endorsement", "value": "Deliver to the order of Demo Import SAS — signed for Demo Import SAS", "zone": 1, "error": true, "levels": [3]}, {"label": "Presented by", "value": "Demo Import SAS", "zone": 2}, {"label": "Set", "value": "1 of 3 surrendered · others void", "zone": 3}, {"label": "Freight", "value": "{freightTerms}"}], "points": {"1": {"2": "The bank named as consignee transfers its right to the importer by endorsing the back.", "3": "The endorsement must come from the current holder named on the B/L — here the bank."}, "2": {"2": "The presenter must be the lawful holder after the endorsement chain."}, "3": {"2": "One original accomplishes the set; the carrier marks the others void in its system. [TO VERIFY:v68]"}}, "check": {"2": {"prompt": "Who must endorse this 'to order of Demo Trade Bank' B/L before the importer can surrender it?", "options": [{"id": "a", "correct": true, "text": "The bank (Demo Trade Bank), on the back of the B/L"}, {"id": "b", "text": "The shipper, on the front of the B/L, next to its name", "fb": "The shipper isn't the named party here — the bank is."}, {"id": "c", "text": "The carrier, which signed and issued the original B/L", "fb": "The carrier receives the B/L; it doesn't endorse it."}, {"id": "d", "text": "The notify party, which receives the arrival notice", "fb": "Being notify party gives no right to the goods."}], "explain": "A 'to order of [bank]' B/L is transferred by the bank's endorsement, typically once the importer has paid or accepted under the L/C."}, "3": {"type": "spot", "prompt": "One line makes this original unacceptable for release. Tap it.", "explain": "The importer endorsed the B/L to itself: only the bank, named on the front, can endorse it. Releasing on this original would expose the carrier to the bank's claim. [TO VERIFY:v75]"}}}, "do": {"title": "Release order", "heading": "RELEASE ORDER / DELIVERY ORDER", "sub": "{podTerminal} · fictional example", "stamp": "RELEASED", "rows": [{"label": "Container", "value": "{containerNo} · {boxCode}"}, {"label": "Released to", "value": "Haulier appointed by the consignee (fictional)"}, {"label": "Pick-up right", "value": "PIN ●●●●-7Q2 / digital pick-up token", "zone": 1}, {"label": "Customs", "value": "Released · import declaration accepted", "zone": 2}, {"label": "Free time", "value": "Demurrage ends Day +{freeDays} after discharge (illustrative)", "zone": 3}, {"label": "Empty return", "value": "Depot designated by the carrier"}], "points": {"1": {"2": "The terminal checks the pick-up right before releasing the box; in some ports secure digital systems replace PIN codes. [TO VERIFY:v68]"}, "2": {"2": "Without customs release, the box stays — even if the carrier has released it. [TO VERIFY:v67]"}, "3": {"2": "After demurrage free time, daily charges apply until gate-out; then import detention runs until the empty is returned. [TO VERIFY:v21]"}}, "check": {"2": {"prompt": "What does the haulier need at the terminal gate to collect the box?", "options": [{"id": "a", "correct": true, "text": "A valid pick-up right (PIN or digital token), customs release on the box, a slot if required"}, {"id": "b", "text": "The arrival notice printed out, signed by the consignee and stamped by the terminal office", "fb": "That's information for the consignee, not a pick-up right."}, {"id": "c", "text": "The original B/L, which the driver hands to the gate clerk together with the truck papers", "fb": "The B/L goes to the carrier, not to the gate."}, {"id": "d", "text": "The VGM certificate from origin, to prove the weight before the box goes on the road again", "fb": "Not needed for import collection."}], "explain": "The gate releases against the pick-up right and status flags (customs, carrier). [TO VERIFY:v68]"}, "3": {"prompt": "The PIN was e-mailed to three haulage companies 'to be safe'. A truck nobody ordered collects the box. What went wrong?", "options": [{"id": "a", "correct": true, "text": "PIN security: pick-up rights must go only to the appointed haulier, via secure release"}, {"id": "b", "text": "Nothing: any truck that shows a valid PIN at the gate is a legitimate collector of the box", "fb": "The PIN proves knowledge of a code, not authority."}, {"id": "c", "text": "Customs released the box too early, before the consignee had appointed its own haulier", "fb": "Customs release isn't the issue here."}, {"id": "d", "text": "The B/L wasn't endorsed by the bank, so the PIN was generated before the release was due", "fb": "The documents were fine; the pick-up right leaked."}], "explain": "Fraudulent pick-ups exploit shared codes; ports have introduced secure digital pick-up for this reason. [TO VERIFY:v68]"}}}}, "dossier": {"documents": ["**Import declaration** + supporting documents. [TO VERIFY:v67]", "**Original B/L** (endorsed), or sea waybill / express release / eB/L. [TO VERIFY:v68]", "**Release / delivery order** with PIN or digital pick-up right.", "**Customs release** message to the terminal."], "costs": ["**Duties and import VAT** — for the importer (the seller under DDP). [TO VERIFY:v26]", "**Collect freight, destination THC, documentation fee**. [TO VERIFY:v35]", "**Brokerage** and any **inspection** costs.", "**Demurrage** if release takes too long. [TO VERIFY:v21]"], "risks": ["**Originals late** (banks, courier) → demurrage.", "**Release without original** → misdelivery claim. [TO VERIFY:v75]", "**Fraudulent pick-up** with leaked PIN. [TO VERIFY:v68]", "**Wrong customs data** → penalties, post-clearance audit."], "jobs": ["**Import documentation / release desk** — B/L checks, releases.", "**Finance / credit control** — collect freight and charges.", "**Customs & compliance** — import filings, holds.", "**Legal / claims** — LOI policy, misdelivery claims. [TO VERIFY:v75]"]}, "incoNote": {"_by": "incoterm", "DDP": "Under DDP, the seller clears import and pays duties and VAT — it must be able to act as importer. [TO VERIFY:v26]", "*": "Under {incoterm}, import clearance, duties and taxes are for the buyer."}, "keyPoints": {"1": ["Customs must clear me and the importer pays duties and taxes.", "The carrier releases me against an original Bill of Lading (or an electronic release) and payment.", "Then the truck company gets a pick-up code."], "2": ["Two releases: customs (legal) and carrier (commercial); both reach the terminal.", "A 'to order' B/L needs the right endorsement; waybills and express releases avoid paper originals.", "Pick-up rights (PIN, digital) must be protected."], "3": ["Never release without the lawful original unless the LOI policy is applied and approved.", "Check endorsement chains — the named party endorses.", "Release fraud is real: use secure pick-up processes."]}, "question": {"1": {"prompt": "I'm released! What happens next?", "hint": "I'm still in the port. The customer's warehouse is inland.", "options": [{"id": "a", "correct": true, "text": "A truck, a train or a barge takes me from the port to the customer.", "confirm": "Yes! That's the on-carriage. Under {incoterm}, it's organised by {onBy}."}, {"id": "b", "text": "The customer comes to the port and unloads me right there on the quay.", "why": "Full containers usually travel to the customer's premises to be unloaded.", "realLife": "Terminals don't let customers unload boxes on the quay.", "whenRight": "LCL or port-side warehouses (CFS) — a different service."}, {"id": "c", "text": "I sail back to {pol} first, to show the seller that I arrived safely.", "why": "My cargo is for this customer — I don't need to go back.", "realLife": "That would cost a fortune and take weeks.", "whenRight": "Never in a normal shipment."}]}, "2": {"prompt": "Customs and carrier releases have reached the terminal. What happens next?", "options": [{"id": "a", "correct": true, "text": "On-carriage: the appointed haulier collects the box with the pick-up right; gate-out EIR; detention starts.", "confirm": "Correct. Gate-out ends demurrage; import detention runs until the empty is returned. Under {incoterm}, on-carriage is organised by {onBy}. [TO VERIFY:v21]"}, {"id": "b", "text": "The consignee sends staff to the terminal to unstuff the box there, in the import yard, before delivery.", "why": "FCL boxes are unstuffed at the consignee's premises.", "realLife": "Terminals don't offer that for FCL, except via a CFS service.", "whenRight": "CFS devanning for LCL."}, {"id": "c", "text": "The box must first go back to the origin depot to be inspected before it may be delivered to anyone.", "why": "The box delivers its cargo first; the empty is returned at destination.", "realLife": "Nonsense in practice.", "whenRight": "Never."}, {"id": "d", "text": "Customs escorts the box to the consignee's warehouse and breaks the seal on arrival, as for all imports.", "why": "Released goods move freely; escorts are exceptional.", "realLife": "Only for specific procedures (e.g. some transit or high-risk goods).", "whenRight": "Special customs procedures."}]}, "3": {"prompt": "Case: originals stuck at the bank; demurrage running; the consignee asks for release against an LOI. What do you do?", "options": [{"id": "a", "correct": true, "text": "Apply the LOI policy: usually decline, or bank-countersigned LOI approved by legal; demurrage still runs.", "confirm": "Right. Releasing without the original exposes the carrier to the lawful holder (here possibly the bank). A countersigned LOI reduces but doesn't remove the risk. [TO VERIFY:v75]"}, {"id": "b", "text": "Release at once against the consignee's own LOI: it is a good customer and the bank will follow anyway.", "why": "The original holder may still claim the goods.", "realLife": "Misdelivery claims can equal the full cargo value.", "whenRight": "Never without policy approval."}, {"id": "c", "text": "Release against a scanned copy of the original B/L, sent by the bank, to stop the demurrage now.", "why": "A copy doesn't transfer title.", "realLife": "Same exposure as releasing without anything.", "whenRight": "Never for a negotiable B/L."}, {"id": "d", "text": "Stop the demurrage clock until the bank releases the originals, then release the box against them.", "why": "Bank delays are a cargo-side matter under most tariffs.", "realLife": "Unauthorised waivers create billing disputes.", "whenRight": "Only if agreed commercially and documented."}]}}}, {"id": 10, "short": "Delivery", "title": "On-carriage & delivery to the consignee", "scene": "oncarriage", "sceneDesc": "A landscape from the destination terminal to the consignee's warehouse: road, river and railway. The chosen transport carries the container to the customer.", "beats": [{"id": "pickup", "ms": 1600, "narration": {"1": "A haulier collects me at {podTerminal} with the pick-up code: how will I travel?", "2": "Gate-out with the pick-up right; an [[eir]] records my condition. [[on-carriage|On-carriage]]: [[merchant-haulage]] or [[carrier-haulage]] — choose the mode. [TO VERIFY:v69]", "3": "Gate-out ends demurrage and starts import detention; under carrier haulage, the carrier books the slot and the delivery appointment. [TO VERIFY:v21] [TO VERIFY:v70]"}, "caption": {"2": "Under {incoterm}, on-carriage is organised by {onBy}."}}, {"id": "travel", "ms": 3200, "narration": {"1": {"_by": "onMode", "barge": "A barge carries me up the river, then a short truck trip reaches the customer.", "rail": "A train carries me inland, then a truck does the last kilometres.", "*": "On the road to {dest}!"}, "2": {"_by": "onMode", "barge": "Barge to an inland terminal, then last-mile trucking: cheaper per box over distance, more handlings. [TO VERIFY:v69]", "rail": "Rail shuttle to an inland terminal, then last-mile truck; the detention clock keeps running. [TO VERIFY:v69]", "*": "Road delivery under a [[cmr]] consignment note; road limits apply (e.g. 44 t gross in France). [TO VERIFY:v13]"}, "3": "Inland legs share risks with pre-carriage: congestion, weight limits, missed slots. Under carrier haulage, the carrier answers for the inland leg under its B/L terms. [TO VERIFY:v43]"}, "caption": {"2": {"_by": "family", "reefer": "Genset on the road keeps {setPoint}. [TO VERIFY:v57]", "tank": "DG road rules apply (ADR in Europe). [TO VERIFY:v59]", "oog": "Oversize transport may need a permit or escort. [TO VERIFY:v58]", "*": "Import detention runs until the empty is returned. [TO VERIFY:v21]"}}}, {"id": "deliver", "ms": 1600, "narration": {"1": "Delivered: the customer checks my seal and signs a delivery receipt!", "2": "Delivery at {dest} on appointment; the consignee checks the seal and condition and signs the [[pod-proof|proof of delivery]], noting any reservations. [TO VERIFY:v70]", "3": "Reservations on the POD/CMR preserve claims; a 'clean' signature with visible damage or a wrong seal weakens the consignee's position. [TO VERIFY:v70]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "The consignee has no unloading slot for five days, and import detention free time ends in two. The haulier asks what to do with the loaded container."}}], "fact": {"beat": "travel", "text": {"1": "One river barge carries dozens of boxes, taking trucks off the road. [TO VERIFY:v69]", "2": "Ports like HAROPA and Antwerp-Bruges set barge and rail share targets. [TO VERIFY:v69]"}}, "hotspots": [{"id": "onmode", "beat": "pickup", "essential": [1, 2, 3], "choice": "onMode", "x": 320, "y": 140, "label": "Transport mode", "kind": "Choice"}, {"id": "gateout", "beat": "pickup", "levels": [2, 3], "x": 120, "y": 150, "label": "Gate-out", "kind": "Operations", "body": {"2": "Gate-out EIR records condition; demurrage stops, import detention starts (or combined free time continues). [TO VERIFY:v21]"}}, {"id": "detention", "beat": "travel", "levels": [2, 3], "x": 600, "y": 150, "label": "Detention clock", "kind": "Charge", "body": {"2": "Import detention runs from full gate-out to empty return at the designated depot. Illustrative: {freeDays} days free. [TO VERIFY:v21] [TO VERIFY:v12]"}}, {"id": "pod1", "beat": "deliver", "levels": [1], "essential": [1], "x": 830, "y": 190, "label": "Delivery receipt", "kind": "Document", "body": {"1": "The customer checks that my seal is intact and that I'm not damaged, then signs the delivery receipt. Any problem must be written on it."}}, {"id": "pod", "beat": "deliver", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "pod", "3": "pod"}, "x": 830, "y": 190, "label": "Proof of delivery", "kind": "Document"}], "docs": {"pod": {"title": "Proof of delivery (CMR)", "heading": "CMR CONSIGNMENT NOTE · POD", "sub": "Fictional example", "stamp": "DELIVERED", "rows": [{"label": "Sender", "value": "Haulier for the consignee, from {podTerminal}"}, {"label": "Consignee", "value": "Demo Import (fictional) · {dest}"}, {"label": "Container / seal", "value": "{containerNo} / {sealNo}", "zone": 1}, {"label": "Goods", "value": "{cargo}"}, {"label": "Delivered", "value": "Day +3, 10:40 · appointment kept"}, {"label": "Reservations", "value": "Seal intact · no visible damage", "zone": 2}, {"label": "Signature", "value": "<span class=\"sig\">M. Durand<\/span> · consignee", "zone": 3, "html": true}], "points": {"1": {"2": "The consignee compares the seal number with the B/L before opening the doors."}, "2": {"2": "Reservations (damage, seal mismatch, shortage) written here preserve the right to claim. [TO VERIFY:v70]"}, "3": {"2": "Signature, date and time close the transport contract for the road leg; the CMR governs international road carriage in Europe. [TO VERIFY:v70]"}}, "check": {"2": {"prompt": "Why must the consignee check the seal before signing?", "options": [{"id": "a", "correct": true, "text": "A seal problem noted on the POD keeps the right to claim; a clean signature weakens it"}, {"id": "b", "text": "To calculate the final VGM before the container is weighed again at the empty depot", "fb": "The VGM was for loading at origin."}, {"id": "c", "text": "Because customs requires the seal number on the POD before charging the import VAT", "fb": "This is about evidence, not VAT."}, {"id": "d", "text": "To start the demurrage clock at the terminal, which only stops at the consignee's site", "fb": "Demurrage already ended at gate-out."}], "explain": "Reservations on delivery documents are the first evidence in any cargo claim. [TO VERIFY:v70]"}, "3": {"prompt": "The seal on arrival is different from the B/L, and the consignee signs a clean POD. What's the consequence?", "options": [{"id": "a", "correct": true, "text": "The claim position is weakened; it should have noted a reservation and called a surveyor"}, {"id": "b", "text": "No consequence: the B/L already proves the seal number, so the claim is fully protected", "fb": "The B/L shows what was shipped; the POD shows what was accepted."}, {"id": "c", "text": "The carrier automatically pays for any shortage, since the seal differs from its B/L", "fb": "Liability depends on evidence and the applicable rules."}, {"id": "d", "text": "Customs must reopen the import clearance and re-inspect the cargo at the warehouse", "fb": "Not by default; it's a cargo-evidence issue."}], "explain": "A seal change may be legitimate (customs inspection) — but only documented reservations allow it to be investigated. [TO VERIFY:v70]"}}}}, "dossier": {"documents": ["**Release order / pick-up right** — PIN or digital. [TO VERIFY:v68]", "**Gate-out EIR** — condition at handover.", "**CMR / POD** — signed delivery with reservations. [TO VERIFY:v70]", "**Barge or rail consignment note** for intermodal legs."], "costs": ["**On-carriage** — carrier haulage tariff or merchant contract.", "**Import detention** after free time. [TO VERIFY:v21]", "**Waiting time** at the consignee beyond free unloading time. [TO VERIFY:v12]", "**Inland terminal handling** for barge/rail. [TO VERIFY:v40]"], "risks": ["**No delivery slot** → detention and ack to {pol} still full, because the goods were not wanted.", "why": "I must be unloaded first.", "realLife": "Sending cargo back would be a new shipment.", "whenRight": "Only for a return shipment, with a new booking."}]}, "2": {"prompt": "Delivered, POD signed. What happens next?", "options": [{"id": "a", "correct": true, "text": "Unstuffing within free time, then empty return to the carrier's designated depot; detention stops at gate-in.", "confirm": "Correct. The designated return depot matters: returning elsewhere can mean extra charges. [TO VERIFY:v71]"}, {"id": "b", "text": "The empty stays with the consignee to reuse as it likes; the carrier only collects it at the next export booking.", "why": "Equipment belongs to the carrier and is managed by equipment control.", "realLife": "Detention builds daily.", "whenRight": "With a separate agreement (e.g. street turn or 'triangulation' approved by the carrier)."}, {"id": "c", "text": "The empty goes back to the import terminal by default, whatever the release order says about depots.", "why": "The return location is set by the carrier — often a depot, not the terminal.", "realLife": "Wrong location = refused or charged.", "whenRight": "When the carrier designates the terminal as return point."}, {"id": "d", "text": "The empty is shipped back to the origin depot in Asia at the consignee's cost, under a new booking.", "why": "Repositioning is the carrier's business.", "realLife": "The consignee's obligation ends at the designated return depot.", "whenRight": "Never for the consignee."}]}, "3": {"prompt": "Case: no unloading slot for five days; detention free time ends in two days. What do you advise?", "options": [{"id": "a", "correct": true, "text": "Warn of the detention exposure; offer options (drop the loaded box at a yard, or accept detention); record it.", "confirm": "Right. Detention follows the tariff; transparent options let the cargo side choose the cheapest path. Storage at the haulier's yard has its own   /* ---------- Scene state machine ---------- */
  let timers = [], painted = -2, along = {};
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function chMatch(spec) {
    if (!spec) return true;
    return spec.split(' ').every(part => { const [k, vs] = part.split(':'); const have = k === 'transship' ? (route().transship ? 'yes' : 'no') : byVal(k); return vs.split('|').includes(String(have)); });
  }
  // Apply the scene state for global beat index gi (−1 = before the first beat). Returns the longest movement (ms).
  function paint(s, gi) {
    const svg = $('#scene'); if (!svg) return 0;
    const curIdx = S.departed ? 999 : gi, instant = svg.classList.contains('instant');
    $$('[data-at],[data-ch],[data-until]', svg).forEach(el => {
      let vis = chMatch(el.dataset.ch);
      if (el.dataset.at || el.dataset.until) { const at = el.dataset.at ? gIdx(s, el.dataset.at) : -Infinity, un = el.dataset.until ? gIdx(s, el.dataset.until) : Infinity; vis = vis && at <= curIdx && curIdx <= un; }
      if (el.dataset.delay) el.style.transitionDelay = vis ? el.dataset.delay + 'ms' : '0ms';
      el.classList.toggle('off', !vis);
    });
    let moved = 0;
    $$('[data-tx]', svg).forEach(el => {
      let pos = null;
      el.dataset.tx.split(';').forEach(p => {
        const m = p.trim().match(/^([\w-]+):(-?[\d.]+),(-?[\d.]+)(?:@(\d+))?(?:~(\d+))?$/); if (!m) return;
        if (gIdx(s, m[1]) <= curIdx) pos = m;
      });
      if (!pos) return;
      const t = `translate(${pos[2]}px,${pos[3]}px)`;
      if (el.style.transform !== t) {
        const d = +(pos[5] || el.dataset.d || 2000), delay = +(pos[4] || 0);
        el.style.transitionDuration = d + 'ms'; el.style.transitionDelay = delay + 'ms'; el.style.transform = t;
        if (!instant) moved = Math.max(moved, d + delay);
      }
    });
    $$('[data-along]', svg).forEach(el => {
      let f = null; el.dataset.along.split(';').forEach(p => { const [k, v] = p.split(':'); if (gIdx(s, k.trim()) <= curIdx && v != null) f = +v; });
      if (f == null) return;
      const path = svg.querySelector('#' + el.dataset.path); if (!path) return;
      const total = path.getTotalLength(), from = along[el.id] != null ? along[el.id] : f, d = +(el.dataset.d || 2400);
      const place = fr => { const p = path.getPointAtLength(total * fr); el.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`); };
      along[el.id] = f;

  let xferDone = null, xferReturn = null;
