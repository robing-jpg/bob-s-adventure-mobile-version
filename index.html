  /* ---------- v0.5: indicative cost (€) and CO2e meter ----------
     All values live in content: global.json → footprint (with sources and TO VERIFY flags). Cost items are split
     seller / buyer from the Incoterm's cost step (export / import clearance follow the rule's exportBy / importBy).
     CO2e = distance × default intensity factor (GLEC): TEU-km at sea (40' = 2 TEU), tonne-km on land. */
  function pickVal(v, c) {
    if (v == null || typeof v !== 'object') return v;
    for (const k of [c.id, c.family, String(c.len), '*']) if (v[k] != null) return v[k];
    return null;
  }
  function footprint() {
    const F = C.footprint, r = route(), c = container(), ic = inco(), RT = F.routes[r.id] || {}, fac = F.factors;
    const teu = c.len === 40 ? 2 : 1, cargoT = ((r.cargoKg || {})[c.family] || 10000) / 1000, grossT = cargoT + c.tare / 1000;
    const rows = [];
    (F.costs || []).forEach(it => {
      if (it.when && !ok({ when: it.when })) return;
      const eur = pickVal((it.route || {})[r.id] != null ? it.route[r.id] : it.eur, c); if (!eur) return;
      const x = c.family === 'reefer' && it.reeferX ? it.reeferX : 1;
      const payer = it.payer ? (ic[it.payer] === 'seller' ? 'seller' : 'buyer') : (it.step <= ic.cost ? 'seller' : 'buyer');
      const v = it.v && typeof it.v === 'object' ? (c.family === 'reefer' && it.vReefer) || it.v[r.id] : it.v;
      rows.push({ step: it.step, label: it.label, eur: Math.round(eur * x / 5) * 5, payer, kg: 0, v });
    });
    const land = (mode, km) => km * grossT * ((fac[mode] || fac.truck).kg);
    const co2 = (step, label, kg, v) => rows.push({ step, label, eur: 0, payer: null, kg, v });
    co2(3, plain(F.labels.pre).replace('{mode}', choiceLabel('mode') || 'truck'), land(S.choices.mode, RT.preKm || 0), fac[S.choices.mode || 'truck'].v);
    if (c.family === 'reefer') { co2(5, plain(F.labels.plugO), (RT.plugDays || 0) * fac.reeferDay.kg, fac.reeferDay.v); }
    (RT.sea || []).forEach(leg => { const f = fac[leg.kind], k = c.family === 'reefer' ? (leg.kind === 'ship' ? fac.shipReefer.kg : f.kg * fac.feeder.reeferX) : f.kg;
      co2(7, leg.label, leg.km * teu * k, c.family === 'reefer' && leg.kind === 'ship' ? fac.shipReefer.v : f.v); });
    if (c.family === 'reefer') co2(8, plain(F.labels.plugD), (RT.plugDays || 0) * fac.reeferDay.kg, fac.reeferDay.v);
    co2(10, plain(F.labels.on).replace('{mode}', choiceLabel('onMode') || 'truck'), land(S.choices.onMode, RT.onKm || 0), fac[S.choices.onMode || 'truck'].v);
    co2(11, plain(F.labels.ret), (RT.returnKm || 0) * (c.tare / 1000) * fac.truck.kg, fac.truck.v);
    return rows;
  }
  const reached = step => S && S.completed.includes(step);
  function meterTotals() { const rows = footprint().filter(x => reached(x.step)); return { eur: rows.reduce((a, x) => a + x.eur, 0), kg: rows.reduce((a, x) => a + x.kg, 0) }; }
  const fmtT = kg => (kg / 1000).toLocaleString('en-GB', { maximumFractionDigits: kg < 10000 ? 1 : 0, minimumFractionDigits: kg < 10000 ? 1 : 0 });
  function renderMeter(bump) {
    const b = $('#bMeter'); if (!b || !S || !C.footprint) return;
    const T = meterTotals(), cu = C.footprint.currency;
    const k = n => n >= 1000 ? (n / 1000).toLocaleString('en-GB', { maximumFractionDigits: n < 10000 ? 1 : 0 }) + 'k' : fmt(n);   // MOBILE: compact numbers
    b.innerHTML = `<span class="pl ${bump ? 'bump' : ''}" aria-hidden="true">${cu}&nbsp;${k(T.eur)}</span><span class="pl ${bump ? 'bump' : ''}" aria-hidden="true">CO₂&nbsp;${fmtT(T.kg)}t</span><span class="sr">Indicative cost about ${cu} ${fmt(T.eur)} and CO2 about ${fmtT(T.kg)} tonnes so far; tap for details</span>`;
    b.title = plain(C.footprint.tip);
  }
  function openMeter(opener) {
    const F = C.footprint, rows = footprint(), cu = F.currency, all = rows.reduce((a, x) => a + x.eur, 0), kgAll = rows.reduce((a, x) => a + x.kg, 0);
    const sel = rows.filter(x => x.payer === 'seller').reduce((a, x) => a + x.eur, 0), buy = all - sel, T = meterTotals();
    const body = `<p class="fp-intro" style="margin-top:0">${rich(F.intro)}</p>
      <div class="scores"><div>So far<strong>${cu} ≈ ${fmt(T.eur)}</strong>CO₂e ≈ ${fmtT(T.kg)} t</div><div>Whole journey<strong>${cu} ≈ ${fmt(all)}</strong>CO₂e ≈ ${fmtT(kgAll)} t</div>
        <div>Under ${esc(cur().incoterm)}<strong style="font-size:1rem"><span class="payer seller">Seller</span> ${cu} ${fmt(sel)} · <span class="payer buyer">Buyer</span> ${cu} ${fmt(buy)}</strong></div></div>
      <div class="split" role="img" aria-label="Seller pays about ${fmt(sel)}, buyer about ${fmt(buy)}"><span style="width:${all ? sel / all * 100 : 0}%;background:var(--c-seller)"></span><span style="width:${all ? buy / all * 100 : 0}%;background:repeating-linear-gradient(45deg,var(--c-buyer) 0 6px,#8A66B5 6px 12px)"></span></div>
      <div style="overflow:auto"><table class="fp"><caption class="sr">Indicative cost and CO2 by step</caption>
        <thead><tr><th>Step</th><th>Item</th><th class="n">${cu} ≈</th><th>Paid by</th><th class="n">CO₂e kg</th></tr></thead><tbody>
        ${rows.sort((a, b) => a.step - b.step).map(x => `<tr class="${reached(x.step) ? '' : 'later'}"><td>${x.step}</td><td>${rich(x.label)} ${x.v ? rich('[TO VERIFY:' + x.v + ']') : ''}${reached(x.step) ? '' : ' <small>(upcoming)</small>'}</td>
          <td class="n">${x.eur ? fmt(x.eur) : '—'}</td><td>${x.payer ? `<span class="payer ${x.payer}">${x.payer === 'seller' ? 'Seller' : 'Buyer'}</span>` : ''}</td><td class="n">${x.kg ? fmt(x.kg) : '—'}</td></tr>`).join('')}
        </tbody><tfoot><tr><td></td><td>Total (whole journey)</td><td class="n">${fmt(all)}</td><td></td><td class="n">${fmt(kgAll)}</td></tr></tfoot></table></div>
      <p style="font-size:.82rem;color:var(--c-muted)">${rich(F.note)}</p>`;
    openSheet(plain(F.title), body, { kind: plain(F.kicker), opener, wide: true });
  }
  function docTotals(steps) {
    let pts = 0, max = 0;
    (steps || C.steps).forEach(s => (s.hotspots || []).forEach(h => {
      if (!ok(h) || !docOf(h)) return; const d = s.docs && s.docs[docOf(h)]; if (!d || !R(d.check)) return;
      max++; const st = S.docs[`${s.id}:${docOf(h)}`]; if (st && st.done) pts += st.pts;
    }));

  }
  function openKeyPoints() {
    const s = step(), ft = S.firstTry[s.id], dt = docTotals([s]);
    const next = s.id < 11 ? stepDef(s.id + 1) : null;
    const html = `<div class="scores">
        <div>First-try answer<strong>${ft == null ? '—' : ft.ok ? '✓ Yes' : '✗ No'}</strong></div>
        ${dt.max ? `<div>Documents mastered (this step)<strong>${dt.pts}/${dt.max}</strong></div>` : ''}
        <div>Essentials<strong>${essentials(s).filter(h => consulted(h.id)).length}/${essentials(s).length}</strong></div></div>
      <ul>${(R(s.keyPoints) || []).map(k => `<li>${rich(k)}</li>`).join('')}</ul>
      <div class="row">${next ? `<button class="pill primary go" id="kNext">Step ${next.id}: ${esc(plain(next.title))} ▶</button>` : `<button class="pill primary go" id="kNext">Final quiz ▶</button>`}
      <button class="pill" id="kReplay">↺ Replay step ${s.id}</button></div>`;
    openSheet(`Key points — Step ${s.id}`, html, { kind: '✓ Step complete', focus: '#kNext', bind: sh => {
      $('#kNext', sh).onclick = () => { closeSheet(); if (next) goStep(next.id); else startQuiz(); };
      $('#kReplay', sh).onclick = () => { closeSheet(); delete S.q[s.id]; S.consulted[s.id] = []; Object.keys(S.docs).filter(k => k.startsWith(s.id + ':')).forEach(k => delete S.docs[k]); goStep(s.id); };
    } });

  /* ---------- Document viewer (storyboard §6; scoring 1 / 0.5 / 0) ---------- */
  let dv = null;
  function openDoc(id, h, opener) {
    closePop(); closeSheet();
    dv = { id, h, zone: null, opener, seen: new Set(), key: `${S.step}:${id}`, lastWrong: null };
    $('#docv').classList.add('open'); renderDoc();
    setTimeout(() => { const p = $('#docv .pt') || $('#dvX'); if (p) p.focus(); }, 80);

  function docState() {
    const st = S.docs[dv.key] || (S.docs[dv.key] = { tries: 0, done: false, pts: 0, picked: [] });
    const ch = R(step().docs[dv.id].check);
    if (ch && ch.options && (!st.order || st.order.length !== ch.options.length)) st.order = shuffle(ch.options.map(o => o.id));

  }
  function renderDoc() {
    const s = step(), d = s.docs[dv.id], ch = R(d.check), st = docState(), spot = ch && ch.type === 'spot';

    const rowHtml = (r, i) => {
      const z = r.zone, on = dv.zone && dv.zone === z;
      const val = r.html ? tpl(R(r.value)) : esc(plain(r.value));

      const cls = `frow ${on ? 'on' : ''} ${spot && st.done && isErr ? 'bad' : ''} ${picked && !isErr ? 'ok' : ''}`;
      const flag = spot && st.done && isErr ? '<span class="fs">✗ mismatch</span>' : picked && !isErr ? '<span class="fs">✓ correct</span>' : '';
      const ptBtn = z ? `<button type="button" class="pt ${on ? 'on' : dv.seen.has(z) ? 'done' : ''}" data-pt="${z}" aria-label="Point ${z}: ${esc(plain(r.label))}" aria-pressed="${!!on}">${CIRCLED[z]}</button>` : '';
      if (spot && !st.done) return `<div style="position:relative"><button type="button" class="${cls}" data-row="${i}"><span class="fl">${esc(plain(r.label))}${flag}</span><span>${val}</span></button>${ptBtn}</div>`;
      return `<div class="${cls}"><span class="fl">${esc(plain(r.label))}${flag}</span><span>${val}</span>${ptBtn}</div>`;
    };
    const zr = dv.zone ? rows.find(r => r.zone === dv.zone) : null;

    let checkHtml = '';
    if (ch) {
      let fb = '';
      if (st.done) fb = `<div class="fbline"><p><strong>${st.pts === 1 ? '✓ Correct, first try (+1).' : st.pts === 0.5 ? '✓ Correct, second try (+0.5).' : 'Here is the answer (+0).'}</strong> ${rich(ch.explain)}</p><button class="pill primary go" id="dvDone">Done ✓</button></div>`;
      else if (dv.lastWrong != null) fb = `<div class="fbline"><p><strong>✗ ${esc(spot ? C.ui.spotWrong : C.ui.docWrong)}</strong> ${dv.lastWrong ? rich(dv.lastWrong) : ''}</p></div>`;
      const options = spot ? '' : `<div class="opts">${(st.order || ch.options.map(o => o.id)).map(id => ch.options.find(o => o.id === id)).filter(Boolean).map((o, k) => {

  /* ---------- Step file (L2/L3) ---------- */

  /* ---------- Incoterm chip popover & guide ---------- */
  function incoBand(n) {

  function incoPop(anchor) {

      <div aria-live="polite">${ans ? `<div class="fb ${ans.ok ? 'right' : 'wrong'}"><h3 id="qzFb" tabindex="-1">${ans.ok ? '✓ Correct' : '✗ Not this one'}</h3><p style="margin:0">${rich(q.explain)}</p>

  /* ---------- v0.5: results (nickname, scores, right/wrong per question at the first try) ---------- */
  // Every scored item of the journey: step questions (first try), document checks (1 pt = first try) and the final quiz.
  function resultItems() {
    const out = [];
    C.steps.forEach(s => {
      const ft = S.firstTry[s.id]; if (ft) out.push({ id: `S${s.id}`, tag: `Step ${s.id}`, label: `${plain(s.title)} — ${plain(R(s.question).prompt)}`, ok: !!ft.ok });
      (s.hotspots || []).forEach(h => { const d = docOf(h); if (!d || !ok(h)) return; const st = S.docs[`${s.id}:${d}`]; if (st && st.done) out.push({ id: `D${s.id}-${d}`, tag: `Step ${s.id} · document`, label: plain(s.docs[d].title), ok: st.pts === 1, pts: st.pts }); });
    });
    const Z = S.quiz, pool = R(C.quiz) || [];
    if (Z) Z.order.forEach(id => { const a = Z.answers[id], q = pool.find(x => x.id === id); if (a && q) out.push({ id: `Q-${id}`, tag: 'Final quiz', label: plain(q.q), ok: !!a.ok }); });
    return out;
  }
  function loadResults() { try { return JSON.parse(localStorage.getItem(RESULTS)) || []; } catch (e) { return window.__results || []; } }
  function saveResults(list) { window.__results = list; try { localStorage.setItem(RESULTS, JSON.stringify(list)); } catch (e) {} }
  // Built once per finished journey (S.resultId), kept on this device, and sent to CONFIG.resultsEndpoint if set.
  function recordResults() {
    let list = loadResults(), rec = S.resultId && list.find(r => r.id === S.resultId);
    if (rec) return rec;
    const ids = Object.keys(S.firstTry), okN = ids.filter(k => S.firstTry[k].ok).length, dt = docTotals(), Z = S.quiz;
    const items = resultItems();
    rec = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), app: CONFIG.appTitle, version: CONFIG.platform || (C.meta || {}).version || '', build: 'v0.1-mobile',   // MOBILE: version = "mobile" in the shared Sheet
      nickname: player() || 'anonymous', date: new Date().toISOString(), level: L(), container: container().name, route: route().name, incoterm: cur().incoterm,
      firstTry: `${okN}/${ids.length}`, firstTryPct: ids.length ? Math.round(okN / ids.length * 100) : 0,
      documents: dt.max ? `${dt.pts}/${dt.max}` : 'n/a', quiz: Z ? `${Object.values(Z.answers).filter(a => a.ok).length}/${Z.order.length}` : 'n/a',
      toReview: items.filter(x => !x.ok).map(x => `${x.tag}: ${x.label}`).join(' | '),
      questions: items.map(x => ({ id: x.id, label: `${x.tag}: ${x.label}`, ok: x.ok })), sent: false };
    list.push(rec); saveResults(list); S.resultId = rec.id; save();
    sendResult(rec);
    return rec;
  }
  function sendResult(rec) {
    if (!CONFIG.resultsEndpoint || !window.fetch) return;
    const body = JSON.stringify(Object.assign({ token: CONFIG.resultsToken }, rec, { sent: undefined }));
    // text/plain avoids a CORS pre-flight; Apps Script answers with an opaque response, so success = no network error
    fetch(CONFIG.resultsEndpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body })
      .then(() => { const list = loadResults(), r = list.find(x => x.id === rec.id); if (r) { r.sent = true; saveResults(list); }
        const el = $('#smSent'); if (el) el.textContent = plain(C.ui.resultsSent); })
      .catch(() => { const el = $('#smSent'); if (el) el.textContent = plain(C.ui.resultsLocal); });
  }
  function retryUnsent() { loadResults().filter(r => !r.sent).forEach(sendResult); }
  function downloadCsv() {
    const me = player(), list = loadResults().filter(r => !me || r.nickname === me);
    const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    const head = ['date', 'nickname', 'level', 'container', 'route', 'incoterm', 'first_try', 'first_try_pct', 'documents', 'final_quiz', 'question_id', 'question', 'correct_first_try', 'version'];
    const rows = [head.join(',')];
    list.forEach(r => (r.questions.length ? r.questions : [{ id: '', label: '', ok: '' }]).forEach(x => rows.push([r.date, r.nickname, r.level, r.container, r.route, r.incoterm, r.firstTry, r.firstTryPct, r.documents, r.quiz, x.id, x.label, x.ok === '' ? '' : x.ok ? 'yes' : 'no', r.version].map(q).join(','))));
    const blob = new Blob(['\ufeff' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `bobs-adventure-results-${(me || 'me').replace(/[^\w-]+/g, '_')}.csv`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  SCENES.precarriage = s => { const r = route(); return inland(s, { key: 'mode', travel: 'travel', bridge: !!r.bridge, leftLabel: plain(C.ui.shipper), rightTerminal: true, rightLabel: r.polTerminal, tagAt: 'approach', tagText: plain(C.ui.preAdvice),

  SCENES.oncarriage = s => { const r = route(); return inland(s, { key: 'onMode', travel: 'travel', bridge: false, leftTerminal: true, leftLabel: r.podTerminal, rightTerminal: false, rightLabel: plain(C.ui.consignee), tagAt: 'deliver', tagText: plain(C.ui.delivered), tagX: 830 }); };

  /* --- Steps 4 & 9: the "paper journey" as 4 illustrated stations; the container walks from one to the next --- */
  const ICONS = {

      <rect x="-25" y="-19" width="32" height="5" rx="2" fill="#0B4F6C"/><rect x="-25" y="-10" width="46" height="3" fill="#7C8B97"/><rect x="-25" y="-3" width="40" height="3" fill="#7C8B97"/><rect x="-25" y="4" width="28" height="3" fill="#7C8B97"/>
      <path d="M-46 18 H46 L38 28 H-38 Z" fill="#55616D"/><g transform="translate(30 -30)"><rect x="-10" y="-8" width="24" height="16" rx="2" fill="#fff" stroke="#1B2631" stroke-width="1.5"/><polyline points="-10,-8 2,1 14,-8" fill="none" stroke="#1B2631" stroke-width="1.5"/></g>`,
    bl: `<path d="M-26 -38 H12 L26 -24 V36 H-26 Z" fill="#FFFEF7" stroke="#1B2631" stroke-width="2.5"/><path d="M12 -38 V-24 H26" fill="none" stroke="#1B2631" stroke-width="2.5"/>
      <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="900" fill="#0B4F6C">B/L</text>${[4, 12, 20].map(y => `<rect x="-18" y="${y}" width="30" height="3" fill="#97A4AF"/>`).join('')}
      <circle cx="24" cy="24" r="12" fill="#fff" fill-opacity=".7" stroke="#1B2631" stroke-width="3.5"/><line x1="32" y1="33" x2="42" y2="44" stroke="#1B2631" stroke-width="5" stroke-linecap="round"/>`,
    customs: `<polygon points="-40,-14 0,-38 40,-14" fill="#0B4F6C"/><rect x="-38" y="-14" width="76" height="7" fill="#083A50"/>
      ${[-30, -14, 2, 18].map(x => `<rect x="${x}" y="-5" width="10" height="32" fill="#D3DAE1" stroke="#97A4AF"/>`).join('')}<rect x="-42" y="27" width="84" height="9" rx="2" fill="#083A50"/>
      <line x1="0" y1="-38" x2="0" y2="-54" stroke="#1B2631" stroke-width="2"/><path d="M0 -54 h16 l-4 5 l4 5 h-16 z" fill="#E07A24"/>`,

    mail: `<rect x="-38" y="-24" width="76" height="50" rx="5" fill="#fff" stroke="#1B2631" stroke-width="2.5"/><polyline points="-38,-24 0,6 38,-24" fill="none" stroke="#1B2631" stroke-width="2.5"/>
      <circle cx="32" cy="-26" r="13" fill="#E07A24"/><text x="32" y="-20" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">!</text>`,
    pay: `<path d="M-26 -38 H12 L26 -24 V30 H-26 Z" fill="#FFFEF7" stroke="#1B2631" stroke-width="2.5"/><text x="0" y="-12" text-anchor="middle" font-size="13" font-weight="900" fill="#0B4F6C">B/L</text>
      <rect x="-18" y="-2" width="30" height="3" fill="#97A4AF"/><g transform="translate(22 22)"><circle r="18" fill="#F2B705" stroke="#8A6A00" stroke-width="2.5"/><text y="7" text-anchor="middle" font-size="20" font-weight="900" fill="#5A4500">€</text></g>`
  };
  SCENES.flow = s => {
    const F = s.flow, st = F.stations, n = st.length, cw = 206, gap = 26, x0 = (960 - (n * cw + (n - 1) * gap)) / 2, Y = 40, CH = 220;
    const left = i => x0 + i * (cw + gap), cx = i => left(i) + cw / 2, prev = i => (i === 0 ? 'start' : st[i - 1].beat);
    const c = container(), k = .26, bw = boxDims(c).w * k, bh = boxDims(c).h * k, railY = 324;
    const cards = st.map((t, i) => { const x = left(i);
      return `<g>
        <rect x="${x}" y="${Y + 6}" width="${cw}" height="${CH}" rx="18" fill="#0E2230" opacity=".08"/>
        <rect x="${x}" y="${Y}" width="${cw}" height="${CH}" rx="18" fill="#fff" stroke="#C9D3DB" stroke-width="2"/>
        <circle cx="${x + 26}" cy="${Y + 24}" r="15" fill="var(--c-primary)"/><text x="${x + 26}" y="${Y + 29}" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">${i + 1}</text>
        <g transform="translate(${x + cw / 2} ${Y + 82})">${ICONS[t.icon] || ''}</g>
        <text x="${x + cw / 2}" y="${Y + 148}" text-anchor="middle" font-size="15" font-weight="800" fill="#1B2631">${esc(plain(t.title))}</text>

        <rect x="${x}" y="${Y}" width="${cw}" height="${CH}" rx="18" fill="none" stroke="var(--c-star)" stroke-width="5" data-at="${t.beat}" data-until="${t.beat}"/>

        <rect x="${x - 2}" y="${Y - 2}" width="${cw + 4}" height="${CH + 4}" rx="19" fill="#EEF2F5" opacity=".72" data-until="${prev(i)}"/>
        ${i < n - 1 ? `<path d="M${x + cw + 6} ${Y + 100} l12 10 l-12 10" fill="none" stroke="#97A4AF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
      </g>`; }).join('');
    const stops = st.map((t, i) => `<circle cx="${cx(i)}" cy="${railY}" r="7" fill="#fff" stroke="#55616D" stroke-width="3"/><circle cx="${cx(i)}" cy="${railY}" r="4" fill="var(--c-ok)" data-at="${t.beat}" data-delay="1300"/>`).join('');
    const walk = 'start:' + (cx(0) - bw / 2 - 140).toFixed(1) + ',' + (railY - bh - 6).toFixed(1) + ';' + st.map((t, i) => `${t.beat}:${(cx(i) - bw / 2).toFixed(1)},${(railY - bh - 6).toFixed(1)}~1300`).join(';');

    return `${svgOpen(s)}<rect x="-700" y="-100" width="2360" height="700" fill="#EEF2F5"/>

      ${cards}<rect x="${cx(0) - 60}" y="${railY - 2}" width="${cx(n - 1) - cx(0) + 120}" height="4" rx="2" fill="#97A4AF"/>${stops}${inc}
      <g data-tx="${walk}"><g transform="scale(${k})">${boxSVG(c, { plate: false })}</g></g></svg>`;
  };

  /* --- Step 5: terminal gate-in, yard (RTG) and stowage planning — same container scale as the stacks --- */
  SCENES.terminal = s => {
    const c = container(), f = c.family, { w, h } = boxDims(c), bw = w * K, bh = h * K;
    const bx0 = 70, by0 = GY - 14 - bh, lane = 812, slotX = 460, slotY = GY - 2 * TH - bh, liftTop = GY - 3 * TH - bh - 18;
    let bay = '';
    for (let r = 0; r < 5; r++) for (let col = 0; col < 8; col++) bay += `<rect x="${52 + col * 26}" y="${66 + r * 18}" width="24" height="16" fill="${(r === 1 && col === 5) ? 'var(--c-box)' : '#D3DAE1'}" stroke="#97A4AF"/>`;
    const zone = f === 'reefer' ? 'REEFER RACK · PLUGGED ⚡' : f === 'tank' ? 'DG AREA · SEGREGATED (IMDG)' : f === 'oog' ? 'OOG AREA · NOT STACKABLE' : 'EXPORT STACK · BLOCK 3';
    const truckTx = `start:-760,0;gate:0,0~2400;yard:${lane - bx0},0~1600`;
    const boxBody = `<g transform="translate(${bx0} ${by0}) scale(${K})">${boxSVG(c, { plate: false })}</g>`;
    const lifts = [`yard:0,${(liftTop - by0).toFixed(1)}@1700~800`, `yard:${slotX - lane},0@2500~1300`, `yard:0,${(slotY - liftTop).toFixed(1)}@3800~800`].map(x => 'start:0,0;' + x);
    const cables = `<g transform="translate(${bx0} ${by0})" stroke="#2B3238" stroke-width="2"><line x1="${bw / 2 - 9}" y1="-24" x2="${bw / 2 - 9}" y2="-500"/><line x1="${bw / 2 + 9}" y1="-24" x2="${bw / 2 + 9}" y2="-500"/></g>`;
    const spreader = `<g transform="translate(${bx0} ${by0})">${spreaderSVG(bw)}</g>`;
    return `${svgOpen(s)}<defs><clipPath id="rtgClip"><rect x="-700" y="146" width="2400" height="400"/></clipPath></defs>${ground()}${skyline([[300, 236, 44], [360, 252, 50], [990, 230, 46]])}
      <g opacity=".55" transform="translate(0 -26) scale(1 1)">${stackRow(300, [2, 3, 3, 2], 5)}</g>
      ${stackRow(460, [2, 3], 1)}
      <g><rect x="16" y="150" width="226" height="16" rx="3" fill="#1B2631"/><rect x="24" y="166" width="10" height="202" fill="#55616D"/><rect x="226" y="166" width="10" height="202" fill="#55616D"/>
        <text x="129" y="163" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" letter-spacing="1">GATE IN · OCR</text><circle class="blink" cx="129" cy="180" r="4" fill="#7CF0A8"/>
        <rect x="236" y="250" width="34" height="50" rx="3" fill="#EEF2F5" stroke="#97A4AF"/><rect x="241" y="257" width="24" height="14" fill="url(#gGlass)"/></g>
      ${f === 'reefer' ? `<g><rect x="440" y="${GY - 3 * TH}" width="6" height="${3 * TH}" fill="#55616D"/><rect x="434" y="${GY - 3 * TH - 6}" width="18" height="8" fill="#55616D"/>
        <path d="M446 ${GY - 3 * TH + 6} C 470 ${slotY - 30}, 520 ${slotY - 10}, ${slotX + bw - 20} ${slotY + 14}" stroke="#1B2631" stroke-width="3" fill="none" data-at="yard" data-delay="4700"/></g>` : ''}

      <g data-at="yard" data-until="yard" data-delay="1500"><g clip-path="url(#rtgClip)">${chain([truckTx].concat(lifts), cables)}</g>${chain([truckTx].concat(lifts), spreader)}</g>
      <g><rect x="436" y="132" width="16" height="${GY - 132}" fill="#E8C33A" stroke="#6B5410"/><rect x="988" y="132" width="16" height="${GY - 132}" fill="#E8C33A" stroke="#6B5410"/>
        <rect x="428" y="120" width="584" height="18" fill="#E8C33A" stroke="#6B5410"/><text x="720" y="133" text-anchor="middle" font-size="10" font-weight="800" fill="#1B2631">RTG · YARD CRANE</text>
        <rect x="424" y="${GY - 18}" width="34" height="18" rx="3" fill="#2B3238"/><rect x="980" y="${GY - 18}" width="34" height="18" rx="3" fill="#2B3238"/></g>
      <g data-tx="start:0,0;yard:${slotX - lane},0@2500~1300"><rect x="${lane + bw / 2 - 30}" y="138" width="60" height="10" fill="#6B5410"/></g>

      ${inset(30, 14, 236, 104, 'GATE-IN RECEIPT (EIR)', [`${CONTAINER_NO} · ${c.iso}`, 'Seal ' + SEAL_NO + ' ✓', 'Damage: none ✓ · VGM ✓'], 'data-at="gate" data-until="gate" data-delay="2000"')}
      <g data-at="plan"><rect x="40" y="14" width="232" height="168" rx="10" fill="#fff" stroke="#1B2631" stroke-width="2"/><text x="52" y="36" font-size="12" font-weight="800" fill="#1B2631" letter-spacing="1">BAY PLAN · ${esc(route().vessel)}</text>
        <text x="52" y="54" font-size="10" fill="#55616D">Planned slot (illustrative)</text>${bay}<text x="52" y="172" font-size="10" fill="#1B2631">Weight, port, DG and reefer constraints</text></g>

    </svg>`;
  };

  /* --- Steps 6 & 8: quay operations (load / discharge). Ship stacks, our box and the crane share one scale (K). --- */
  function quay(s, mode) {
    const c = container(), r = route(), { w, h } = boxDims(c), bw = w * K, bh = h * K, load = mode === 'load';
    const SX = 270, SY = 352, deck = SY - 30, tiers = [3, 3, 4, 4, 0, 4, 3], bayX = b => 30 + b * 171;
    const bx0 = 54, by0 = GY - 14 - bh, lift = 96;
    const slotX = SX + bayX(1), slotY = deck - 3 * TH - bh, dx = slotX - bx0;
    let deckSvg = '';
    tiers.forEach((n, b) => { if (!n) return; const x = bayX(b);
      deckSvg += `<rect x="${x - 3}" y="-36" width="171" height="7" fill="#33424F"/>`;
      for (let t = 0; t < n; t++) { const y = -30 - (t + 1) * TH + 1, k = b * 3 + t + 2;
        deckSvg += k % 3 === 0 ? ctr(x, y, 82, TH - 1, PALETTE[k % 7]) + ctr(x + 83, y, 82, TH - 1, PALETTE[(k + 3) % 7]) : ctr(x, y, 165, TH - 1, PALETTE[k % 7]); } });
    const bridgeX = bayX(4) + 8;
    // lashing bridges between bays (2 tiers high) and hatch covers under each bay
    const lashBridges = tiers.map((n, b) => b ? `<rect x="${bayX(b) - 5}" y="${-30 - 2 * TH}" width="4" height="${2 * TH}" fill="#55616D"/><rect x="${bayX(b) - 9}" y="${-30 - TH}" width="12" height="3" fill="#55616D"/>` : '').join('');
    const shipBody = `<path d="M0 -30 H1180 Q1232 -30 1222 10 L1192 52 H26 L0 -30 Z" fill="url(#gHull)" stroke="#132331" stroke-width="2"/>
      <rect x="2" y="-30" width="1196" height="6" fill="#E9EEF2" opacity=".9"/><path d="M1160 -30 h40 q22 0 24 -18 h-64 z" fill="#2E4A60" stroke="#132331" stroke-width="1.5"/>
      <rect x="1196" y="-82" width="4" height="34" fill="#55616D"/><circle cx="1198" cy="-84" r="3" fill="#F2F5F8"/>
      ${Array.from({ length: 14 }, (_, k) => `<circle cx="${70 + k * 80}" cy="-12" r="2.2" fill="#9FB3C2" opacity=".7"/>`).join('')}
      ${tiers.map((n, b) => `<rect x="${bayX(b) - 1}" y="-30" width="167" height="6" fill="#55616D"/>`).join('')}${lashBridges}
      <text x="60" y="12" font-size="15" font-weight="800" fill="#fff" letter-spacing="3">${esc(r.vessel)}</text>
      ${deckSvg}
      <rect x="${bridgeX}" y="-250" width="96" height="220" fill="#EEF2F5" stroke="#97A4AF"/><rect x="${bridgeX - 14}" y="-262" width="124" height="14" fill="#DDE3E8" stroke="#97A4AF"/>
      ${Array.from({ length: 6 }, (_, k) => `<rect x="${bridgeX + 8}" y="${-238 + k * 32}" width="80" height="10" fill="url(#gGlass)"/>`).join('')}
      <rect x="${bridgeX + 30}" y="-290" width="4" height="28" fill="#55616D"/><circle class="blink" cx="${bridgeX + 32}" cy="-294" r="3" fill="#FF5A4A"/>
      ${load ? `<g data-at="lash" data-delay="300" stroke="#1B2631" stroke-width="2.2">${[0, 1].map(i => `<line x1="${bayX(1) + 8 + i * 140}" y1="-30" x2="${bayX(1) + 40 + i * 80}" y2="${-30 - 2 * TH}"/><line x1="${bayX(1) + 40 + i * 80}" y1="-30" x2="${bayX(1) + 8 + i * 140}" y2="${-30 - 2 * TH}"/>`).join('')}</g>` : ''}`;
    const shipMoves = load ? 'start:1500,0;berth:0,0~2600;depart:1500,0~4200' : 'start:1500,0;arrive:0,0~3200';
    // our box: g0 = arrival (truck / ship), then up / across / down in one beat
    const loadChain = ['start:0,0;load:0,' + (lift - by0).toFixed(1) + '~900', `start:0,0;load:${dx.toFixed(1)},0@900~1300`, 'start:0,0;load:0,' + (slotY - lift).toFixed(1) + '@2300~900'];
    const disChain = [`start:${dx.toFixed(1)},0;discharge:0,0@900~1300`, 'start:0,' + (slotY - lift).toFixed(1) + ';discharge:0,0~900', 'start:0,' + (lift - by0).toFixed(1) + ';discharge:0,0@2300~900'];
    const g0 = load ? 'start:-640,0;berth:0,0~2200;depart:1500,0~4200' : 'start:1500,0;arrive:0,0~3200;yard:-760,0~2000';
    const lifts = load ? loadChain : disChain;
    const boxBody = `<g transform="translate(${bx0} ${by0}) scale(${K})">${boxSVG(c, { plate: false })}</g>`;
    // hoist ropes: from the head block up to the trolley (clipped at the trolley, so they shorten/lengthen as the box moves)
    const cables = `<g transform="translate(${bx0} ${by0})" stroke="#2B3238" stroke-width="2"><line x1="${bw / 2 - 9}" y1="-24" x2="${bw / 2 - 9}" y2="-600"/><line x1="${bw / 2 + 9}" y1="-24" x2="${bw / 2 + 9}" y2="-600"/></g>`;
    const spreader = `<g transform="translate(${bx0} ${by0})">${spreaderSVG(bw)}</g>`;
    const spAttrs = load ? 'data-until="load"' : 'data-until="discharge"';
    const trolleyTx = load ? `start:0,0;load:${dx.toFixed(1)},0@900~1300` : `start:${dx.toFixed(1)},0;discharge:0,0@900~1300`;
    const truckTx = load ? 'start:-640,0;berth:0,0~2200;load:-760,0@3400~1800' : 'start:-640,0;discharge:0,0~1400;yard:-760,0~2000';
    return `${svgOpen(s)}<defs><clipPath id="cableClip"><rect x="-700" y="64" width="2400" height="500"/></clipPath></defs>${sea(GY - 6)}
      <rect x="-700" y="${GY - 10}" width="964" height="120" fill="#B9C2C9"/><rect x="-700" y="${GY - 10}" width="964" height="6" fill="#fff" opacity=".4"/><rect x="258" y="${GY - 10}" width="8" height="120" fill="#7E8A95"/>
      ${skyline([[-60, 236, 46], [0, 252, 40]])}
      <g data-tx="${shipMoves}"><g transform="translate(${SX} ${SY})">${shipBody}<path d="M20 48 Q600 60 1196 48" stroke="#fff" stroke-width="3" fill="none" opacity=".55"/></g></g>
      ${quayCrane()}
      <g data-tx="${trolleyTx}"><g transform="translate(${bx0 + bw / 2 - 30} 50)"><rect x="0" y="0" width="60" height="14" rx="2" fill="#1E3446"/>${wheel(10, 0, 4)}${wheel(50, 0, 4)}
        <circle cx="21" cy="14" r="4" fill="#55616D"/><circle cx="39" cy="14" r="4" fill="#55616D"/>
        <rect x="-26" y="16" width="26" height="20" rx="3" fill="#E8C33A" stroke="#6B5410"/><rect x="-22" y="19" width="18" height="9" fill="url(#gGlass)"/><line x1="-13" y1="14" x2="-13" y2="16" stroke="#1E3446" stroke-width="3"/></g></g>
      <g ${spAttrs}><g clip-path="url(#cableClip)">${chain(lifts, cables)}</g>${chain(lifts, spreader)}</g>
      ${chain([truckTx], terminalTractor(bx0, bw))}
      ${chain([g0].concat(lifts), boxBody)}
      ${load ? tag(640, 84, `ETD ${plain('{etd}')} · ${r.vessel} ${r.voyage}`, 'data-at="docs" data-delay="600"') : tag(640, 84, plain(C.ui.arrivalNotice), 'data-at="yard" data-delay="1800"')}
      ${c.family === 'reefer' ? tag(420, 84, load ? 'PLUGGED ON BOARD ⚡ ' + plain('{setPoint}') : 'PLUGGED IN REEFER RACK ⚡', `data-at="${load ? 'lash' : 'yard'}" data-delay="1600"`, '#0B4F6C') : ''}
    </svg>`;
  }
  SCENES.loading = s => quay(s, 'load');
  SCENES.discharge = s => quay(s, 'discharge');

  /* --- Step 7: ocean voyage on a schematic map --- */
  SCENES.map = s => {
    const r = route(), M = r.map, c = container();
    const poly = pts => pts.map(p => p.join(',')).join(' ');
    const land = (C.mapLand || []).map(p => `<polygon points="${poly(p)}" fill="#EFE6D2" stroke="#C9B994" stroke-width="1.5"/>`).join('');
    const d = 'M' + M.path.map(p => p.join(' ')).join(' L');
    const alt = M.alt ? `<path d="M${M.alt.map(p => p.join(' ')).join(' L')}" fill="none" stroke="#7C8B97" stroke-width="2" stroke-dasharray="3 5" opacity=".8"/><text x="${M.altLabel[0]}" y="${M.altLabel[1]}" font-size="11" font-weight="700" fill="#55616D">${esc(plain(M.altText))}</text>` : '';
    const feeder = M.feeder ? `<path id="feederPath" d="M${M.feeder.map(p => p.join(' ')).join(' L')}" fill="none" stroke="#E07A24" stroke-width="3" stroke-dasharray="7 5"/>` : '';
    // Fractions along the route path for each beat (from vertex indices in route.map.at).
    const cum = [0]; for (let i = 1; i < M.path.length; i++) cum.push(cum[i - 1] + Math.hypot(M.path[i][0] - M.path[i - 1][0], M.path[i][1] - M.path[i - 1][1]));
    const total = cum[cum.length - 1];
    M.along = ['start:0'].concat(Object.keys(M.at).map(k => `${k}:${(cum[M.at[k]] / total).toFixed(4)}`)).join(';');
    const port = (p, main) => `<g><circle cx="${p.x}" cy="${p.y}" r="${main ? 7 : 5}" fill="${main ? '#1B2631' : '#fff'}" stroke="#1B2631" stroke-width="2"/><text x="${p.x + (p.dx || 10)}" y="${p.y + (p.dy || 4)}" font-size="12" font-weight="800" fill="#1B2631">${esc(p.name)}</text></g>`;
    const shipIcon = `<g><path d="M-22 0 H18 L24 -6 H-26 Z" fill="#1E3446"/><rect x="-18" y="-14" width="30" height="8" fill="#8FA3B3"/><rect x="-6" y="-14" width="8" height="8" fill="${c.family === 'reefer' ? '#E9EEF2' : 'var(--c-box)'}" stroke="#1B2631"/><rect x="10" y="-22" width="8" height="10" fill="#EEF2F5"/></g>`;
    return `${svgOpen(s)}<rect x="-700" y="-100" width="2360" height="700" fill="#A9D4EA"/>${land}
      <text x="20" y="450" font-size="11" fill="#33424F">${esc(plain(C.ui.mapNote))}</text>
      ${alt}<path id="routePath" d="${d}" fill="none" stroke="var(--c-primary)" stroke-width="3" stroke-dasharray="8 6"/>${feeder}
      ${M.ports.map(p => port(p, p.main)).join('')}
      ${M.feeder ? `<g id="feederShip" data-path="feederPath" data-along="start:0;depart:0;hub:1" data-d="2400" data-until="hub">${shipIcon}</g>` : ''}
      <g id="mainShip" data-path="routePath" data-along="${M.along}" data-d="2600" ${M.feeder ? 'data-at="hub"' : ''}>${shipIcon}</g>
      ${c.family === 'reefer' ? inset(690, 330, 250, 100, 'REMOTE REEFER MONITORING', ['Set point ' + plain('{setPoint}') + ' · supply air ✓', 'Alarms: none · power ✓', 'Readings sent several times a day']).replace('<g ', '<g data-at="ocean" ') : ''}
      ${tag(M.days[0], M.days[1], plain('{transit}'), 'data-at="arrive"', '#1D7048')}
    </svg>`;
  };

  /* --- Step 11: unstuffing at the consignee, empty return to the depot --- */
  SCENES.unstuff = s => {
    const c = container(), { w, h } = boxDims(c), f = c.family, t = c.id, y = GY - (h + 33);
    const open = f === 'dry' || f === 'reefer';
    const slots = open ? cartonSlots(w, h, y) : [];
    // loose cartons (NOT in the truck group): in the open box → into the consignee's warehouse; hidden before the truck leaves
    const loose = open ? `<g data-until="unstuff">${slots.slice().reverse().map((c, k) => `<g data-tx="start:0,0;unstuff:${c.sx - c.bx},${c.sy - c.by}@${k * 140}~900">${carton(c.bx, c.by)}</g>`).join('')}</g>` : '';
    let bg = ''; [430, 546, 662, 778].forEach((x, i) => { for (let k = 0; k < 3; k++) bg += `<rect x="${x}" y="${314 - k * 56}" width="112" height="54" fill="${PALETTE[(i + k) % 5]}" stroke="#6E7C88"/>`; });
    return `${svgOpen(s)}${ground()}
      ${warehouseSVG(20, plain(C.ui.consigneeWarehouse), { attrs: 'data-until="unstuff"' })}<g data-until="unstuff">${dockInterior()}</g>
      <g data-at="return" opacity=".9"><g opacity=".55">${bg}</g><rect x="20" y="20" width="236" height="30" rx="6" fill="#fff" stroke="#97A4AF"/><text x="138" y="41" text-anchor="middle" font-size="14" font-weight="800" fill="#1B2631">EMPTY DEPOT · ${esc(route().pod.toUpperCase())}</text>
        <rect x="80" y="${GY - 120}" width="140" height="120" fill="#D3DBE1" stroke="#97A4AF"/><text x="150" y="${GY - 96}" text-anchor="middle" font-size="11" font-weight="800" fill="#1B2631">${f === 'reefer' ? 'WASH + PTI' : f === 'tank' ? 'TANK CLEANING' : 'M&amp;R WORKSHOP'}</text></g>
      ${t === '40OT' || t === '40FR' ? `<g data-at="unstuff" data-until="unstuff"><line x1="${320 + w / 2}" y1="0" x2="${320 + w / 2}" y2="${y + 10}" stroke="#3F4750" stroke-width="3"/>${tag(320 + w / 2, 40, 'CRANE LIFTS THE CARGO OUT')}</g>` : ''}
      ${f === 'tank' ? `<g data-at="unstuff" data-until="unstuff"><path d="M${320 + w / 2} ${y + 6} C 260 ${y - 40}, 220 300, 160 300" stroke="#1B2631" stroke-width="7" fill="none"/>${tag(320 + w / 2 + 60, y - 40, 'DISCHARGING…', '', '#0B4F6C')}</g>` : ''}
      ${rig(c, { attrs: 'data-tx="start:0,0;return:1200,0~2400"', boxOpts: { wallAttr: open ? 'data-until="start"' : '', wall2Attr: open ? 'data-at="return"' : '', plate: true, cargo: false } })}${loose}
      ${rig(c, { attrs: 'data-tx="start:-1200,0;gatein:0,0~2400;depart:1200,0~2600"', boxOpts: { plate: true, cargo: false } })}
      ${inset(470, 14, 232, 112, 'EIR — EMPTY RETURN', [`Container ${CONTAINER_NO}`, 'Empty, clean ✓', 'Damage: none recorded', 'Detention clock: STOP'], 'data-at="gatein" data-delay="2400"')}
      ${tag(782, 150, '⏱ IMPORT DETENTION STOPS', 'data-at="gatein" data-delay="2600"', '#1D7048')}
    </svg>`;
  };

  // Narrator avatar (also used in the menu).
  function avatar(w) {
    return `<svg viewBox="0 0 120 90" width="${w}" aria-hidden="true"><rect x="6" y="14" width="108" height="62" rx="6" fill="var(--c-box)" stroke="var(--c-box-dark)" stroke-width="3"/>
      ${[22, 38, 54, 70, 86, 102].map(x => `<line x1="${x}" y1="18" x2="${x}" y2="72" stroke="#000" opacity=".12" stroke-width="4"/>`).join('')}
      <ellipse cx="44" cy="40" rx="8" ry="9" fill="#fff"/><ellipse cx="76" cy="40" rx="8" ry="9" fill="#fff"/><circle cx="46" cy="42" r="4" fill="#1B2631"/><circle cx="78" cy="42" r="4" fill="#1B2631"/>
      <path d="M46 56 q14 10 28 0" stroke="#1B2631" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`;
  }

  /* ---------- Start-up ---------- */
  function buildClouds() {
    $('#clouds').innerHTML = [[8, 120, 70, -10], [22, 90, 95, -45], [14, 150, 120, -80], [30, 70, 85, -20]].map(([top, w, dur, delay]) =>
      `<span class="cloud" style="top:${top}%;width:${w}px;animation-duration:${dur}s;animation-delay:${delay}s"></span>`).join('');
  }
  applyConfig(); mountDefs(); buildClouds(); retryUnsent();
  /* MOBILE: one surface at a time — body.surface hides the narration and fact while a sheet, a document,
     the transfer moment or a popover is open. */
  const surf = () => { document.body.classList.toggle('surface', ['#sheet', '#docv', '#xfer', '#pop'].some(q => $(q).classList.contains('open'))); };
  ['#sheet', '#docv', '#xfer', '#pop'].forEach(q => new MutationObserver(surf).observe($(q), { attributes: true, attributeFilter: ['class'] }));
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { const a = document.activeElement; if (a && a.id === 'mNick') a.scrollIntoView({ block: 'center' }); });
  $('.rotate .rbob').innerHTML = avatar(64);
  addEventListener('orientationchange', () => setTimeout(placeHs, 300));
  S = load();
  if (S && (S.v !== 3 || !S.settings)) S = null;
  if (S) { draft = Object.assign({}, S.settings); initChoices(); }
  // Bob's intro opens the game every time; saved progress is resumed from the menu ("Resume").
  if (S) S.screen = 'menu';
  renderIntro();

  // Test/debug hook (console only).
  window.__cj = { state: () => S, C, renderIntro, goStep, go, openQuestion, startQuiz, renderSummary, renderMenu, consult,
    answerRight: () => { const s = step(); answer(R(s.question).options.find(o => o.correct).id); },
    consultAll: () => { essentials(step()).forEach(h => { const arr = S.consulted[S.step] || (S.consulted[S.step] = []); if (!arr.includes(h.id)) arr.push(h.id); }); save(); renderHs(); renderBar(); },
    footprint: () => footprint(), closeXfer, resultItems: () => resultItems(), results: () => loadResults(),
    reset: () => { try { localStorage.removeItem(STORE); } catch (e) {} location.reload(); } };
})();
</script>
</body>
</html>
