20' / €195 per 40'), same order assumed for Cat Lai; Posorja ≈ €200 / €300 is an estimate (no public tariff found); reefer THC ≈ ×1.5 (estimate).", "source": "Carrier local-charge tariffs (China, Vietnam, Ecuador)"}, {"id": "v85", "claim": "Destination THC: Le Havre ≈ €295 per container (forwarder general tariff France, Q3 2026); Antwerp-Bruges ≈ €200 per 20' / €300 per 40' (2026 overview).", "source": "Carrier THC tariffs for North Europe (published per port)"}, {"id": "v86", "claim": "Documentation fee ≈ €95 per B/L and import customs clearance ≈ €105 per declaration (forwarder tariff France 2025–2026); export declaration ≈ €100 is an estimate. Duties and VAT are not included.", "source": "Forwarder / customs broker tariffs"}, {"id": "v87", "claim": "Inland transport costs are estimates (no public tariff): pre-carriage ≈ €300 Shanghai (≈ 120 km), ≈ €150 Ho Chi Minh City (≈ 40 km), ≈ €350 Ecuador (≈ 150 km); on-carriage incl. empty return ≈ €850 Le Havre → Paris region (≈ 200 km), ≈ €450 Antwerp → Belgian ripening centre (≈ 60 km). The same price is used for barge and rail (simplification).", "source": "Haulier, barge and rail operator quotations"}, {"id": "v88", "claim": "Sea distances: Shanghai–Le Havre via Suez ≈ 19,500 km (≈ 10,500 nm; via the Cape ≈ 13,800 nm); Ho Chi Minh City–Singapore ≈ 1,200 km (estimate); Singapore–Le Havre via Suez ≈ 15,600 km (Singapore–Rotterdam ≈ 8,440 nm); Posorja–Antwerp via Panama ≈ 10,500 km (routing tools give 9,500–13,200 km with port calls).", "source": "Sea-distance tables (e.g. NGA Pub. 151) and the actual service rotation"}, {"id": "v89", "claim": "Container ship default intensity ≈ 66 g CO₂e per TEU-km (dry) and ≈ 134 g per TEU-km (reefer, including on-board reefer energy); a 40' = 2 TEU. Clean Cargo lane factors for Asia–Europe are lower.", "source": "GLEC Framework default intensity values; Clean Cargo trade-lane factors"}, {"id": "v90", "claim": "Feeder ship ≈ 128 g CO₂e per TEU-km (GLEC 'other trade lanes', well-to-wheel); reefer on a feeder counted ×2 (estimate).", "source": "GLEC Framework default intensity values"}, {"id": "v91", "claim": "Land intensity (GLEC v3, Europe): articulated truck 34–40 t, container transport ≈ 73 g CO₂e per tonne-km (tank-to-wheel); inland container barge ≈ 16 g; electric rail ≈ 11 g (upstream electricity). Mass = cargo + tare (simplification).", "source": "GLEC Framework v3.x, road / rail / inland waterway tables"}, {"id": "v92", "claim": "Reefer on land ≈ 100 kWh per day plugged in (reported 96–139 kWh per day) × ≈ 0.4 kg CO₂e per kWh (assumed grid / genset mix) ≈ 40 kg CO₂e per day; 3 days at each terminal (assumption).", "source": "Reefer unit manufacturer data; national grid emission factors"}, {"id": "v93", "claim": "Exchange rate used for freight indices: ≈ 0.86 € per US$ (November 2026).", "source": "ECB euro reference rates"}], "quiz": {"1": [{"id": "q1", "q": "Where are the goods loaded into a full container (FCL)?", "options": [{"text": "At the shipper's own premises", "correct": true}, {"text": "On board the ship, at the port", "text2": ""}, {"text": "At the empty container depot"}], "explain": "For FCL, the shipper stuffs its own goods at its premises; the depot only handles empty boxes."}, {"id": "q2", "q": "What does the VGM include?", "options": [{"text": "The container's own weight plus everything inside", "correct": true}, {"text": "Only the weight of the goods, without the container"}, {"text": "The weight of the truck plus the loaded container"}], "explain": "VGM = tare + cargo + packaging + pallets + dunnage. It must reach the carrier before the VGM cut-off."}, {"id": "q3", "q": "Why does a container get a numbered seal?", "options": [{"text": "To prove nobody opened it during the journey", "correct": true}, {"text": "To show which ship and voyage it travels on"}, {"text": "To show that the customs duties are paid"}], "explain": "The seal number is written in the documents; a broken or different seal shows the box was opened."}, {"id": "q4", "q": "What happens to a container that reaches the port after the port cut-off?", "options": [{"text": "It can miss its ship and wait for the next one", "correct": true}, {"text": "The ship waits for it before leaving the port"}, {"text": "It goes back to the shipper free of charge"}], "explain": "Ships keep their schedule; a late box is 'rolled' to the next sailing, often a week later."}, {"id": "q5", "q": "Who usually decides which ship a container goes on, and where it sits on board?", "options": [{"text": "The carrier's and terminal's planners", "correct": true}, {"text": "The truck driver who brings it to the port"}, {"text": "The consignee who will receive it later"}], "explain": "Planners build the stowage plan from weights, destinations and special cargo."}, {"id": "q6", "q": "What is transshipment?", "options": [{"text": "Moving a container from one ship to another at a hub port", "correct": true}, {"text": "Moving a container from a truck onto a train for the next leg"}, {"text": "Returning an empty container to the depot after delivery"}], "explain": "On the Ho Chi Minh City route, a feeder brings the box to Singapore, where it is moved to the mainline ship."}, {"id": "q7", "q": "At destination, what must usually happen before the consignee can collect the container?", "options": [{"text": "Import customs clearance and release by the carrier", "correct": true}, {"text": "A new weighing of the full container, with a new VGM"}, {"text": "Nothing: the customer's truck just picks it up"}], "explain": "Customs must clear the goods and the carrier must release the box (B/L, freight and charges settled)."}, {"id": "q8", "q": "What is detention?", "options": [{"text": "A daily charge when the carrier's box stays out too long", "correct": true}, {"text": "A customs penalty paid for any wrong or missing documents"}, {"text": "The fee paid to the terminal for loading the ship"}], "explain": "After the free days, every extra day the box stays with the customer costs money."}, {"id": "q9", "q": "Do Incoterms decide who owns the goods?", "options": [{"text": "No — they decide costs, risks and tasks, not ownership", "correct": true}, {"text": "Yes — ownership changes at the risk transfer point, always"}, {"text": "Only under DDP, where the seller does everything for the buyer"}], "explain": "Ownership is set by the sales contract. Incoterms cover delivery, costs, risk and formalities."}, {"id": "q10", "q": "Under {incoterm}, who books and pays the ocean freight in your journey?", "options": [{"text": {"_by": "freight", "Seller": "The seller (exporter)", "Buyer": "The buyer (importer)"}, "correct": true}, {"text": {"_by": "freight", "Seller": "The buyer (importer)", "Buyer": "The seller (exporter)"}}, {"text": "The port's terminal"}], "explain": "E- and F-rules: the buyer contracts the main carriage. C- and D-rules: the seller does."}], "2": [{"id": "q1", "q": "Which document is the B/L drafted from?", "options": [{"text": "The shipping instructions (SI)", "correct": true}, {"text": "The booking confirmation (BC)"}, {"text": "The VGM declaration (SOLAS)"}, {"text": "The export customs declaration"}], "explain": "The SI gives parties, cargo description, packages, weights and seal; the booking lacks these details."}, {"id": "q2", "q": "Under SOLAS, a packed container without a VGM…", "options": [{"text": "must not be loaded until a VGM is received", "correct": true}, {"text": "can be loaded if the manifest shows a weight"}, {"text": "can be loaded once the shipper pays a fine"}, {"text": "is weighed on board by the crew after loading"}], "explain": "No VGM, no loading: the terminal keeps it off the load list. [TO VERIFY:v01]"}, {"id": "q3", "q": "Export detention usually runs…", "options": [{"text": "from empty gate-out to full gate-in at the terminal", "correct": true}, {"text": "from the booking date to the vessel's departure"}, {"text": "from full gate-in at the terminal to vessel loading"}, {"text": "from discharge at destination to final delivery"}], "explain": "Demurrage covers time in the terminal; detention covers time outside. Tariffs vary. [TO VERIFY:v21]"}, {"id": "q4", "q": "A sea waybill differs from a negotiable B/L because…", "options": [{"text": "it is not a document of title: no original is needed for release", "correct": true}, {"text": "it is only used for reefers and other perishable, urgent cargo"}, {"text": "it must be endorsed to the bank before the carrier gives any release"}, {"text": "it is issued before loading, so that it can travel with the box"}], "explain": "Sea waybills speed up release when no bank or onward sale needs a document of title."}, {"id": "q5", "q": "Which party lodges the EU entry summary declaration (ENS) for an FCL shipment to Le Havre?", "options": [{"text": "The ocean carrier (house data possibly by an NVOCC), before loading", "correct": true}, {"text": "The consignee, on arrival at Le Havre, together with the import entry"}, {"text": "The exporter's broker, together with the export declaration at origin"}, {"text": "The terminal at Le Havre, when the vessel's arrival is announced"}], "explain": "Under ICS2 the carrier files the ENS at least 24 h before loading for deep-sea containers. [TO VERIFY:v23]"}, {"id": "q6", "q": "What is the main risk at a transshipment hub?", "options": [{"text": "Missing the connection to the mainline vessel", "correct": true}, {"text": "A new VGM must be declared for the second ship"}, {"text": "The B/L must be reissued for the new vessel"}, {"text": "Import duties must be paid in the hub country"}], "explain": "Feeder delays or congestion can roll the box to a later mainline sailing. [TO VERIFY:v73]"}, {"id": "q7", "q": "Under merchant haulage at destination, who books the truck to the consignee?", "options": [{"text": "The consignee or its forwarder", "correct": true}, {"text": "The carrier, as part of the freight"}, {"text": "The terminal, after the discharge"}, {"text": "Customs, once the release is given"}], "explain": "Merchant haulage = the cargo side organises inland transport; the carrier only releases the box."}, {"id": "q8", "q": "A reefer's set point is…", "options": [{"text": "the temperature the unit must keep, given by the shipper", "correct": true}, {"text": "the place in the yard where the reefer is plugged in"}, {"text": "the reefer's maximum gross weight, shown on its door"}, {"text": "the deadline for the reefer's pre-trip inspection (PTI) check"}], "explain": "The set point is booked by the shipper and checked at PTI and throughout the voyage. [TO VERIFY:v56]"}, {"id": "q9", "q": "Under CIF, where does the risk pass from seller to buyer?", "options": [{"text": "On board the vessel at the port of loading", "correct": true}, {"text": "At discharge in the port of destination"}, {"text": "At the buyer's warehouse, on final delivery"}, {"text": "At the export terminal gate, on gate-in"}], "explain": "Costs run to destination, but risk passes on board at origin — two critical points."}, {"id": "q10", "q": "Which Incoterm does ICC recommend instead of FOB for containers?", "options": [{"text": "FCA", "correct": true}, {"text": "FAS"}, {"text": "EXW"}, {"text": "CFR"}], "explain": "Containers are handed over at the terminal before loading; FCA matches that delivery point. [TO VERIFY:v15]"}], "3": [{"id": "q1", "q": "A customer's box is rolled because of overbooking, and the L/C requires shipment by a date that the next sailing misses. Best first action?", "options": [{"text": "Inform the customer immediately with options (other service, split, L/C amendment)", "correct": true}, {"text": "Issue the B/L with the original vessel and date, exactly as the letter of credit requires"}, {"text": "Wait until the next sailing is confirmed, then inform the customer in writing"}, {"text": "Change the B/L date after loading so that it matches the latest shipment date"}], "explain": "Never misdate a B/L (fraud). Early transparency lets the shipper seek an L/C amendment. [TO VERIFY:v31]"}, {"id": "q2", "q": "The VGM received differs by 3.5 t from the booking estimate. What does the carrier rely on for stowage?", "options": [{"text": "The VGM — the booking weight is only an estimate", "correct": true}, {"text": "The booking weight, until the B/L has been issued"}, {"text": "The average of both weights, as a safety margin"}, {"text": "The gross weight shown on the commercial invoice"}], "explain": "Stowage uses the VGM; large gaps should still be queried for misdeclaration. [TO VERIFY:v01]"}, {"id": "q3", "q": "Seal number on the door ≠ seal number on the B/L after a customs inspection at origin. Correct handling?", "options": [{"text": "Record the customs seal and amend the documents and manifest as required", "correct": true}, {"text": "Ignore it: customs seals are always accepted without any document change"}, {"text": "Replace the customs seal with a new one bearing the original seal number"}, {"text": "Cancel the shipment and issue a new booking with the new seal number"}], "explain": "The new seal must be documented to avoid holds and claims at destination."}, {"id": "q4", "q": "Under FOB, the box is damaged in the export yard before loading. Who bears the risk?", "options": [{"text": "The seller — risk passes only once the box is on board", "correct": true}, {"text": "The buyer — because it booked and pays the ocean freight"}, {"text": "The carrier, always, as soon as the box is in the yard"}, {"text": "The terminal, always, while the box is in its custody"}], "explain": "This gap is why ICC recommends FCA for containers; carrier/terminal liability is a separate question. [TO VERIFY:v15]"}, {"id": "q5", "q": "A reefer alarm shows supply air +6 °C above set point mid-ocean on a frozen cargo. First step?", "options": [{"text": "Reefer team checks remote data, has the crew inspect and act; inform the customer", "correct": true}, {"text": "Wait until arrival, so as not to alarm the customer about a short-lived deviation"}, {"text": "Change the set point to +6 °C above, so the alarm stops and the log stays clean"}, {"text": "Switch the unit off and on again to reset it, then watch the next remote readings"}], "explain": "Early technical intervention and documentation protect the cargo and the claim position. [TO VERIFY:v57]"}, {"id": "q6", "q": "Original B/L 'to order' not yet received by the consignee; cargo is in demurrage. The consignee asks for release against an LOI. Carrier position?", "options": [{"text": "Release only under the carrier's LOI policy and approval — misdelivery risk is high", "correct": true}, {"text": "Release immediately against the LOI, since demurrage hurts everyone, the carrier too"}, {"text": "Release to the notify party, who is named on the B/L and can sign for the cargo"}, {"text": "Release as soon as the freight is paid, since the carrier then has no more risk"}], "explain": "Delivering without the original exposes the carrier to the lawful B/L holder. [TO VERIFY:v75]"}, {"id": "q7", "q": "General average is declared after an engine-room fire. What does the consignee need before delivery?", "options": [{"text": "To provide GA security (bond and guarantee, often via the cargo insurer)", "correct": true}, {"text": "Nothing, as long as the ocean freight was prepaid at origin by the shipper"}, {"text": "A new set of original B/Ls, issued after the general average declaration"}, {"text": "A new VGM, since the fire may have changed the weight of the cargo on board"}], "explain": "Uninsured cargo owners must pay security themselves — a key reason to insure. [TO VERIFY:v76]"}, {"id": "q8", "q": "A DG tank arrives at the terminal without the DG declaration matching the booking (UN number differs). Terminal action?", "options": [{"text": "Refuse or hold the box until the documents and DG approval match", "correct": true}, {"text": "Accept it and fix the papers later, before the vessel's arrival"}, {"text": "Stow it under deck to be safe, away from accommodation and heat"}, {"text": "Change the UN number on the booking to match the declaration"}], "explain": "Misdeclared DG is a major safety risk; segregation and approval depend on the exact UN number. [TO VERIFY:v59]"}, {"id": "q9", "q": "A customer disputes detention: the box was ready but the consignee had no delivery slot. Who decides?", "options": [{"text": "The tariff or contract terms: free time, clock events, agreed exceptions", "correct": true}, {"text": "The Incoterm in the sale contract, which allocates delays between parties"}, {"text": "The terminal, which records the gate times and owns the container clock"}, {"text": "Customs, since the box stayed under customs control during the whole time"}], "explain": "D&D is contractual; billing must follow the agreed events and rules. [TO VERIFY:v72]"}, {"id": "q10", "q": "Under CIF, the buyer finds the insurance excludes the loss that occurred. Why is this common?", "options": [{"text": "CIF only requires minimum cover (Institute Cargo Clauses C)", "correct": true}, {"text": "The insurance stops at the origin terminal, before loading"}, {"text": "The insurance is the carrier's job, not the seller's, under CIF"}, {"text": "CIF requires no insurance at all; only CIP requires a policy"}], "explain": "Buyers needing wider cover should ask for CIP (ICC A) or extra cover. [TO VERIFY:v18]"}]}, "footprint": {"title": "Cost & CO₂ — indicative", "kicker": "Indicative · November 2026", "date": "November 2026", "currency": "€", "tip": "Indicative cost and CO₂e of the journey so far — click for the details", "intro": "The two counters add up, step by step, what your container's journey costs and emits. **Orders of magnitude only**: real prices depend on the contract, the date and the carrier.", "note": "Indicative, November 2026. Freight from public spot indices (Drewry WCI, Xeneta) converted at ≈ 0.86 € per US$ [TO VERIFY:v93]; terminal handling and fees from published tariffs; inland legs are estimates. **Not included:** duties and VAT, cargo insurance, demurrage & detention, peak-season or emergency surcharges. The seller / buyer split follows the Incoterm's cost transfer point (export clearance: {exportBy}; import clearance: {importBy}). Under C rules, destination THC is often billed to the buyer unless the freight contract includes it. CO₂e = distance × GLEC default intensity factor (ISO 14083 / GLEC method); a 40' counts as 2 TEU; reefers use the reefer factor at sea plus plug-in energy on land.", "labels": {"pre": "Pre-carriage by {mode} (cargo + tare)", "on": "On-carriage by {mode} (cargo + tare)", "ret": "Empty return by truck (tare only)", "plugO": "Reefer plugged in at the export terminal", "plugD": "Reefer plugged in at the import terminal"}, "factors": {"ship": {"kg": 0.0664, "unit": "TEU-km", "label": "Container ship, deep-sea, dry", "v": "v89"}, "shipReefer": {"kg": 0.134, "unit": "TEU-km", "label": "Container ship, reefer", "v": "v89"}, "feeder": {"kg": 0.128, "unit": "TEU-km", "label": "Feeder ship, dry", "reeferX": 2, "v": "v90"}, "truck": {"kg": 0.073, "unit": "t-km", "label": "Articulated truck 34–40 t, container", "v": "v91"}, "barge": {"kg": 0.016, "unit": "t-km", "label": "Inland container barge", "v": "v91"}, "rail": {"kg": 0.011, "unit": "t-km", "label": "Electric rail, container", "v": "v91"}, "reeferDay": {"kg": 40, "unit": "day", "label": "Reefer plugged in on land", "v": "v92"}}, "routes": {"SHA-LEH": {"preKm": 120, "onKm": 200, "returnKm": 200, "plugDays": 3, "sea": [{"kind": "ship", "km": 19500, "label": "Shanghai → Le Havre via Suez (≈ 19,500 km) [TO VERIFY:v88]"}]}, "HCM-SIN-LEH": {"preKm": 40, "onKm": 200, "returnKm": 200, "plugDays": 3, "sea": [{"kind": "feeder", "km": 1200, "label": "Feeder Ho Chi Minh City → Singapore (≈ 1,200 km) [TO VERIFY:v88]"}, {"kind": "ship", "km": 15600, "label": "Singapore → Le Havre via Suez (≈ 15,600 km) [TO VERIFY:v88]"}]}, "GYE-ANR": {"preKm": 150, "onKm": 60, "returnKm": 60, "plugDays": 3, "sea": [{"kind": "ship", "km": 10500, "label": "Posorja → Antwerp-Bruges via Panama (≈ 10,500 km) [TO VERIFY:v88]"}]}}, "costs": [{"step": 3, "label": "Pre-carriage to the export terminal", "route": {"SHA-LEH": 300, "HCM-SIN-LEH": 150, "GYE-ANR": 350}, "v": "v87"}, {"step": 4, "label": "Export customs declaration", "eur": 100, "payer": "exportBy", "v": "v86"}, {"step": 4, "label": "B/L and documentation fee", "eur": 95, "v": "v86"}, {"step": 5, "label": "Origin terminal handling (THC)", "route": {"SHA-LEH": {"20": 130, "40": 195}, "HCM-SIN-LEH": {"20": 130, "40": 195}, "GYE-ANR": {"20": 200, "40": 300}}, "reeferX": 1.5, "v": "v84"}, {"step": 7, "label": "Ocean freight incl. bunker surcharge (BAF)", "route": {"SHA-LEH": {"20": 1900, "40": 3000, "reefer": 3800}, "HCM-SIN-LEH": {"20": 1950, "40": 3100, "reefer": 3800}, "GYE-ANR": {"20": 1350, "40": 2100, "reefer": 4300}}, "v": {"SHA-LEH": "v78", "HCM-SIN-LEH": "v79", "GYE-ANR": "v80"}, "vReefer": "v81"}, {"step": 7, "label": "Out-of-gauge surcharge (lost slots, special stowage)", "eur": 1500, "when": {"family": "oog"}, "v": "v82"}, {"step": 7, "label": "Dangerous-goods surcharge (IMDG class 3)", "eur": 350, "when": {"family": "tank"}, "v": "v83"}, {"step": 8, "label": "Destination terminal handling (THC)", "route": {"SHA-LEH": 295, "HCM-SIN-LEH": 295, "GYE-ANR": {"20": 200, "40": 300}}, "reeferX": 1.5, "v": "v85"}, {"step": 9, "label": "Import customs clearance (broker fee; duties and VAT not included)", "eur": 105, "payer": "importBy", "v": "v86"}, {"step": 10, "label": "On-carriage to the consignee, incl. empty return", "route": {"SHA-LEH": 850, "HCM-SIN-LEH": 850, "GYE-ANR": 450}, "v": "v87"}]}, "steps": [{"id": 1, "short": "Booking", "title": "Booking & empty release", "scene": "depot", "sceneDesc": "A booking request travels from the shipper to the carrier and a confirmation comes back. In an empty-container depot, a truck drives in, an empty container is lowered onto it, inspected at the gate and driven out.", "beats": [{"id": "book", "ms": 1800, "narration": {"1": "The [[shipper]] reserves space for me on a ship, from {pol} to {pod}: that's the [[booking]].", "2": "It starts with a [[booking]] request: equipment type and quantity, {pol} → {pod}, commodity ({cargo}), estimated weight, preferred sailing and the contract or quote behind the rate. [TO VERIFY:v30]", "3": "Booking request via portal, platform or EDI against a service contract or spot quote. Special cargo — reefer, DG, OOG — needs approval before confirmation. [TO VERIFY:v30]"}, "caption": {"2": "Under {incoterm}, the {freightBy} side contracts the ocean freight with the carrier."}}, {"id": "confirm", "ms": 1800, "narration": {"1": "The carrier confirms space and an empty box with a [[booking-confirmation]]: my travel plan.", "2": "Customer service validates allocation, equipment and approvals, then issues the [[booking-confirmation]]. Open it: every line drives a later step.", "3": "Confirmation against allocation and equipment availability. Watch the fine print: cut-offs, free time, pick-up and return locations, special-cargo approvals."}, "caption": {"2": "Carriers may accept slightly more bookings than slots to offset no-shows. [TO VERIFY:v31]"}}, {"id": "release", "ms": 3600, "narration": {"1": "A truck collects me, empty, at the [[depot]].", "2": "The haulier presents the [[release-order|release reference]]. [[equipment-control|Equipment control]] allocated the type and, if needed, a grade (food quality, {family}).", "3": "Empty release against the reference; grade and condition must match the commodity. Reefers need a passed [[pti]], tanks a cleanliness check, OOG equipment the right fittings. [TO VERIFY:v57]"}, "caption": {"2": {"_by": "family", "reefer": "Reefer: [[pti]] passed, [[set-point]] {setPoint} programmed before release. [TO VERIFY:v56]", "tank": "Tank: last cargo and cleaning checked — tanks are usually supplied by tank operators. [TO VERIFY:v59]", "oog": "Special equipment is scarce: the depot may need time to supply it. [TO VERIFY:v58]", "*": "Wrong box for the cargo (dirty, damaged) = refused at stuffing and a second truck trip."}}}, {"id": "gateout", "ms": 1600, "narration": {"1": "At the gate, my condition is noted on an [[eir]] and my [[detention]] clock starts.", "2": "Gate-out inspection recorded on the [[eir]], often digital with photos. The export [[detention]] clock runs until full gate-in at the terminal. [TO VERIFY:v21]", "3": "EIR at gate-out, movement reported to the carrier (EDI CODECO). Export detention clock starts per tariff. [TO VERIFY:v36] [TO VERIFY:v21]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "Two days before the cut-off, capacity management cuts the allocation on {vessel}: your customer's box is on the list of bookings to roll to next week's sailing. The customer's letter of credit requires shipment by this week."}}], "fact": {"beat": "release", "text": {"1": "Asia ships more to Europe than it buys back, so many boxes return empty. [TO VERIFY:v38]", "2": "Empties are about 20% of all container handling in ports. [TO VERIFY:v38]"}}, "hotspots": [{"id": "booker", "beat": "book", "until": "confirm", "x": 413, "y": 128, "label": "Shipper / forwarder", "kind": "Stakeholder", "essential": [1], "body": {"1": "The exporter or its forwarder makes the booking. Under {incoterm}, the ocean freight is arranged by the {freightBy}; when that's the buyer, its forwarder near {pol} usually books for it.", "2": "The booking party is not always the B/L shipper. A forwarder acting as [[nvocc]] books in its own name and issues its own house B/L. [TO VERIFY:v34]"}}, {"id": "desk", "beat": "book", "until": "confirm", "x": 590, "y": 128, "label": "Booking desk", "kind": "Stakeholder", "body": {"1": "The carrier's customer service checks space and equipment, then confirms. Many bookings are made online.", "2": "Checks: allocation by trade and customer, equipment at the depot, rate validity, special approvals (DG desk, reefer, OOG). [TO VERIFY:v30]"}}, {"id": "rate", "beat": "confirm", "x": 760, "y": 40, "label": "Freight rate", "kind": "Charge", "body": {"1": "The price of the trip: ocean freight plus surcharges such as [[baf]] (fuel) and port handling ([[thc]]).", "2": "All-in, or base rate + surcharges (BAF, peak season, origin/destination THC, documentation fee). Names and structures vary by carrier. [TO VERIFY:v35]"}}, {"id": "bc", "beat": "confirm", "x": 520, "y": 160, "label": {"1": "Booking confirmation", "2": "Booking confirmation"}, "kind": "Document", "essential": [2, 3], "doc": {"2": "bc", "3": "bc"}, "levels": [2, 3]}, {"id": "depot", "beat": "release", "x": 140, "y": 72, "label": "Empty depot", "kind": "Stakeholder", "essential": [1], "body": {"1": "A yard where empty containers wait between trips. They are inspected, cleaned and repaired there.", "2": "Often run by a third party under contract: storage, maintenance and repair ([[mnr]]), cleaning, reefer PTI. Gate movements are reported electronically. [TO VERIFY:v36]"}}, {"id": "handler", "beat": "release", "x": 200, "y": 250, "label": "Empty handler", "kind": "Equipment", "body": {"1": "A forklift-like machine built to lift and stack light, empty containers.", "2": "Designed for empty boxes only; full boxes need reach stackers or yard cranes. [TO VERIFY:v37]"}}, {"id": "special", "beat": "release", "until": "release", "x": 555, "y": 205, "when": {"family": ["reefer", "tank", "oog"]}, "label": {"_by": "family", "reefer": "PTI & set point", "tank": "Tank check", "oog": "Special equipment"}, "kind": "Equipment", "body": {"_by": "family", "reefer": {"1": "Before a reefer leaves the depot, its cooling machine is tested ([[pti]]) and set to the temperature the shipper asked for: {setPoint} for {cargo}.", "2": "PTI passed and [[set-point]] {setPoint} programmed; ventilation and humidity settings per booking. A wrong set point is a classic cause of cargo claims. [TO VERIFY:v56] [TO VERIFY:v57]"}, "tank": {"1": "Tanks carry liquids, often dangerous. The tank must be clean and suitable for {cargo}.", "2": "Tank containers are usually supplied by tank operators; the last cargo and cleaning certificate must be compatible with the new product. DG approval is required at booking. [TO VERIFY:v59]"}, "oog": {"1": "{box} boxes are rarer than standard ones, so they must be ordered early.", "2": "OOG bookings need the exact dimensions and weight, and approval by the special-cargo desk and vessel planners before confirmation. [TO VERIFY:v58]"}}}, {"id": "eir", "beat": "gateout", "x": 586, "y": 160, "label": "EIR", "kind": "Document", "body": {"1": "Equipment Interchange Receipt: a short report on my condition each time I change hands — dents, holes, cleanliness.", "2": "Signed or digitally confirmed by driver and depot, often with photos. Damage found later without an EIR record can be charged to the merchant."}}, {"id": "clock", "beat": "gateout", "x": 782, "y": 128, "label": "Detention clock", "kind": "Charge", "essential": [2, 3], "body": {"1": "The container belongs to the carrier. After the free days, every extra day outside costs money: that's [[detention]].", "2": "Export detention typically runs from empty gate-out to full gate-in (merchant haulage). Illustrative free time: {freeDays} days, then {cur}80 per day. [TO VERIFY:v21] [TO VERIFY:v12]", "3": "Collect the empty too early and free time burns before the cut-off. Some carriers combine demurrage and detention into one free-time pool. [TO VERIFY:v21]"}}], "docs": {"bc": {"title": "Booking confirmation", "heading": "BOOKING CONFIRMATION", "sub": "Fictional example", "stamp": "CONFIRMED", "rows": [{"label": "Booking no.", "value": "{bookingNo}"}, {"label": "Routing", "value": "{pol} → {pod}"}, {"label": "Vessel / voyage", "value": "{vessel} / {voyage}"}, {"label": "Equipment", "value": "1 × {box} ({boxCode}) · {cargo}", "zone": 1}, {"label": "Special", "value": {"_by": "family", "reefer": "Set point {setPoint} · vents per booking", "tank": "DG approved · {cargo}", "oog": "OOG approved · dimensions on file", "*": "—"}}, {"label": "Empty pick-up", "value": "Depot near {pol} · release R-58214"}, {"label": "Full return to", "value": "{polTerminal}"}, {"label": "Cut-offs", "value": "SI {siCutoff} · VGM {vgmCutoff} · Port {cyCutoff}", "zone": 2}, {"label": "Free time", "value": "{freeDays} days detention (illustrative)", "zone": 3}, {"label": "Freight terms", "value": "Freight {freightTerms}"}], "points": {"1": {"2": "Size-type code per ISO 6346 ({boxCode}). Substituting equipment needs the customer's agreement. [TO VERIFY:v32]", "3": "Equipment and commodity drive approvals: a change of commodity after confirmation (e.g. to DG) requires a new approval."}, "2": {"2": "Documentation (SI), VGM and port (CY) cut-offs. Order and timing vary by carrier and port. [TO VERIFY:v20]"}, "3": {"2": "From the tariff or the customer's contract. Illustrative value from CONFIG. [TO VERIFY:v12]"}}, "check": {"2": {"prompt": "Which deadline comes first in this booking?", "options": [{"id": "a", "correct": true, "text": "The documentation (SI) cut-off — {siCutoff}"}, {"id": "b", "text": "The port (CY) container cut-off — {cyCutoff}", "fb": "The full box can arrive last; paperwork closes earlier."}, {"id": "c", "text": "The VGM submission cut-off — {vgmCutoff}", "fb": "Here the VGM closes after the SI."}, {"id": "d", "text": "The vessel's scheduled departure (ETD) — {etd}", "fb": "ETD comes after every cut-off."}], "explain": "Here the SI closes first, then the VGM, then the port cut-off. Sequences vary by carrier and port — always read the confirmation. [TO VERIFY:v20]"}, "3": {"prompt": "Empty picked up Day 1, full gate-in at {polTerminal} Day 5, free time {freeDays} days (export detention). What is billed?", "options": [{"id": "a", "correct": true, "text": "Nothing — the box was back within the free time"}, {"id": "b", "text": "4 days of detention, counted from Day 1 to Day 5", "fb": "Days are charged only beyond the free time."}, {"id": "c", "text": "5 days of demurrage at the export terminal yard", "fb": "Demurrage covers time inside the terminal, not this period."}, {"id": "d", "text": "It depends on the Incoterm agreed in the sale contract", "fb": "Billing follows the tariff or contract; the Incoterm only shapes who should bear it between seller and buyer."}], "explain": "Detention runs gate-out to gate-in per tariff; 4 days < {freeDays} free days. Who ultimately bears D&D between seller and buyer is a sales-contract question. [TO VERIFY:v21]"}}}}, "dossier": {"documents": ["**Booking request / confirmation** — portal or EDI (IFTMBF/IFTMBC). [TO VERIFY:v30]", "**Release reference / PIN** — sometimes time-limited.", "**EIR** at gate-out — the box's condition on record.", "**Rate agreement** — service contract or quote reference."], "costs": ["**Ocean freight + surcharges** (BAF, THC…), fixed by contract or quote. [TO VERIFY:v35]", "**Cancellation / no-show fees** at some carriers. [TO VERIFY:v31]", "**Export detention** from empty gate-out. [TO VERIFY:v21]", "**Damage / cleaning recharges** if the return EIR shows new damage."], "risks": ["**Rolled** after overbooking or a [[blank-sailing]]: inform the customer early. [TO VERIFY:v31]", "**Wrong equipment grade** → rejected at stuffing, extra trucking.", "**Empty collected too early** → free time burnt before the cut-off.", {"text": "**No special approval** for reefer/DG/OOG → booking cannot be confirmed. [TO VERIFY:v58]", "levels": [3]}], "jobs": ["**Sales & pricing** — contracts, quotes, surcharges.", "**Capacity / allocation management** — who gets space on which vessel.", "**Customer service** — validation, confirmation, changes.", "**Equipment control** — release, repositioning, depot vendors; **DG / special cargo desk** — approvals."]}, "incoNote": {"_by": "group", "E": "The buyer (or its forwarder near {pol}) books and collects the empty.", "F": "The buyer books the freight, so it must pass the booking details to the seller in time.", "C": "The seller books and pays the freight to {pod}.", "D": "The seller books the whole carriage to the buyer's door."}, "keyPoints": {"1": ["Every journey starts with a booking; the booking confirmation sets ship, places and deadlines.", "The party paying the ocean freight under the Incoterm makes the booking.", "Empty containers come from depots; their condition is recorded on an EIR and the detention clock starts at gate-out."], "2": ["Booking → validation (allocation, equipment, approvals) → confirmation with cut-offs.", "Who books follows the Incoterm and the contract of carriage; NVOCCs book in their own name.", "Equipment control releases the right type and grade; reefers need PTI and the right set point.", "Export detention starts at gate-out, per tariff."], "3": ["Read the confirmation like a contract: cut-off sequence, free time, pick-up/return locations, approvals.", "Rollings must be communicated at once — never 'fix' a deadline by misdating a B/L.", "Special cargo (reefer, DG, OOG) is approved before confirmation, not after."]}, "question": {"1": {"prompt": "I'm an empty container on a truck, just out of the depot. What happens next?", "hint": "I'm empty. Where are the goods waiting?", "options": [{"id": "a", "correct": true, "text": "The truck takes me to the seller's warehouse, where the goods are put inside me.", "confirm": "Exactly. The goods are waiting at the shipper's premises, so I go there to be filled ('stuffed'). Under {incoterm}, this trip is arranged by {preBy}."}, {"id": "b", "text": "The truck takes me straight to the port, and I'm loaded onto the ship still empty.", "why": "I'm still empty! The goods are at the shipper's warehouse.", "realLife": "An empty box at the export terminal would be refused, and the shipper would pay for an extra trip.", "whenRight": "Carriers do move empties to ports to reposition them — but that's their own move, not a customer's booking."}, {"id": "c", "text": "I stay at the depot, and the seller brings the goods here in small vans, one by one.", "why": "Depots only handle empty containers. For a full container load ([[fcl]]), the shipper loads its own goods.", "realLife": "The depot has no goods and no staff to load them: the truck would wait for nothing.", "whenRight": "Small shipments ([[lcl]]) are consolidated at a [[cfs]] — a different service and place."}]}, "2": {"prompt": "Booking confirmed, empty {box} gated out with a clean EIR. What happens next?", "options": [{"id": "a", "correct": true, "text": "The haulier positions the empty at the shipper's premises for stuffing, within the free time.", "confirm": "Correct. FCL cargo is stuffed at origin by the shipper. Too early burns detention free time; too late puts the VGM and port cut-offs at risk. Under {incoterm}, this leg is for {preBy}."}, {"id": "b", "text": "The haulier delivers the empty to the export terminal, where the cargo is stuffed before loading.", "why": "Export terminals receive full containers for loading, not empties for stuffing.", "realLife": "Refused or charged for handling and storage; a second truck move puts the cut-offs at risk.", "whenRight": "For [[lcl]] or port-side services, cargo is stuffed at a [[cfs]] near the port — another booking and service."}, {"id": "c", "text": "The shipper submits the SI and asks the carrier to issue the original B/L against the booking.", "why": "A B/L needs actual cargo details (seal, packages, weights) and the carrier must have taken charge of the goods — the box is still empty.", "realLife": "A B/L issued before receiving the goods certifies something untrue: fraud exposure and L/C problems.", "whenRight": "Early SI submission is fine once data is final; the B/L comes after receipt or loading."}, {"id": "d", "text": "The depot weighs the empty container so that the shipper can declare the VGM to the carrier.", "why": "The [[tare]] is marked on the door and the [[csc-plate]]. The VGM is the packed container's weight — after stuffing.", "realLife": "A 'VGM' declared before stuffing is not verified: misdeclaration and unsafe stowage. [TO VERIFY:v02]", "whenRight": "Method 2 uses the marked tare plus weighed contents — no depot weighing needed."}]}, "3": {"prompt": "Case: allocation is cut and the booking is on the roll list. The customer's L/C requires shipment this week. What should you do first?", "options": [{"id": "a", "correct": true, "text": "Tell the customer now and offer options: another service this week, or time to amend the L/C.", "confirm": "Right. Early, documented communication with alternatives is the professional standard; the shipper can then act with its bank. Never adjust a B/L date to fit the L/C. [TO VERIFY:v31]"}, {"id": "b", "text": "Keep the booking quietly and issue the B/L with this week's vessel and date, as the L/C requires.", "why": "A B/L must reflect the vessel and date the goods were actually shipped on.", "realLife": "Misdated or false B/Ls are fraud: the carrier loses its defences and may face L/C fraud claims.", "whenRight": "Never."}, {"id": "c", "text": "Wait for the final load list before telling the customer, to avoid worrying them for nothing.", "why": "Waiting removes the customer's options (other service, L/C amendment).", "realLife": "The customer discovers the rolling at the last minute: missed L/C, penalties, lost account.", "whenRight": "Only if the roll list is still provisional — and even then, a heads-up is better."}, {"id": "d", "text": "Cancel the booking, refund the customer and suggest they look for space with another carrier.", "why": "Cancelling doesn't ship the goods; the customer needs a solution, not a refund.", "realLife": "The customer must rebook at a possibly higher spot rate and still misses the L/C date.", "whenRight": "If the customer chooses to cancel after being offered alternatives."}]}}}, {"id": 2, "short": "Stuffing & VGM", "title": "Stuffing, sealing & VGM", "scene": "warehouse", "sceneDesc": "Side view of the shipper's premises. A truck brings the container to the loading dock nts and dry pallets help. Wooden pallets must usually meet [[ispm15]]. [TO VERIFY:v24]"}}}, {"id": "dist", "beat": "stuff", "until": "stuff", "levels": [2, 3], "x": 720, "y": 140, "label": "Load centre", "kind": "Rule", "body": {"2": "The [[ctu-code]] gives guidance on load distribution: a heavy end is dangerous to lift and to drive. [TO VERIFY:v08]"}}, {"id": "seal", "beat": "seal", "x": 300, "y": 262, "essential": [1, 2, 3], "when": {"container": ["20DV", "40DV", "40HC", "40RF", "40OT", "20TK"]}, "label": {"1": "Seal", "2": "Seal record"}, "kind": "Document / equipment", "doc": {"2": "seal", "3": "seal"}, "body": {"1": "A single-use, numbered lock that can only be removed by cutting it. Its number goes into the shipping documents: a broken or different seal shows that someone opened me."}}, {"id": "lashing", "beat": "seal", "x": 560, "y": 230, "essential": [2, 3], "when": {"container": ["40FR"]}, "label": "Lashing check", "kind": "Safety", "body": {"1": "A flat rack has no doors to seal. The chains and straps holding the cargo are checked and photographed instead.", "2": "Lashing must withstand sea forces (rolling, pitching). Photos and a survey report are the evidence if a claim arises. [TO VERIFY:v58]"}}, {"id": "dg", "beat": "seal", "x": 700, "y": 200, "when": {"family": ["tank"]}, "label": "DG labels", "kind": "Rule", "body": {"1": "The orange-red diamond tells everyone the tank holds a flammable liquid (class 3).", "2": "[[placard|Placards]] on all sides, UN number displayed, DG declaration and container packing certificate from the shipper. [TO VERIFY:v25] [TO VERIFY:v59]"}}, {"id": "vgm", "beat": "vgm", "x": 345, "y": 124, "essential": [1, 2, 3], "label": {"1": "VGM (total weight)", "2": "VGM declaration"}, "kind": "Document", "doc": {"2": "vgm", "3": "vgm"}, "visual": "vgm", "body": {"1": "VGM = my own empty weight ([[tare]]) + everything inside me. It must reach the carrier before the VGM deadline, or I stay on the quay."}}, {"id": "markings", "beat": "vgm", "x": 520, "y": 312, "label": "Door markings", "kind": "Equipment", "body": {"1": "My maximum weight ({mgm} kg) and my empty weight ({tare} kg) are painted on my door. [TO VERIFY:v53]", "2": "MGM, tare and payload, plus the [[csc-plate]]. Use the actual markings of the unit, not a typical value. [TO VERIFY:v05]"}}, {"id": "weighbridge", "beat": "vgm", "x": 900, "y": 392, "label": "Weighbridge", "kind": "Equipment", "body": {"1": "A giant scale for trucks: weigh the loaded truck, then subtract the truck's own weight.", "2": "Certified and calibrated per national rules (Method 1). Road limits apply too, e.g. 44 t gross for a 5-axle combination in France. [TO VERIFY:v02] [TO VERIFY:v13]"}}], "docs": {"seal": {"title": "Seal record", "heading": "CONTAINER SEAL RECORD", "sub": "Fictional example", "stamp": "SHIPPER COPY", "rows": [{"label": "Booking no.", "value": "{bookingNo}"}, {"label": "Container no.", "value": "{containerNo}", "zone": 1}, {"label": "Seal number", "value": "{sealNo}", "zone": 2}, {"label": "Seal type", "value": {"_by": "family", "tank": "Valve and manlid seals · ISO 17712", "*": "Bolt seal · ISO 17712 class H"}, "zone": 3}, {"label": "Applied by", "value": "Shipper, at stuffing (fictional)"}, {"label": "Date / time", "value": "Day 2, 15:40"}], "points": {"1": "Owner code + serial + check digit (ISO 6346). It identifies me on every document and gate message. [TO VERIFY:v32]", "2": "Must be identical on the door, in the [[si]] and on the [[bl]]. If customs cuts it and applies its own, the new number must be recorded.", "3": "Class H high-security seal per [[iso-17712]] — the usual standard for international shipments. [TO VERIFY:v07]"}, "check": {"2": {"prompt": "Where must this seal number appear next?", "options": [{"id": "a", "correct": true, "text": "In the shipping instructions (SI), then on the B/L"}, {"id": "b", "text": "Only on the truck driver's delivery note at the gate", "fb": "The road note is not where the carrier and customs look."}, { 2, 16:20", "zone": 3, "html": true}], "points": {"1": "Method 1 weighs the packed container; Method 2 adds certified weights of all contents to the tare. Estimates are never allowed. [TO VERIFY:v02]", "2": "{vgm} kg = cargo and packaging {cargoKg} kg + tare {tare} kg. Both methods must give the same result. (Illustrative figures.)", "3": "Signed by a person duly authorised by the B/L shipper, sent before the VGM cut-off by portal, [[edi]] (VERMAS) or platform. [TO VERIFY:v17] [TO VERIFY:v16]"}, "check": {"2": {"prompt": "Which weights does the VGM include?", "options": [{"id": "a", "correct": true, "text": "Cargo, packaging, pallets, dunnage and the container's tare"}, {"id": "b", "text": "The cargo and its packaging only, as on the packing list", "fb": "That's closer to the B/L gross weight — it excludes the tare."}, {"id": "c", "text": "Cargo, packaging, pallets and dunnage, but not the tare", "fb": "The crane lifts the container too: the tare is included."}, {"id": "d", "text": "The packed container plus the truck, chassis and fuel", "fb": "The truck is weighed, then subtracted (Method 1)."}], "explain": "The VGM is the packed container as it will be lifted: everything inside plus the tare. The B/L gross weight, by contrast, excludes the tare."}, "3": {"prompt": "The shipper uses Method 2. Which practice is NOT acceptable?", "options": [{"id": "a", "correct": true, "text": "Estimating dunnage and pallet weight from last month's average shipment"}, {"id": "b", "text": "Using the tare weight marked on the container's door for the box", "fb": "Method 2 explicitly uses the marked tare."}, {"id": "c", "text": "Weighing each package type on calibrated scales and adding them up", "fb": "That is Method 2 when the procedure is certified/approved."}, {"id": "d", "text": "Using manufacturer-sealed package weights clearly marked on the packages", "fb": "Accepted under the IMO guidelines for sealed packages, depending on national rules."}], "explain": "Method 2 requires actual (certified/approved) weights of all contents, including packing and securing material; estimates are not allowed. [TO VERIFY:v02]"}}}}, "dossier": {"documents": ["**Booking confirmation** — cut-offs for VGM, SI and port.", "**[[eir|EIR]]** from empty pick-up — the box's condition before stuffing.", "**Packing list** — the shipper's own document; it feeds the SI.", "**VGM declaration** — portal, EDI VERMAS or platform. [TO VERIFY:v16]", {"text": "**DG declaration + container packing certificate** — dangerous goods only. [TO VERIFY:v25]", "when": {"family": ["tank"]}}], "costs": ["**Detention** — export clock from empty gate-out to full gate-in. [TO VERIFY:v21]", "**Waiting time** — carrier haulage beyond the free loading time. [TO VERIFY:v12]", "**VGM fees** — some carriers charge for late, amended or manual VGM. [TO VERIFY:v12]", "**Weighing and seal fees** — where applicable. [TO VERIFY:v12]"], "risks": ["**Missed VGM cut-off** → shut out, rolled to the next sailing (+7 days on a weekly service).", "**Wrong VGM** → amendment fees; overweight boxes can be refused or break road limits. [TO VERIFY:v13]", "**Seal mismatch** → customs or terminal check and delay.", "**Poor stowage** → cargo claims, which the [[slac]] clause puts on the shipper."], "jobs": ["**Customer service** — cut-off reminders, missing-VGM chasing.", "**Documentation** — VGM reception, consistency with the SI.", "**Vessel planning** — needs VGMs to build a safe stowage plan.", "**Finance / D&D** — detention and waiting-time invoicing."]}, "incoNote": {"_by": "incoterm", "EXW": "Under EXW, the goods were delivered at the seller's door: loading is at the buyer's risk unless agreed otherwise, and the buyer's forwarder owes the VGM.", "*": "The B/L shipper owes the VGM — under {incoterm}: {vgmBy}."}, "keyPoints": {"1": ["Goods are loaded ('stuffed') at the shipper's premises — the carrier doesn't see inside.", "A numbered seal proves the container hasn't been opened.", "No VGM, no loading: the total weight must reach the carrier before the deadline."], "2": ["Stuffing follows the CTU Code; the SLAC clause reflects that the carrier relies on the shipper.", "The seal number flows door → SI → B/L; mismatches trigger inspections.", "SOLAS VGM: two methods, signed, before the VGM cut-off; missing VGM = shut-out.", "The Incoterm decides who is B/L shipper — and therefore who owes the VGM."], "3": ["The VGM is a legal declaration by the shipper; the carrier must not replace it with an estimate.", "Seal changes after inspections must be documented end to end.", "Reefer, DG and OOG stuffing have their own rules: pre-cooling, filling ratios, lashing."]}, "question": {"1": {"prompt": "I'm full, closed with a numbered seal, and my total weight is known. What happens next?", "hint": "Where am I right now — and what does the carrier need before a ship can take me?", "options": [{"id": "a", "correct": true, "text": "A truck takes me to the port, and my weight is sent to the shipping line in time.", "confirm": "Right. I travel to the port terminal (that's 'pre-carriage'), and the carrier must have my VGM before the cut-off. Under {incoterm}, this trip is paid by {preBy}."}, {"id": "b", "text": "A big crane lifts me straight from the warehouse onto the ship that is waiting.", "why": "I'm still at the warehouse, far from the sea. I first have to reach the port and enter the terminal.", "realLife": "A box without a VGM, or not on the loading list, stays on the quay and waits for the next ship — usually a week later.", "whenRight": "Never straight from a warehouse."}, {"id": "c", "text": "I go directly to the customer's door, without passing through any port.", "why": "I haven't left {pol} yet! Export customs, loading, the voyage and import customs all come first.", "realLife": "Customs on both sides must clear the goods, and the carrier only releases me to the right party.", "whenRight": "That's step 10 — near the end of the journey."}]}, "2": {"prompt": "Stuffed, sealed, VGM determined (Method 1). What happens next?", "options": [{"id": "a", "correct": true, "text": "Pre-carriage to the export terminal; VGM to the carrier before the VGM cut-off, SI before the SI cut-off.", "confirm": "Correct. The full box moves to the terminal before the port cut-off, while VGM and SI meet their own cut-offs — sequence and timings vary by carrier and port. [TO VERIFY:v20]"}, {"id": "b", "text": "The carrier issues the Bill of Lading at once, now that the seal number and the weights are known.", "why": "The B/L is drafted from the SI, not yet submitted — and a 'shipped on board' B/L needs the box to be loaded.", "realLife": "An early B/L certifies something untrue: claims, L/C discrepancies, amendment fees.", "whenRight": "A 'received for shipment' B/L can follow the carrier's receipt of the goods, on the basis of the SI."}, {"id": "c", "text": "The box is loaded on the first available vessel; the VGM can follow later, together with the cargo manifest.", "why": "SOLAS: a packed container without a VGM must not be loaded. [TO VERIFY:v01]", "realLife": "Shut-out: rolled to the next sailing, extra storage and detention.", "whenRight": "Never for the VGM."}, {"id": "d", "text": "The laden box returns to the empty depot so that the carrier can check its weight and seal there.", "why": "Depots handle empty equipment. Weight and seal are the shipper's responsibility.", "realLife": "The depot refuses it: an extra trip and a possibly missed cut-off.", "whenRight": "Under carrier haulage via an inland depot named in the booking, laden boxes can be received inland — not at the empty depot."}]}, "3": {"prompt": "Case: the VGM is 3.5 t above the booking estimate; the customer asks you to use the booking weight instead. What should you do?", "options": [{"id": "a", "correct": true, "text": "Refuse: only the shipper's VGM counts. If they doubt it, they re-verify and send a corrected VGM in time.", "confirm": "Right. The VGM is the shipper's legal declaration; the carrier may not substitute an estimate. A re-weigh is possible, but a corrected VGM must still arrive before cut-off or the box is shut out. [TO VERIFY:v01] [TO VERIFY:v03]"}, {"id": "b", "text": "Enter the booking weight in the system: the customer knows the cargo and takes responsibility for it.", "why": "A booking weight is an estimate, not a verified mass.", "realLife": "Wrong weights endanger stowage and stability; the carrier becomes party to a misdeclaration.", "whenRight": "Never."}, {"id": "c", "text": "Accept the higher VGM and load the box anyway, even if it is above the legal road weight limit at destination.", "why": "Road limits concern the haulier; the issue here is which weight is valid.", "realLife": "Overweight on the road can mean fines and a stopped truck. [TO VERIFY:v13]", "whenRight": "Accepting the VGM is right; ignoring road limits is not."}, {"id": "d", "text": "Use the average of the two weights, so that the stowage plan stays within a safe margin either way.", "why": "There's no such thing as an 'average VGM'.", "realLife": "An invented weight is a misdeclaration with liability for whoever enters it.", "whenRight": "Never."}]}}}, {"id": 3, "short": "Pre-carriage", "title": "Pre-carriage to the terminal", "scene": "precarriage", "sceneDesc": "A landscape between the shipper and the export terminal: a road, possibly a bridge, a river with barges and a railway. The chosen transport carries the container to the terminal.", "beats": [{"id": "haulage", "levels": [2, 3], "ms": 1400, "narration": {"2": "[[pre-carriage|Pre-carriage]] to {polTerminal}. Who moves me — [[merchant-haulage]] or [[carrier-haulage]] — was fixed at booking.", "3": "Haulage mode drives liability, invoicing and who manages appointments and waiting time. Under carrier haulage the B/L can show an inland place of receipt. [TO VERIFY:v43]"}, "caption": {"2": "Under {incoterm}, pre-carriage is for the account of {preBy}, whatever the haulage mode."}}, {"id": "mode", "ms": 1400, "narration": {"1": {"_by": "modes", "many": "Full, sealed and weighed, I leave for the port: pick my transport mode.", "*": "Full, sealed and weighed, I'm leaving for the port — by truck, the usual way to reach {polTerminal}."}, "2": {"_by": "modes", "many": "Mode choice depends on distance, volumes, infrastructure and cut-offs. Compare the options available to reach {polTerminal}. [TO VERIFY:v39]", "*": "{polTerminal} is reached by road: trucking is the standard pre-carriage here. [TO VERIFY:v39]"}, "3": "Intermodal legs close earlier than the CY cut-off and add handlings; trucking is exposed to congestion and road weight limits. [TO VERIFY:v40]"}, "caption": {"2": {"_by": "family", "reefer": "Reefers travel with a [[genset]] on the road. [TO VERIFY:v57]", "tank": "DG on the road follows national rules (e.g. ADR in Europe). [TO VERIFY:v59]", "oog": "Oversize loads may need a road permit or escort. [TO VERIFY:v58]", "*": "Intermodal legs usually close earlier than the port cut-off. [TO VERIFY:v40]"}}}, {"id": "travel", "ms": 3200, "narration": {"1": {"_by": "mode", "barge": "A barge carries me and dozens of boxes to {polTerminal}: slower than a truck, cheaper per box.", "rail": "I ride a train towards the port, then a short truck trip reaches the terminal.", "*": "On the road, the driver carries my booking number so the terminal knows me."}, "2": {"_by": "mode", "barge": "Barge from an inland barge terminal to {polTerminal}: economies of scale, an extra handling and an earlier cut-off. [TO VERIFY:v40]", "rail": "Rail to a rail terminal, then a last-mile leg: two extra handlings, each with cost and time.", "*": "Road haulage. Road weight limits apply to the whole truck, so a box within its own rating can still be overweight on the road. [TO VERIFY:v13]"}, "3": "In transit: the haulier carries booking and container references; ETA to the terminal is monitored against the CY cut-off ({cyCutoff})."}, "caption": {"2": "Port (CY) cut-off: {cyCutoff} (illustrative). Missed = not on the load list."}}, {"id": "approach", "ms": 1200, "narration": {"1": "The terminal gate expects me — but is my paperwork ready?", "2": "At the terminal approach: [[pre-advice]] sent and, where required, a truck appointment booked. Open the transport order to see what the gate checks. [TO VERIFY:v44]", "3": "Pre-advice (EDI COPARN or portal) and appointment slot must match the truck, the box and the booking — otherwise the gate rejects or holds it. [TO VERIFY:v44]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": {"_by": "route", "SHA-LEH": "Fog closes the Donghai Bridge for hours. The driver now expects to reach Yangshan four hours after the CY cut-off.", "HCM-SIN-LEH": "Severe congestion around Cat Lai: the driver now expects to reach the gate four hours after the CY cut-off.", "*": "A road blockade on the way to Posorja: the driver now expects to reach the gate four hours after the CY cut-off."}}}], "fact": {"beat": "travel", "text": {"_by": "route", "SHA-LEH": {"1": "Shanghai, the world's busiest container port: about 50 million TEU a year. [TO VERIFY:v42]", "2": "Every truck to Yangshan crosses the Donghai Bridge, about 32.5 km long. [TO VERIFY:v41]"}, "HCM-SIN-LEH": {"1": "Around Ho Chi Minh City, many boxes travel by river barge. [TO VERIFY:v54]", "2": "Big ships can't reach river terminal Cat Lai: boxes go by feeder to a hub. [TO VERIFY:v54]"}, "*": {"1": "Ecuador is the world's largest banana exporter. [TO VERIFY:v55]", "2": "Deep-water Posorja spares big ships the Guayas river trip to Guayaquil. [TO VERIFY:v55]"}}}, "hotspots": [{"id": "haulage", "beat": "haulage", "levels": [2, 3], "essential": [2, 3], "choice": "haulage", "x": 220, "y": 112, "label": "Haulage mode", "kind": "Choice"}, {"id": "mode", "beat": "mode", "essential": [1, 2, 3], "choice": "mode", "when": {"modes": "many"}, "x": 220, "y": 168, "label": "Transport mode", "kind": "Choice"}, {"id": "cutoff", "beat": "mode", "essential": [1], "x": 560, "y": 150, "label": "Port deadline", "kind": "Rule", "body": {"1": "Whoever moves me, I must reach the terminal before the port deadline ({cyCutoff}, illustrative) — the [[cut-off]]. Late = I miss my ship.", "2": "CY cut-off {cyCutoff} (illustrative). Barge and rail legs have earlier cut-offs. [TO VERIFY:v40]"}}, {"id": "terminal", "beat": "mode", "x": 880, "y": 200, "label": "Export terminal", "kind": "Stakeholder", "body": {"1": "{polTerminal}: the port facility where I'll wait for my ship.", "2": "Receives full boxes up to the CY cut-off, stacks them for loading and reports arrivals to customs. [TO VERIFY:v45]"}}, {"id": "bridge", "beat": "travel", "when": {"route": ["SHA-LEH"]}, "x": 520, "y": 258, "label": "Sea bridge", "kind": "Infrastructure", "body": {"1": "The island terminal is linked to the mainland by a sea bridge more than 30 km long. [TO VERIFY:v41]", "2": "Donghai Bridge (about 32.5 km). Congestion or bad weather on the bridge directly threatens cut-offs. [TO VERIFY:v41]"}}, {"id": "road", "beat": "travel", "x": 330, "y": 236, "label": "Road limits", "kind": "Rule", "body": {"1": "Roads have weight limits for the whole truck. A heavy container can be legal for the ship but too heavy for the road.", "2": "Gross vehicle weight limits are national (China: GB 1589; France: 44 t for 5+ axles). Overweight → fines, truck stopped. [TO VERIFY:v13]"}}, {"id": "genset", "beat": "travel", "when": {"family": ["reefer"]}, "x": 150, "y": 250, "label": "Genset", "kind": "Equipment", "body": {"1": "On the road, a diesel generator keeps my cooling unit running.", "2": "Clip-on or underslung [[genset]] keeps the reefer powered between plug points; fuel and function checked before departure. [TO VERIFY:v57]"}}, {"id": "to", "beat": "approach", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "to", "3": "to"}, "x": 711, "y": 262, "label": "Transport order / pre-advice", "kind": "Document"}, {"id": "gatecheck", "beat": "approach", "levels": [1], "x": 711, "y": 262, "label": "Pre-advice", "kind": "Document", "body": {"1": "A message telling the terminal I'm coming: booking number, container number, ship. Without it, the gate may turn me away."}}], "docs": {"to": {"title": "Transport order & pre-advice", "heading": "TRANSPORT ORDER · PRE-ADVICE", "sub": "Fictional example", "stamp": "SENT", "rows": [{"label": "Haulier", "value": "Demo Transport Co. (fictional)"}, {"label": "Booking no.", "value": "{bookingNo}"}, {"label": "Container / seal", "value": "{containerNo} ({boxCode}) / {sealNo}", "zone": 1}, {"label": "Collect at", "value": "{origin}"}, {"label": "Deliver to", "value": "{polTerminal} · before {cyCutoff}", "zone": 2}, {"label": "VGM", "value": "{vgm} kg"}, {"label": "Special", "value": {"_by": "family", "reefer": "Genset · keep {setPoint}", "tank": "DG {cargo} · ADR/national DG rules", "oog": "Oversize · permit if required", "*": "—"}, "zone": 3}], "points": {"1": "Container, seal and booking must match the terminal's pre-advice exactly; a single digit wrong = gate rejection or hold. [TO VERIFY:v44]", "2": "The CY cut-off is the latest arrival time. Some terminals also require a truck appointment slot. [TO VERIFY:v44]", "3": "Special cargo has extra road rules: genset for reefers, DG documents and placards, permits for oversize loads. [TO VERIFY:v57] [TO VERIFY:v58] [TO VERIFY:v59]"}, "check": {"2": {"prompt": "What does the terminal gate match the truck against?", "options": [{"id": "a", "correct": true, "text": "The pre-advice: booking number, container number, seal (and appointment if required)"}, {"id": "b", "text": "The commercial invoice and packing list handed over by the driver at the gate", "fb": "Invoices are for customs and the buyer, not the gate."}, {"id": "c", "text": "The original Bill of Lading, which the driver must show before entering the terminal", "fb": "The B/L doesn't exist yet for this box, and never travels with the truck."}, {"id": "d", "text": "Only the driver's ID and truck plate; the box details are checked later in the yard", "fb": "The driver is checked, but the box must match an expected delivery."}], "explain": "Terminals accept full export boxes only when they match a pre-advised booking; mismatches mean refusal or hold. [TO VERIFY:v44]"}, "3": {"prompt": "The pre-advice shows a container number with a wrong check digit. The truck is at the gate. Most likely outcome?", "options": [{"id": "a", "correct": true, "text": "Gate rejection or hold until the forwarder corrects the pre-advice; the truck waits"}, {"id": "b", "text": "The gate clerk corrects the digit on the spot and lets the box into the export yard", "fb": "Some terminals allow manual correction, but data ownership stays with the sender; the default is hold."}, {"id": "c", "text": "The box enters normally; the container number is corrected later on the B/L draft", "fb": "Entering under wrong data breaks traceability to the booking and load list."}, {"id": "d", "text": "Customs seizes the container for suspected fraud and opens an investigation file", "fb": "A data mismatch is an operational issue, not a customs offence."}], "explain": "Check digits exist to catch typos (ISO 6346). Clean data avoids waiting time and cut-off risk. [TO VERIFY:v32] [TO VERIFY:v44]"}}}}, "dossier": {"documents": ["**Transport / haulage order** — merchant → haulier, or carrier → subcontractor.", "**Pre-advice** (e.g. EDI COPARN) and truck appointment. [TO VERIFY:v44]", "**VGM** already transmitted — some terminals check it at gate-in. [TO VERIFY:v01]", "**Barge or rail consignment note** for intermodal legs."], "costs": ["**Pre-carriage** — carrier haulage tariff or the merchant's own contract.", "**Waiting time** beyond free loading time. [TO VERIFY:v12]", "**Intermodal handling** at barge or rail terminals. [TO VERIFY:v40]", "**Export detention** until full gate-in. [TO VERIFY:v21]"], "risks": ["**Arrival after the CY cut-off** → shut out, rolled (+7 days on a weekly service).", "**Pre-advice mismatch** → refused at the gate, waiting time.", "**Road overweight** → fines, truck stopped. [TO VERIFY:v13]", {"text": "**Genset failure** on a reefer → temperature excursion before the terminal. [TO VERIFY:v57]", "when": {"family": ["reefer"]}}], "jobs": ["**Inland / intermodal operations** — haulier, barge and rail planning.", "**Procurement** — subcontractor contracts and rates.", "**Customer service** — cut-off monitoring and rollover communication.", "**D&D / finance** — waiting time and detention invoicing."]}, "incoNote": {"_by": "incoterm", "EXW": "Under EXW, the buyer organises and pays this trip — risk passed at the seller's door.", "FCA": "Under FCA (terminal), risk and cost pass when this truck arrives at the terminal, ready for unloading.", "FAS": "Under FAS, risk passes when the goods are 'alongside' — for containers, effectively at the terminal.", "CPT": "Under CPT, risk passes when the box is handed to the carrier at the terminal; the seller still pays carriage to destination.", "CIP": "Under CIP, risk passes when the box is handed to the carrier at the terminal; the seller still pays carriage and insurance.", "*": "The seller pays this trip and still carries the risk."}, "keyPoints": {"1": ["Pre-carriage brings the full container from the shipper to the export terminal, usually by truck.", "It must arrive before the port deadline (cut-off).", "The terminal must be expecting it: that's the pre-advice."], "2": ["Merchant vs carrier haulage changes who contracts, who invoices and where the carrier's responsibility starts.", "Mode choice (truck, barge, rail) drives cost, emissions and cut-off timing.", "Pre-advice and appointments are hard constraints; late = shut-out."], "3": ["Ask for a cut-off extension before the cut-off, not after — and document the answer.", "Data quality (check digits, seal numbers) prevents gate holds.", "Special cargo adds road rules: genset, DG regulations, oversize permits."]}, "question": {"1": {"prompt": "I'm almost at the port. What happens to my papers at the same time?", "hint": "Before a container can leave a country, two organisations need information about it: the carrier and customs.", "options": [{"id": "a", "correct": true, "text": "At the same time, the papers are finished: shipping instructions and a customs export form.", "confirm": "Yes! A container travels twice: physically, and as data. The carrier needs the shipping instructions for the Bill of Lading, and customs must approve the export. Under {incoterm}, export customs is handled by the {exportBy}."}, {"id": "b", "text": "The terminal lifts me onto the ship the very minute I arrive, with no papers needed at all.", "why": "The ship may not even be in port yet; the terminal first checks me in, stores me and plans where I go on board.", "realLife": "Containers usually wait a few days in the terminal yard. Without customs approval, the terminal won't load me.", "whenRight": "Some special cargo goes directly to the ship's side, by prior agreement."}, {"id": "c", "text": "Customs officers open and check every single container before it can enter the port.", "why": "Customs check data first and select only a small share for physical inspection, based on risk.", "realLife": "If I'm selected, I'm moved to an inspection area: extra cost and delay — but it's the exception.", "whenRight": "When customs selects a container after its risk check."}]}, "2": {"prompt": "Your {mode} delivery is approaching {polTerminal} before the port cut-off; VGM already transmitted. What happens next?", "options": [{"id": "a", "correct": true, "text": "In parallel: SI before the SI cut-off, export declaration by the exporter's broker, carrier's advance filings.", "confirm": "Correct. Physical and documentary flows run in parallel, each with its own cut-off. Under {incoterm}, export clearance is the {exportBy}'s job. [TO VERIFY:v45]"}, {"id": "b", "text": "The carrier lodges the export declaration itself, as part of the ocean freight, straight from the booking data.", "why": "The exporter (or its broker) is the declarant; booking data lacks HS codes, values and invoice details.", "realLife": "No declaration = no customs release = not loaded.", "whenRight": "Some carriers sell brokerage as a separate service, under the exporter's mandate."}, {"id": "c", "text": "No more data is needed: the carrier generates the draft B/L directly from the booking confirmation.", "why": "The booking has no consignee, final cargo description, package count or seal. The B/L is built from the SI.", "realLife": "Late or missing SI → late-SI fee, B/L on hold, shut-out risk. [TO VERIFY:v12]", "whenRight": "Portals can pre-fill the SI with booking data — the shipper still completes it."}, {"id": "d", "text": "Customs physically inspects every box at the gate; the terminal only receives boxes already inspected.", "why": "Customs controls are risk-based: most boxes are released electronically.", "realLife": "If selected, the box moves to an inspection area: costs and delay for the cargo side.", "whenRight": "When targeted after risk analysis, or for controlled goods. [TO VERIFY:v19]"}]}, "3": {"prompt": "Case: the truck will reach the gate four hours after the CY cut-off. What is the best course of action?", "options": [{"id": "a", "correct": true, "text": "Before the cut-off, ask the export desk for a late-gate approval; if refused, rebook and warn the customer.", "confirm": "Right. Late-gate acceptance depends on the terminal's load planning and is easier before the plan is closed; it may carry a fee. Either way, the customer hears it from you first. [TO VERIFY:v12] [TO VERIFY:v31]"}, {"id": "b", "text": "Let the truck drive on and hope the gate accepts the box, since vessels often leave a little late.", "why": "After the cut-off the box isn't on the load list; the gate may refuse or accept it only for the next vessel.", "realLife": "Storage starts, the box waits a week, and the customer finds out last.", "whenRight": "Never as a plan."}, {"id": "c", "text": "Ask the terminal to delay the vessel's departure by four hours so that the late box can still be loaded on board.", "why": "Vessels run on fixed berth windows serving many customers.", "realLife": "Not possible for one box; ships only wait for major operational reasons.", "whenRight": "Never for a single late container."}, {"id": "d", "text": "Send the box to another terminal in the same port that has a later cut-off for the same vessel.", "why": "The box is booked on a specific vessel at a specific terminal.", "realLife": "A box at the wrong terminal must be shifted: cost and almost certain shut-out.", "whenRight": "Only if the carrier rebooks it on a service calling that terminal."}]}}}, {"id": 4, "short": "Export docs", "title": "Export documentation & customs", "scene": "flow", "sceneDesc": "Four illustrated stations show the paper journey that runs alongside the container: shipping instructions, draft Bill of Lading check, export declaration and customs release. The container moves from station to station.", "flow": {"strip": "Cut-offs · SI {siCutoff} · VGM {vgmCutoff} · port {cyCutoff} (illustrative)", "stations": [{"beat": "si", "icon": "laptop", "title": "Shipping instructions", "sub": "Shipper → Carrier"}, {"beat": "draft", "icon": "bl", "title": "Draft B/L check", "sub": "Carrier → Shipper"}, {"beat": "export", "icon": "customs", "title": "Export declaration", "sub": "Broker → {exportCustoms}"}, {"beat": "release", "icon": "stamp", "title": "Customs release", "sub": "Customs → Terminal · ENS → EU"}], "incident": {"station": 3, "text": "DO NOT LOAD (ICS2)"}}, "beats": [{"id": "si", "ms": 1800, "narration": {"1": "While I travelled, the shipper sent the carrier its [[si|shipping instructions]]: parties, cargo, seal and weights.", "2": "The [[si]] arrives before the SI cut-off ({siCutoff}): shipper, consignee (or 'to order'), [[notify-party]], description, [[hs-code|HS code]], packages, weights, seal, B/L type and freight terms. [TO VERIFY:v46]", "3": "SI completeness drives everything downstream: B/L, manifest, ENS. Vague descriptions ('general cargo', 'FAK') are rejected by advance-filing regimes such as ICS2. [TO VERIFY:v23]"}, "caption": {"2": "Consignee 'to order' → [[negotiable-bl|negotiable B/L]]; named consignee, no bank → [[sea-waybill]] possible."}}, {"id": "draft", "ms": 1800, "narration": {"1": "The carrier sends a draft Bill of Lading to check now, while corrections are still free.", "2": "Documentation issues the [[draft-bl|draft B/L]]. The shipper must check it before issuance — amendments after issuance cost money. [TO VERIFY:v47]", "3": "Draft approval: if the shipper doesn't answer by the deadline, many carriers issue as drafted. One field below is inconsistent — find it. [TO VERIFY:v47]"}}, {"id": "export", "ms": 2400, "narration": {"1": "A [[customs-broker]] files an [[export-declaration]]: what the goods are, their value and where they go.", "2": "The exporter's broker lodges the [[export-declaration]] with invoice, packing list and HS codes. For sea exports, customs often matches it with the terminal's arrival data. [TO VERIFY:v45]", "3": "Declarant = exporter (or broker under mandate), who keeps most liability for the data. Under {incoterm}, export clearance: {exportBy}. [TO VERIFY:v45]"}, "caption": {"2": "Under {incoterm}, export clearance is done by the {exportBy}."}}, {"id": "release", "ms": 1800, "narration": {"1": "Customs sends its release to the terminal electronically: no release, no loading.", "2": "Risk assessment → electronic release to the terminal, or selection for inspection. The carrier files its [[manifest]] and, for the EU, the [[ens]] under [[ics2]] before loading. [TO VERIFY:v23]", "3": "ICS2: ENS at least 24 h before loading at the foreign port for deep-sea containers; house-level data may come from the NVOCC. A 'do not load' message is binding. [TO VERIFY:v23] [TO VERIFY:v48]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "ICS2 returns a 'do not load' message onger the same", "fb": "Data errors don't touch the sales contract."}], "explain": "Align descriptions and HS codes across all filings before the cut-offs. [TO VERIFY:v45] [TO VERIFY:v23]"}}}}, "dossier": {"documents": ["**SI** — portal or EDI. [TO VERIFY:v46]", "**B/L types** — negotiable 'to order', straight, sea waybill, express release, eB/L. [TO VERIFY:v49]", "**Export declaration** + customs release.", "**Manifest**, **ICS2 ENS**; certificate of origin where needed."], "costs": ["**B/L / documentation fee**, **late SI fee**, **amendment fee** after issuance. [TO VERIFY:v12]", "**ENS / advance filing fee** at some carriers. [TO VERIFY:v48]", "**Brokerage** and, if selected, **inspection handling**. [TO VERIFY:v45]"], "risks": ["**SI after the cut-off** → late fee, possible shut-out. [TO VERIFY:v12]", "**Wrong HS code or vague description** → hold, penalties, L/C discrepancy.", "**Misdeclared dangerous goods** → serious safety risk and heavy penalties. [TO VERIFY:v25]", "**Missing or wrong ENS** → 'do not load'. [TO VERIFY:v48]"], "jobs": ["**Documentation** — SI validation, drafts, B/L issuance, amendments.", "**Customs & compliance** — manifests, ICS2, sanctions screening. [TO VERIFY:v48]", "**DG desk** — dangerous goods declarations.", "**Finance / credit control** — prepaid freight before release of originals. [TO VERIFY:v33]"]}, "incoNote": {"_by": "group", "E": "Under EXW the buyer must handle export customs — a common trap: the seller holds the documents the buyer needs.", "F": "The seller clears export; the B/L comes from the carrier the buyer booked. FCA allows an agreed on-board B/L to the seller. [TO VERIFY:v14]", "C": "The seller clears export and must give the buyer the transport document (and the insurance document under CIF/CIP). [TO VERIFY:v18]", "D": "The seller clears export; import is for the buyer (DAP/DPU) or the seller (DDP)."}, "keyPoints": {"1": ["A container travels twice: physically, and as data.", "The shipping instructions become the proved, export declaration lodged, ENS filed. The box is at the gate before {cyCutoff}. What happens next?", "options": [{"id": "a", "correct": true, "text": "Gate-in: pre-advice match, number, seal and damage check (EIR), VGM status; then the export yard.", "confirm": "Correct. Gate-in is the custody handover to the terminal acting for the carrier. Export detention typically stops here. [TO VERIFY:v21]"}, {"id": "b", "text": "The carrier issues the shipped-on-board B/L now that the SI, the VGM and customs are in order.", "why": "'Shipped on board' certifies the box is loaded — it's still at the gate.", "realLife": "An early on-board B/L is a false statement: L/C fraud exposure.", "whenRight": "A 'received for shipment' B/L can be issued after receipt and annotated on board later. [TO VERIFY:v50]"}, {"id": "c", "text": "Direct delivery to the ship's side when it berths; terminals keep no export stacks for laden boxes.", "why": "Standard boxes are received into the yard before the cut-off so the stowage plan can be built.", "realLife": "Turning up at berthing time = missing the CY cut-off = shut-out.", "whenRight": "Some OOG or DG cargo by arrangement. [TO VERIFY:v51]"}, {"id": "d", "text": "The box waits outside until the customs release arrives; terminals only accept released boxes.", "why": "In many ports the release can follow gate-in: the terminal blocks loading, not entry.", "realLife": "Waiting outside costs truck time and risks the cut-off for nothing.", "whenRight": "Some ports do require an export reference before gate-in. [TO VERIFY:v52]"}]}, "3": {"prompt": "Case: ICS2 'do not load' because the ENS says 'general cargo'. Loading in 30 hours. What do you do?", "options": [{"id": "a", "correct": true, "text": "Block loading, get a precise description and HS code from the shipper, refile the ENS; else roll the box.", "confirm": "Right. 'Do not load' is binding. Precise goods descriptions are required; once refiled and cleared, the box can load — otherwise it
