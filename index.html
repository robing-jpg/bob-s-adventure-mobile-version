<!doctype html>
<!--
  Bob's Adventure — Mobile · v0.1-mobile (landscape phones), forked from robing-jpg/bob-s-adventure v0.5.
  Mobile changes: [1b] MOBILE CSS block (end of the styles) + JS lines tagged "MOBILE".
  A Container Journey — v0.3 (full journey: 11 steps × 3 levels, 7 container types, 3 routes, 11 Incoterms)
  Built from: src/engine.html + src/content/*.json  →  python3 src/build.py  →  dist/container-journey_v0.3.html

  FILE MAP (search for the markers)
    [1] STYLES   — colours come from CSS variables set from CONFIG.
    [2] CONFIG   — branding (company, logo text, colours) and the illustrative tariff. Edit here to rebrand.
    [3] CONTENT  — JSON injected by the build (global.json + step01…step11.json). Never edit in dist: edit the JSON files.
                   Mini-syntax in texts:
                     [[termId]] / [[termId|shown text]]   glossary term (hover/tap)
                     [TO VERIFY:v01]                      verification flag (see the Verification list)
                     **bold**
                     {pol} {pod} {cargo} {box} {incoterm} {vgmBy} … filled from the learner's choices (see vars())
                   Level texts:  {"1": "...", "2": "...", "3": "..."}  (L3 falls back to L2, then L1)
                   Choice texts: {"_by": "family" | "route" | "incoterm" | "container" | "transship" | "freight" | "mode" | …,
                                  "<value>": "...", "*": "default"}
                   Filters on beats, hotspots, rows: "levels": [2,3] · "when": {"family": ["reefer"], "transship": true}
    [4] ENGINE   — state, menu, journey (scenes, hotspots, gating, sheets, documents, questions), quiz, summary.
    [5] SCENES   — SVG scene builders (style B). Scene elements react to beats with data attributes:
                     data-at="beatId"            visible from that beat (data-until="beatId": last beat where visible)
                     data-tx="beat:x,y@delay~dur;…"  position per beat ("start" = initial, "depart" = after the question)
                     data-along="beat:fraction;…" data-path="pathId"   moves along an SVG path
                     data-ch="mode:truck|barge"   visible only for that learner choice
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bob's Adventure — Mobile</title>
<style>
/* ===================== [1] STYLES ===================== */
:root{
  --c-primary:#0B4F6C; --c-primary-dark:#083A50; --c-primary-soft:#E3EEF3;
  --c-box:#E07A24; --c-box-dark:#9A4E12;
  --c-text:#1B2631; --c-muted:#4F5B66; --c-line:#D3DAE1; --c-bg:#F2F5F8;
  --c-ok:#1D7048; --c-ok-bg:#E3F4EA; --c-err:#9E2F1C; --c-err-bg:#FCEDE9; --c-warn:#B85A12; --c-warn-bg:#FFF2E6;
  --c-star:#F2B705; --c-verify:#7A5A00; --c-verify-bg:#FFF4CC;
  --c-seller:#0B4F6C; --c-buyer:#6B4396;
  --c-sky-top:#5EA9DA; --c-sky-bottom:#DCEFF8;
  --glass:rgba(255,255,255,.9);
  --top:44px; --bar:56px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:17px/1.45 var(--font);color:var(--c-text);background:#0E2230;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--c-text);outline-offset:2px;box-shadow:0 0 0 6px #F5C84C}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{line-height:1.25}

/* ---------- Full-page screens (menu, quiz, summary) ---------- */
.screen{position:fixed;inset:0;overflow:auto;background:linear-gradient(180deg,#DDEEF8 0,#F2F5F8 340px);z-index:2}
.wrap{max-width:1180px;margin:0 auto;padding:22px 24px 60px}
.brandbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{display:inline-grid;place-items:center;height:30px;min-width:30px;padding:0 7px;border:2px solid currentColor;border-radius:8px;font-size:.78rem;font-weight:800}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:center;margin-bottom:10px}
.hero h1{font-size:2rem;margin:.1em 0 .3em}
.hero p{margin:0 0 .6em;color:var(--c-muted)}
.grp{background:#fff;border:1px solid var(--c-line);border-radius:18px;padding:16px 18px;margin:14px 0;box-shadow:0 6px 20px rgba(15,35,55,.06)}
.grp legend,.grp h2{font-weight:800;font-size:1.08rem;margin:0 0 10px;padding:0}
fieldset.grp{min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.cards.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.cardopt{position:relative}
.cardopt input{position:absolute;opacity:0;inset:0;pointer-events:none}
.cardopt label{display:flex;flex-direction:column;gap:3px;height:100%;border:2px solid var(--c-line);border-radius:14px;padding:11px 12px;background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.cardopt label:hover{border-color:var(--c-primary)}
.cardopt input:checked+label{border-color:var(--c-primary);box-shadow:0 0 0 2px var(--c-primary) inset;background:#F4F9FC}
.cardopt input:checked+label .t::before{content:"✓ ";color:var(--c-primary)}
.cardopt input:focus-visible+label{outline:3px solid var(--c-text);outline-offset:2px}
.cardopt .t{font-weight:800}
.cardopt .d{font-size:.86rem;color:var(--c-muted)}
.cardopt .m{font-size:.76rem;font-weight:700;color:var(--c-primary)}
.cardopt .mini-svg{height:44px;margin-bottom:4px}
.note{border-left:5px solid var(--c-warn);background:var(--c-warn-bg);padding:9px 12px;border-radius:10px;font-size:.92rem;margin-top:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.linkbtn{border:0;background:none;padding:0;color:var(--c-primary);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:32px}

/* ---------- App frame ---------- */
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:var(--top) 1fr var(--bar)}
.top{display:flex;align-items:center;gap:8px;padding:0 10px 0 2px;background:linear-gradient(180deg,var(--c-primary),var(--c-primary-dark));color:#fff;position:relative;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.iconbtn{min-width:44px;height:44px;border:0;background:transparent;color:inherit;font-size:1.2rem;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.iconbtn:hover{background:rgba(255,255,255,.14)}
.iconbtn small{font-size:.78rem;font-weight:700}
.lvl{font-size:.75rem;font-weight:800;border:1.5px solid rgba(255,255,255,.7);border-radius:999px;padding:2px 9px;white-space:nowrap}
.jline{flex:1;position:relative;height:44px;margin:0 16px;min-width:140px}
.jline ol{list-style:none;margin:0;padding:0;position:absolute;left:0;right:0;top:50%;height:0}
.jline ol::before{content:"";position:absolute;left:0;right:0;top:-1.5px;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.jline li{position:absolute;transform:translate(-50%,-50%);top:0}
.jdot{width:16px;height:16px;border-radius:50%;background:var(--c-primary-dark);border:2px solid rgba(255,255,255,.6);display:grid;place-items:center;font-size:9px;font-weight:800;padding:0;color:#fff}
button.jdot{cursor:pointer}
.jdot.cur{width:22px;height:22px;background:#fff;color:var(--c-primary);border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.jdot.done{background:var(--c-ok);border-color:#fff;width:18px;height:18px;font-size:11px}
.jdot.lock{opacity:.7;cursor:default}
.jbox{position:absolute;top:2px;width:22px;height:12px;border-radius:2px;background:linear-gradient(var(--c-box),var(--c-box-dark));transform:translateX(-50%);transition:left 1.4s cubic-bezier(.5,0,.3,1);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.mk{position:absolute;bottom:0;transform:translateX(-50%);font-size:9px;line-height:1;opacity:.95}
.stepno{font-size:.85rem;font-weight:700;white-space:nowrap}
.chip{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:.85rem;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.24)}

/* ---------- Scene ---------- */
.scene{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--c-sky-top) 0%,var(--c-sky-bottom) 72%)}
.scene.map{background:linear-gradient(180deg,#9FD0EA,#CFE7F3)}
.sun{position:absolute;right:7%;top:8%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#FFF6CF 0 38%,rgba(255,240,180,.55) 52%,rgba(255,240,180,0) 70%)}
.scene.map .sun,.scene.map #clouds{display:none}
.cloud{position:absolute;height:28px;border-radius:30px;background:#fff;opacity:.85;filter:drop-shadow(0 4px 6px rgba(40,90,130,.15));animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:44%;height:180%;left:16%;top:-90%}
.cloud::after{width:30%;height:140%;left:52%;top:-60%}
@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}
#scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#scene [data-at],#scene [data-ch]{transition:opacity .5s}
#scene .off{opacity:0!important;pointer-events:none}
#scene [data-tx]{transition-property:transform;transition-timing-function:cubic-bezier(.35,.1,.25,1)}
#scene .wheel{transform-box:fill-box;transform-origin:center}
#scene.moving .rig .wheel{animation:spin .55s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#scene .waves{animation:waves 6s linear infinite}
@keyframes waves{from{transform:translateX(0)}to{transform:translateX(-90px)}}
#scene .bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#scene .hook{transform-box:fill-box;transform-origin:50% 0;animation:swing 5s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
#scene .blink{animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
#scene .bush{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:skewX(-2deg)}to{transform:skewX(2deg)}}
#scene .fan{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
#scene .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.012)}}
#scene .eye{transform-box:fill-box;transform-origin:center;animation:eyeblink 4.5s infinite}
@keyframes eyeblink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#scene .face{transform-box:fill-box;transform-origin:center}
#scene .m-happy,#scene .m-puzzled,#scene .brow{opacity:0;transition:opacity .25s}
#scene.face-happy .m-idle,#scene.face-puzzled .m-idle{opacity:0}
#scene.face-happy .m-happy{opacity:1}
#scene.face-puzzled .m-puzzled,#scene.face-puzzled .brow{opacity:1}
#scene.face-puzzled .face{animation:tilt .5s ease-in-out}
@keyframes tilt{30%{transform:rotate(-4deg)}70%{transform:rotate(3deg)}}
#scene .wall{transition:opacity .8s}
#scene.instant,#scene.instant *{transition:none!important}

/* ---------- Hotspots ---------- */
#hs{position:absolute;inset:0;pointer-events:none;transition:opacity .3s}
#hs.wait{opacity:0}
#hs.wait .hs{pointer-events:none}
.hs{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;gap:6px;min-height:34px;padding:3px 12px 3px 4px;border-radius:999px;border:1.5px solid rgba(27,38,49,.55);background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:.8rem;font-weight:700;white-space:nowrap;box-shadow:0 4px 14px rgba(15,35,55,.25)}
.hs:hover{background:#fff}
.hs .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c-primary);color:#fff;font-size:.8rem;font-family:Georgia,serif;font-style:italic;flex:0 0 26px}
.hs.ess{border:2px solid var(--c-text)}
.hs.ess .ic{background:var(--c-star);color:var(--c-text);font-style:normal;font-family:inherit}
.hs.ess:not(.seen)::after{content:"";position:absolute;inset:-5px;border-radius:999px;border:3px solid var(--c-star);animation:pulse 1.8s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
.hs.seen .ic{background:var(--c-ok);color:#fff;font-style:normal;font-family:inherit}
.hs .badge{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--c-star);color:var(--c-text);border-radius:999px;padding:1px 7px}
.hs.seen .badge{background:var(--c-ok-bg);color:var(--c-ok)}

/* ---------- Narration bubble & fact ---------- */
.narr{position:absolute;left:12px;bottom:12px;max-width:min(500px,62%);display:flex;gap:10px;align-items:flex-start;padding:10px 12px 10px 10px;border-radius:18px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(15,35,55,.3);border:1px solid rgba(255,255,255,.7)}
.narr.incident{border:2px solid var(--c-warn);background:#FFF8F1}
.narr .av{flex:0 0 46px}
.narr p{margin:0}
.narr .who{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c-muted)}
.narr.incident .who{color:var(--c-warn)}
.narr .cap{font-size:.83rem;color:var(--c-muted);margin-top:4px;border-top:1px dashed var(--c-line);padding-top:4px}
.narr .tools{display:flex;flex-direction:column;gap:2px;margin:-4px -4px 0 0}
.narr .mini{border:0;background:transparent;min-width:36px;height:36px;border-radius:10px;font-weight:800;color:var(--c-muted)}
.narr .more{display:none;border:0;background:none;padding:0;color:var(--c-primary);font-weight:700;font-size:.85rem}
.narr.min .txt,.narr.min .more{display:none!important}
.narr.min{padding:6px}
.narr.fresh{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92) translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.fact{position:absolute;left:12px;top:12px;max-width:min(360px,46%);display:flex;gap:10px;align-items:flex-start;padding:10px 8px 10px 12px;border-radius:16px;background:linear-gradient(135deg,#FFF8DC,#FFEFB0);border:1.5px solid #D9B23A;box-shadow:0 8px 24px rgba(90,70,0,.25);font-size:.87rem;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.fact b{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:#7A5A00}
.fact.min{padding:0;border-radius:50%;width:44px;height:44px;justify-content:center;align-items:center;cursor:pointer}
.fact.min .ftxt,.fact.min .mini{display:none}
.fact .mini{border:0;background:none;min-width:32px;height:32px;font-weight:800;color:#7A5A00;border-radius:8px}

/* ---------- Bottom action bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:0 10px;background:#fff;border-top:1px solid var(--c-line);box-shadow:0 -4px 16px rgba(0,0,0,.12);z-index:5}
.pill{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--c-primary);background:#fff;color:var(--c-primary);font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill.primary{background:linear-gradient(180deg,#126B91,var(--c-primary));color:#fff;border-color:var(--c-primary);box-shadow:0 4px 12px rgba(11,79,108,.35)}
.pill.primary.go{background:linear-gradient(180deg,#2A9363,var(--c-ok));border-color:var(--c-ok)}
.pill.big{min-height:52px;padding:0 26px;font-size:1.05rem}
.pill[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.pill:not([disabled]):hover{filter:brightness(1.08)}
.pill.round{width:44px;padding:0}
.dots{display:flex;gap:6px;align-items:center}
.dots span{width:10px;height:10px;border-radius:50%;border:2px solid var(--c-primary)}
.dots span.on{background:var(--c-primary)}
.ess-count{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;padding:6px 12px;border-radius:999px;background:#FFF6D6;border:1.5px solid #D9B23A;white-space:nowrap}
.ess-count.ok{background:var(--c-ok-bg);border-color:var(--c-ok);color:var(--c-ok)}
.grow{flex:1}
.cta-wrap{position:relative}
.cta-wrap .tip{position:absolute;right:0;bottom:calc(100% + 8px);background:var(--c-text);color:#fff;font-size:.8rem;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.cta-wrap:hover .tip,.cta-wrap:focus-within .tip{opacity:1}

/* ---------- Bottom sheet ---------- */
.backdrop{position:fixed;inset:var(--top) 0 0 0;background:rgba(10,25,35,.38);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.backdrop.open{opacity:1;pointer-events:auto}
.backdrop.full{inset:0}
.sheet{position:fixed;left:50%;bottom:0;width:min(800px,100%);max-height:calc(100% - var(--top) - 8px);overflow:auto;transform:translate(-50%,105%);transition:transform .38s cubic-bezier(.2,.9,.3,1);background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.3);z-index:21;padding:0 22px 20px}
.sheet.wide{width:min(1060px,100%)}
.sheet.open{transform:translate(-50%,0)}
.sheet.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(calc(-50% - 8px),0)}40%{transform:translate(calc(-50% + 7px),0)}60%{transform:translate(calc(-50% - 4px),0)}80%{transform:translate(calc(-50% + 2px),0)}}
.sh-head{position:sticky;top:0;background:#fff;padding:10px 0 8px;display:flex;align-items:center;gap:10px;z-index:1}
.sh-head::before{content:"";position:absolute;left:50%;top:6px;width:44px;height:5px;border-radius:3px;background:var(--c-line);transform:translateX(-50%)}
.sh-head h2{flex:1;margin:10px 0 0;font-size:1.2rem}
.kicker{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c-primary);background:var(--c-primary-soft);border-radius:999px;padding:2px 9px;margin-top:10px}
.x{border:0;background:#EEF2F5;width:40px;height:40px;border-radius:50%;font-size:1.4rem;line-height:1;margin-top:8px;flex:0 0 40px}
.sheet p{margin:0 0 .7em}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--c-line);background:#fff;border-radius:14px;padding:10px 12px;min-height:44px;width:100%}
.opt:hover:not([disabled]){border-color:var(--c-primary);background:#F6FAFC}
.opt .L{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c-primary-soft);color:var(--c-primary);font-weight:800}
.opt.ruled{color:var(--c-muted);background:#F5F6F7;text-decoration:line-through;cursor:not-allowed}
.opt.right{border-color:var(--c-ok);background:var(--c-ok-bg);color:var(--c-text)}
.opt.right .L{background:var(--c-ok);color:#fff}
.opt.picked{border-color:var(--c-primary)}
.opt .st{margin-left:auto;font-size:.78rem;font-weight:800;white-space:nowrap;padding-left:8px;text-decoration:none}
.fb{border-radius:14px;padding:12px 14px;margin-top:8px}
.fb h3{margin:0 0 6px;font-size:1.02rem}
.fb.wrong{background:#FFF5EC;border-left:6px solid #C46A1C}
.fb.right{background:var(--c-ok-bg);border-left:6px solid var(--c-ok)}
.fb .k{font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hint{background:#FFF8E1;border-left:5px solid #B98500;padding:8px 12px;border-radius:8px;font-size:.92rem}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--c-line);margin:4px 0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--c-muted);border-bottom:3px solid transparent;margin-bottom:-2px;min-height:44px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--c-primary);border-color:var(--c-primary)}
.sheet ul,.sheet ol{margin:0;padding-left:1.2em}
.sheet li{margin-bottom:8px}
.sum{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:8px 0;font-weight:700}
.sum span{padding:8px 10px;border-radius:10px;background:var(--c-primary-soft)}
.sum span.op{background:none;padding:8px 0}
.sum span.tot{background:var(--c-ok-bg);color:var(--c-ok)}
.scores{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.scores div{flex:1;min-width:150px;border:1.5px solid var(--c-line);border-radius:14px;padding:8px 12px;background:#fff}
.scores strong{display:block;font-size:1.3rem;color:var(--c-primary)}
.menu-list{display:grid;gap:8px}
.menu-list button{text-align:left;min-height:48px;border:1.5px solid var(--c-line);background:#fff;border-radius:14px;padding:8px 14px;font-weight:700}
.menu-list button small{display:block;font-weight:400;color:var(--c-muted)}
dl.gl dt{font-weight:800;margin-top:10px}
dl.gl dd{margin:2px 0 0}
.chcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:6px 0}
.chcard{text-align:left;border:2px solid var(--c-line);background:#fff;border-radius:14px;padding:10px 12px;min-height:44px}
.chcard:hover{border-color:var(--c-primary)}
.chcard[aria-pressed="true"]{border-color:var(--c-primary);box-shadow:inset 0 0 0 1px var(--c-primary);background:var(--c-primary-soft)}
.chcard .t{font-weight:800;display:block}
.chcard[aria-pressed="true"] .t::before{content:"✓ "}
.chcard .d{display:block;font-size:.84rem;color:var(--c-muted)}
.chdetail{margin-top:10px;background:var(--c-primary-soft);border-left:5px solid var(--c-primary);border-radius:8px;padding:10px 12px}
table.it{width:100%;border-collapse:collapse;font-size:.86rem}
table.it th,table.it td{border-bottom:1px solid var(--c-line);padding:6px 6px;text-align:left;vertical-align:top}
table.it th{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--c-muted)}
table.it tr.cur td{background:#F1F7FB;font-weight:700}
table.it td.c{text-align:center;white-space:nowrap}

/* ---------- Glossary terms, verify chips, popover, toast ---------- */
.term{border:0;background:none;padding:0;font-weight:700;color:var(--c-primary);text-decoration:underline dotted 2px;text-underline-offset:3px;cursor:help;font-size:inherit}
.vchip{border:1px solid var(--c-verify);background:var(--c-verify-bg);color:var(--c-verify);font-size:.6rem;font-weight:800;border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:1px;line-height:1.5}
.hide-verify .vchip{display:none}
.pop{position:fixed;z-index:60;width:min(340px,92vw);background:#fff;border:2px solid var(--c-text);border-radius:14px;padding:10px 14px;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;max-height:80vh;overflow:auto}
.pop.open{display:block}
.pop h4{margin:0 0 4px}
.pop p{margin:0 0 6px}
.band{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;margin:8px 0 4px}
.band span{height:24px;border-radius:4px;font-size:.66rem;font-weight:800;color:#fff;display:grid;place-items:center;position:relative}
.band .s{background:var(--c-seller)}
.band .b{background:repeating-linear-gradient(135deg,var(--c-buyer) 0 6px,#5A3780 6px 12px)}
.band .now{outline:3px solid var(--c-star);outline-offset:1px}
.legend{font-size:.78rem;color:var(--c-muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 12px);transform:translateX(-50%);background:var(--c-text);color:#fff;padding:9px 16px;border-radius:12px;z-index:70;display:none;font-size:.9rem;max-width:90vw}
.toast.open{display:block;animation:pop .3s}

/* ---------- Document viewer ---------- */
.docv{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 30%,#2B4A5E,#0E2230);display:none;flex-direction:column}
.docv.open{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dv-head{display:flex;align-items:center;gap:10px;padding:6px 12px;color:#fff;flex:0 0 auto}
.dv-head h2{flex:1;margin:0;font-size:1.05rem}
.dv-head .x{margin:0;background:rgba(255,255,255,.15);color:#fff}
.dv-instr{font-size:.85rem;opacity:.85}
.dv-body{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,640px) minmax(220px,320px);gap:18px;justify-content:center;align-items:start;padding:6px 16px 16px}
.paper{position:relative;background:linear-gradient(180deg,#FFFEF8,#F7F3E6);border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.45);padding:22px 40px 22px 24px;font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:.86rem;animation:paperIn .45s cubic-bezier(.2,1,.3,1)}
@keyframes paperIn{from{transform:translateY(30px) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
.paper .ph{font-family:var(--font);display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px double var(--c-text);padding-bottom:8px;margin-bottom:10px;gap:10px}
.paper .ph strong{font-size:1.02rem;letter-spacing:.06em}
.paper .ph small{display:block;color:var(--c-muted)}
.paper .stamp{font-family:var(--font);font-size:.66rem;font-weight:800;color:#9E2F1C;border:2px solid #9E2F1C;border-radius:4px;padding:2px 6px;transform:rotate(4deg);white-space:nowrap}
.frow{position:relative;display:grid;grid-template-columns:160px 1fr;gap:10px;padding:7px 6px;border-bottom:1px solid #E2DCC8;transition:opacity .25s,background .25s,box-shadow .25s;border-radius:4px;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;background:none;font:inherit}
button.frow{cursor:pointer}
button.frow:hover{background:#EEF5F9}
.frow .fl{font-family:var(--font);font-size:.72rem;font-weight:800;text-transform:uppercase;color:var(--c-muted);letter-spacing:.04em;padding-top:2px}
.frow .fs{font-family:var(--font);font-size:.72rem;font-weight:800;margin-left:6px}
.frow.ok .fs{color:var(--c-ok)}
.frow.bad{background:var(--c-err-bg);box-shadow:0 0 0 2px var(--c-err)}
.frow.bad .fs{color:var(--c-err)}
.paper.focus .frow{opacity:.32}
.paper.focus .frow.on{opacity:1;background:#E8F2F8;box-shadow:0 0 0 3px var(--c-primary)}
.pt{position:absolute;right:-34px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:2px solid var(--c-text);background:var(--c-star);font-weight:900;font-family:var(--font);font-size:.95rem;display:grid;place-items:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pt.done{background:var(--c-ok);color:#fff;border-color:var(--c-ok)}
.pt.on{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.sig{font-family:"Segoe Script","Brush Script MT",cursive;font-size:1.1rem}
.explain{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 12px 30px rgba(0,0,0,.35);font-size:.92rem;position:sticky;top:0}
.explain h3{margin:0 0 6px;font-size:1rem;display:flex;gap:8px;align-items:center}
.explain .n{width:26px;height:26px;border-radius:50%;background:var(--c-primary);color:#fff;display:grid;place-items:center;font-size:.85rem;flex:0 0 26px}
.explain p{margin:0}
.dv-check{flex:0 0 auto;background:#fff;border-top:4px solid var(--c-star);padding:10px 16px 12px;box-shadow:0 -10px 30px rgba(0,0,0,.3);max-height:48vh;overflow:auto}
.dv-check .q{font-weight:800;margin:0 0 6px}
.dv-check .opts{grid-template-columns:1fr 1fr;margin:0}
.dv-check .opt{padding:7px 10px;font-size:.9rem}
.dv-check .fbline{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;font-size:.9rem}
.dv-check .fbline p{margin:0}

/* ---------- Quiz & summary ---------- */
.qcard{background:#fff;border:1px solid var(--c-line);border-radius:20px;padding:20px 22px;box-shadow:0 10px 30px rgba(15,35,55,.08);max-width:820px;margin:0 auto}
.qprog{height:8px;border-radius:4px;background:var(--c-line);overflow:hidden;margin:6px 0 14px}
.qprog span{display:block;height:100%;background:var(--c-primary)}
.big{font-size:2.6rem;font-weight:800;color:var(--c-primary);line-height:1}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
details.kp{background:#fff;border:1px solid var(--c-line);border-radius:12px;margin-bottom:6px}
details.kp summary{padding:9px 12px;font-weight:700;cursor:pointer}
details.kp ul{margin:0 0 10px;padding-left:2em}

/* ---------- Intro: Bob introduces himself ---------- */
.intro{background:linear-gradient(180deg,var(--c-sky-top) 0%,var(--c-sky-bottom) 70%);overflow:hidden}
.intro .introbg{position:absolute;inset:0;width:100%;height:100%}
.intro .skip{position:absolute;top:14px;right:16px;z-index:3;background:rgba(255,255,255,.85);border:1.5px solid var(--c-line);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--c-primary);min-height:40px}
.intro .brandtop{position:absolute;top:14px;left:16px;z-index:3;display:flex;align-items:center;gap:10px;color:var(--c-primary-dark);font-weight:800}
.intro .stage2{position:relative;z-index:2;min-height:100%;display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1.1fr);align-items:center;gap:20px;max-width:1180px;margin:0 auto;padding:70px 28px 40px}
.intro h1{font-size:clamp(2rem,4.4vw,3.4rem);margin:0;color:var(--c-primary-dark);line-height:1.05;letter-spacing:-.01em}
.intro .sub{font-weight:700;color:var(--c-primary);margin:.3em 0 1em;font-size:1.05rem}
#bob{width:100%;max-width:470px;justify-self:center;overflow:visible;animation:bobDrop 1.1s cubic-bezier(.3,1.5,.5,1) both}
@keyframes bobDrop{0%{transform:translateY(-120%) rotate(-8deg)}60%{transform:translateY(4%) scaleY(.92)}100%{transform:none}}
#bob .bob-body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
#bob .bob-arm{transform-box:fill-box;transform-origin:10% 90%;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
#bob .eye{transform-box:fill-box;transform-origin:center;animation:eyeblink 4s infinite}
#bob .m{opacity:0;transition:opacity .2s}
#bob.mood-smile .m-smile,#bob.mood-grin .m-grin,#bob.mood-puzzled .m-puzzled,#bob.mood-wink .m-grin,#bob.mood-proud .m-smile{opacity:1}
#bob .brow-p,#bob .wink{opacity:0}
#bob.mood-puzzled .brow-p{opacity:1}
#bob.mood-wink .wink{opacity:1}#bob.mood-wink .eye-r{opacity:0}
#bob.mood-puzzled .bob-face{animation:tilt .6s ease-in-out}
#bob.mood-proud .bob-body{animation:proud .9s ease-in-out}
@keyframes proud{40%{transform:translateY(-14px) scaleY(1.04)}}
.speech{position:relative;background:#fff;border-radius:22px;padding:20px 22px 16px;box-shadow:0 14px 40px rgba(15,35,55,.22);border:2px solid #fff;min-height:170px}
.speech::before{content:"";position:absolute;left:-14px;top:46px;border:14px solid transparent;border-right-color:#fff;border-left:0}
.speech .who{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c-box-dark)}
.speech .line{font-size:1.25rem;line-height:1.45;margin:.3em 0 .6em;min-height:3.2em}
.speech .row{justify-content:space-between;align-items:center}
.ipdots{display:flex;gap:6px}.ipdots span{width:10px;height:10px;border-radius:50%;border:2px solid var(--c-primary)}.ipdots span.on{background:var(--c-primary)}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.facts span{background:rgba(255,255,255,.8);border:1.5px solid var(--c-line);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700;color:var(--c-primary-dark)}
.intro .waves-i{animation:waves 6s linear infinite}
.gull{position:absolute;z-index:1;top:16%;left:-60px;width:46px;animation:gull 18s linear infinite}
@keyframes gull{to{transform:translateX(115vw) translateY(-40px)}}
.gull path{animation:flap .5s ease-in-out infinite alternate;transform-origin:center}
@keyframes flap{to{transform:scaleY(.4)}}
@media (max-width:820px){.intro .stage2{grid-template-columns:1fr;padding-top:64px}.speech::before{display:none}#bob{max-width:300px}}
@media (max-height:420px){.intro .stage2{grid-template-columns:.8fr 1.2fr;padding:54px 16px 10px;gap:10px}.intro h1{font-size:1.6rem}.intro .sub{margin:.1em 0 .4em;font-size:.9rem}.speech{padding:12px 14px;min-height:0}.speech .line{font-size:1rem;min-height:0}.facts{display:none}#bob{max-width:250px}}

/* ---------- Confetti & rotate prompt ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
#confetti i{position:absolute;width:9px;height:14px;border-radius:2px;animation:conf 1.3s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.tick{position:fixed;z-index:81;left:50%;top:40%;width:84px;height:84px;margin:-42px;border-radius:50%;background:var(--c-ok);color:#fff;font-size:3rem;display:grid;place-items:center;animation:tick 1.1s forwards;pointer-events:none}
@keyframes tick{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.1);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.rotate{display:none;position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,var(--c-primary),var(--c-primary-dark));color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px}
.rotate .ph{width:70px;height:110px;border:4px solid #fff;border-radius:14px;animation:turn 2.2s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

/* ---------- Responsive ---------- */
.short{display:none}
@media (max-width:1000px){ .hero{grid-template-columns:1fr} .hero .heroart{display:none} .sgrid{grid-template-columns:1fr} }
@media (max-width:900px){ .ttl{display:none} .jline{margin:0 8px} }
@media (max-width:760px){
  body{font-size:15px}
  .long{display:none}.short{display:inline}
  .pill{padding:0 13px}
  .chip{padding:0 8px}
  .lvl{display:none}
  .ess-count{padding:5px 9px;font-size:.82rem}
  .dots{display:none}
  .dv-body{grid-template-columns:1fr}
  .explain{position:static}
  .jline .mk{display:none}
}
@media (max-height:420px){
  :root{--bar:52px}
  .narr{max-width:min(470px,70%);padding:6px 8px;bottom:6px;left:6px}
  .narr .av{flex-basis:32px}.narr .av svg{width:32px}
  .narr .who,.narr .cap{display:none}
  .narr:not(.expanded) .txt{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .narr .more{display:inline}
  .narr.expanded .cap,.narr.expanded .who{display:block}
  .hs{min-height:30px;font-size:.72rem;padding:2px 9px 2px 3px}
  .hs .ic{width:22px;height:22px;flex-basis:22px}
  .hs .badge{display:none}
  .fact{left:6px;top:6px;font-size:.78rem;max-width:52%}
  .sh-head h2{font-size:1.05rem}
  .sheet{padding:0 14px 12px}
  .paper{padding:14px 36px 14px 14px;font-size:.8rem}
  .frow{grid-template-columns:118px 1fr;padding:5px 4px}
  .dv-body{grid-template-columns:minmax(0,1fr) 230px;gap:10px;padding:4px 10px 10px}
  .dv-check{padding:6px 10px 8px}
  .dv-check .q{font-size:.88rem;margin-bottom:4px}
  .dv-check .opts{gap:5px}
  .dv-check .opt{padding:3px 8px;font-size:.76rem;min-height:34px;border-radius:10px;line-height:1.25}
  .dv-check .opt .L{display:none}
  .dv-head{padding:2px 10px}.dv-head .x{width:36px;height:36px}
  .explain{position:sticky;top:0;font-size:.82rem;padding:10px 12px}
  .dv-instr{display:none}
}
@media (orientation:portrait) and (max-width:700px){ .rotate{display:flex} }

/* ---------- v0.5: answer buttons — same size for every option (no visual clue to the right answer) ---------- */
.opts{grid-auto-rows:1fr}
.opt{height:100%;align-items:center}
@media (max-width:760px),(max-height:420px){
  .opts{grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px}
  .opt{font-size:.8rem;line-height:1.25;padding:6px 8px;min-height:44px}
  .opt .L{flex-basis:22px;height:22px;font-size:.75rem}
  .opt .st{font-size:.68rem;padding-left:4px}
}

/* ---------- v0.5: cost & CO2 meter (two discreet pills in the top bar) ---------- */
.meter{gap:4px;padding:0 4px;height:32px;background:transparent;border:0}
.meter .pl{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
.meter .pl.bump{animation:pop .5s}
table.fp{width:100%;border-collapse:collapse;font-size:.86rem}
table.fp th,table.fp td{padding:5px 6px;border-bottom:1px solid var(--c-line);text-align:left;vertical-align:top}
table.fp td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.fp tr.later{color:var(--c-muted);opacity:.65}
table.fp tfoot td{font-weight:800;border-bottom:0}
.payer{display:inline-block;font-size:.7rem;font-weight:800;border-radius:999px;padding:1px 7px;color:#fff;white-space:nowrap}
.payer.seller{background:var(--c-seller)}.payer.buyer{background:var(--c-buyer)}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0 4px}
.split span{display:block;height:100%}
@media (max-width:760px){ .meter .pl{padding:0 6px;font-size:.7rem} }

/* ---------- v0.5: nickname + definition + results ---------- */
.nick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nick input{font:inherit;padding:10px 12px;border:2px solid var(--c-line);border-radius:12px;min-width:220px}
.nick input:focus-visible{outline:3px solid var(--c-text);outline-offset:2px}
.privacy{font-size:.82rem;color:var(--c-muted);margin:8px 0 0}
.incodef{border-left:5px solid var(--c-primary);background:var(--c-primary-soft);padding:9px 12px;border-radius:10px;font-size:.92rem;margin:0 0 10px}
.fixedinco{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fixedinco .badge{font-weight:900;font-size:1.4rem;color:#fff;background:var(--c-primary);border-radius:14px;padding:8px 14px}
.review li{margin:4px 0}
.review .tag{font-size:.7rem;font-weight:800;color:var(--c-muted);text-transform:uppercase;letter-spacing:.05em;margin-right:6px}

/* ---------- v0.5: risk / cost transfer animation (full screen, original visuals) ---------- */
.xfer{position:fixed;inset:0;z-index:90;display:none;place-items:center;overflow:hidden;color:#fff;background:radial-gradient(circle at 50% 42%,#1E4A66 0%,#0B1824 72%)}
.xfer.open{display:grid}
.xfer .burst{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.06) 0 7deg,transparent 7deg 14deg);animation:xfSpin 18s linear infinite}
.xfer .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:xfFlash 1s ease-out both}
.xfer .flash.f2{animation-delay:2.75s}
.xf-box{position:relative;width:min(900px,94vw);text-align:center;padding:10px}
.xf-kicker{display:inline-block;font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:4px 12px}
.xf-track{position:relative;height:clamp(150px,30vh,220px);margin:8px 0}
.xf-party{position:absolute;top:50%;transform:translateY(-50%);width:150px;display:grid;justify-items:center;gap:4px;font-weight:900;letter-spacing:.1em;font-size:.9rem}
.xf-party svg{width:clamp(70px,14vh,110px);height:auto}
.xf-party.seller{left:0;color:#A8DAF0}.xf-party.buyer{right:0;color:#E0CCF7}
.xf-party.buyer svg{animation:xfLand .7s ease 2.8s both}
.xf-arrow{position:absolute;left:160px;right:160px;top:50%;border-top:3px dashed rgba(255,255,255,.35)}
.xf-arrow::after{content:"";position:absolute;right:-2px;top:-9px;border:8px solid transparent;border-left:12px solid rgba(255,255,255,.55)}
.xf-token{position:absolute;top:50%;left:calc(100% - 150px);width:150px;margin-top:-58px;display:grid;justify-items:center;animation:xfX 1.5s cubic-bezier(.55,0,.35,1) 1.3s both}
.xf-token{--bx:40px;--by:-52px;--bs:.62;--arc:-80px}
.xf-token>div{transform:translate(var(--bx),var(--by)) scale(var(--bs));animation:xfY 1.5s ease-in-out 1.3s both}
.xf-token svg{width:clamp(64px,13vh,96px);height:auto;filter:drop-shadow(0 0 14px rgba(255,214,90,.9));animation:xfGlow .45s ease-in-out .2s 3 alternate}
.xf-title{font-size:clamp(1.5rem,4.6vh,2.4rem);font-weight:900;margin:4px 0 2px;animation:xfPop .6s cubic-bezier(.2,1.5,.4,1) 2.9s both}
.xf-text{font-size:clamp(.92rem,2.4vh,1.08rem);max-width:720px;margin:6px auto;animation:xfFade .6s ease 3.3s both}
.xf-def{font-size:clamp(.78rem,2vh,.88rem);color:#C9DCE8;max-width:720px;margin:8px auto 12px;animation:xfFade .6s ease 3.6s both}
.xf-btns{display:flex;gap:10px;justify-content:center;animation:xfFade .4s ease 3.4s both}
.xfer .xf-skip{position:absolute;top:12px;right:12px;z-index:2;background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.xf-spark{position:absolute;left:calc(100% - 75px);top:50%;width:8px;height:8px;border-radius:50%;background:#FFD65A;opacity:0;animation:xfSpark .9s ease-out 2.8s both}
@keyframes xfSpin{to{transform:rotate(360deg)}}
@keyframes xfFlash{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}
@keyframes xfX{from{left:0}to{left:calc(100% - 150px)}}
@keyframes xfY{0%{transform:translate(var(--bx),var(--by)) scale(var(--bs))}50%{transform:translate(0,var(--arc)) scale(1.35) rotate(-10deg)}100%{transform:translate(var(--bx),var(--by)) scale(var(--bs))}}

rip is the buyer's business.", "2": "Risk and costs pass together here: {point}. Loss, damage and the remaining charges are now for the buyer's account."}}, "cNote": {"1": "Careful: the seller still pays the freight to {pod}. With the C rules, the risk passes first and the costs later.", "2": "C-rule trap: the risk has passed at origin, but the seller still pays the main carriage to {pod} — two different points, two different moments."}}}, "levels": [{"id": 1, "name": "Level 1 – Newcomer", "short": "Newcomer", "desc": "Plain English, the big picture, 3-option questions with hints."}, {"id": 2, "name": "Level 2 – Intermediate", "short": "Intermediate", "desc": "Industry vocabulary, documents to check, charges and haulage modes, 4-option questions."}, {"id": 3, "name": "Level 3 – Expert", "short": "Expert", "desc": "Edge cases and incidents at every step, harder document checks, short case studies."}], "containers": [{"id": "20DV", "name": "20' dry", "short": "20' DRY", "iso": "22G1", "len": 20, "hc": false, "family": "dry", "familyName": "Dry", "tare": 2200, "mgm": 30480, "desc": "The basic box: 1 TEU, about 33 m³. Dense cargo fills its weight limit before its space. [TO VERIFY:v53]", "typical": "Tiles, paper reels, machine parts, bagged goods"}, {"id": "40DV", "name": "40' dry", "short": "40' DRY", "iso": "42G1", "len": 40, "hc": false, "family": "dry", "familyName": "Dry", "tare": 3700, "mgm": 30480, "desc": "Twice the length of a 20' (2 TEU), about 67 m³, same 8'6\" height. [TO VERIFY:v53]", "typical": "Furniture, textiles, general cargo"}, {"id": "40HC", "name": "40' high cube", "short": "9'6\" HIGH CUBE", "iso": "45G1", "len": 40, "hc": true, "family": "dry", "familyName": "Dry", "tare": 3900, "mgm": 30480, "desc": "One foot taller (9'6\"), about 76 m³: the workhorse for light, bulky goods. [TO VERIFY:v05]", "typical": "Appliances, electronics, garments"}, {"id": "40RF", "name": "40' reefer", "short": "REEFER HC", "iso": "45R1", "len": 40, "hc": true, "family":  goods, cleared for export, to the carrier chosen by the buyer at the export terminal.", "2": "The container-friendly F-rule recommended by ICC. The parties can agree that the buyer's carrier issues an on-board B/L to the seller (useful for letters of credit). [TO VERIFY:v14]"}, "point": {"risk": "the loaded box is handed over to the carrier at {polTerminal}"}}, "FAS": {"name": "Free Alongside Ship (named port: {pol})", "short": "Free Alongside Ship", "mode": "Sea and inland waterway", "group": "F", "common": false, "risk": 5, "cost": 5, "freight": "Buyer", "exportBy": "seller", "importBy": "buyer", "preBy": "the seller", "onBy": "the buyer", "vgmBy": "the B/L shipper — usually the seller", "insurance": "No obligation", "card": "Goods placed alongside the ship. Meant for bulk and break-bulk, not containers.", "summary": {"1": "The seller places the goods next to the ship. It suits bulk cargo, not containers.", "2": "For containers, 'alongside' is effectively the terminal — FCA is the appropriate rule. [TO VERIFY:v15]"}, "point": {"risk": "the box is placed alongside the ship at {pol}"}}, "FOB": {"name": "Free On Board (named port: {pol})", "short": "Free On Board", "mode": "Sea and inland waterway", "group": "F", "common": true, "risk": 6, "cost": 6, "freight": "Buyer", "exportBy": "seller", "importBy": "buyer", "preBy": "the seller", "onBy": "the buyer", "vgmBy": "the B/L shipper — usually the seller, sometimes the buyer's forwarder", "insurance": "No obligation", "card": "The seller is responsible until the box is on board; the buyer books the ocean freight.", "summary": {"1": "The seller pays and carries the risk until the container is loaded on the ship. The buyer books and pays the ocean freight.", "2": "Sea-only rule. With containers, the seller loses physical control at the terminal gate but keeps the risk until loading — the reason ICC recommends FCA. [TO VERIFY:v15]"}, "point": {"risk": "the box is loaded on board {vessel} at {pol}"}}, "CFR": {"name": "Cost and Freight (named port: {pod})", "short": "Cost and Freight", "mode": "Sea and inland waterway", "group": "C", "common": false, "risk": 6, "cost": 8, "freight": "Seller", "exportBy": "seller", "importBy": "buyer", "preBy": "the seller", "onBy": "the buyer", "vgmBy": "the seller, as shipper on the B/L", "insurance": "No obligation", "card": "The seller pays the freight to the destination port, but the risk passes on board at origin.", "summary": {"1": "The seller pays the ocean freight to the destination port, but the risk passes to the buyer when the box is loaded at origin.", "2": "Two critical points: risk on board at origin, costs to the destination port. ICC recommends CPT for containers. [TO VERIFY:v15]"}, "point": {"risk": "the box is loaded on board {vessel} at {pol}", "cost": "the box is discharged at {pod}"}}, "CIF": {"name": "Cost, Insurance and Freight (named port: {pod})", "short": "Cost, Insurance & Freight", "mode": "Sea and inland waterway", "group": "C", "common": true, "risk": 6, "cost": 8, "freight": "Seller", "exportBy": "seller", "importBy": "buyer", "preBy": "the seller", "onBy": "the buyer", "vgmBy": "the seller, as shipper on the B/L", "insurance": "Seller — minimum cover, Institute Cargo Clauses (C) [TO VERIFY:v18]", "card": "Like CFR, plus basic insurance bought by the seller for the buyer.", "summary": {"1": "The seller pays the ocean freight and a basic insurance to the destination port, but the risk passes to the buyer when the box is loaded at origin.", "2": "Risk on board at origin, costs to destination port, minimum insurance (ICC C). ICC recommends CIP for containers. [TO VERIFY:v15] [TO VERIFY:v18]"}, "point": {"risk": "the box is loaded on board {vessel} at {pol}", "cost": "the box is discharged at {pod}"}}, "CPT": {"name": "Carriage Paid To (named place: {pod} container terminal)", "short": "Carriage Paid To", "mode": "Any mode", "group": "C", "common": false, "risk": 5, "cost": 8, "freight": "Seller", "exportBy": "seller", "impo "The seller organises and pays transport to the buyer's door. The buyer handles import customs, duties and unloading.", "2": "If import clearance is delayed by the buyer, demurrage and detention can build up while the seller still holds the risk — allocate them in the contract."}, "point": {"risk": "the truck arrives at {dest}, ready for unloading"}}, "DPU": {"name": "Delivered at Place Unloaded (named place: {dest})", "short": "Delivered at Place Unloaded", "mode": "Any mode", "group": "D", "common": false, "risk": 11, "cost": 11, "freight": "Seller", "exportBy": "seller", "importBy": "buyer", "preBy": "the seller", "onBy": "the seller", "vgmBy": "the seller, as shipper on the B/L", "insurance": "No obligation (seller carries the risk anyway)", "card": "Like DAP, but the seller also unloads at destination.", "summary": {"1": "Like DAP, but the seller also unloads the goods at the buyer's place.", "2": "The only rule where the seller unloads at destination (formerly DAT). Risk passes once the goods are unloaded. [TO VERIFY:v14]"}, "point": {"risk": "the box is unloaded at {dest}"}}, "DDP": {"name": "Delivered Duty Paid (named place: {dest})", "short": "Delivered Duty Paid", "mode": "Any mode", "group": "D", "common": true, "risk": 10, "cost": 10, "freight": "Seller", "exportBy": "seller", "importBy": "seller", "preBy": "the seller", "onBy": "the seller", "vgmBy": "the seller, as shipper on the B/L", "insurance": "No obligation (seller carries the risk anyway)", "card": "The seller does everything, including import customs, duties and taxes.", "summary": {"1": "The seller does everything, including import customs, duties and taxes at destination.", "2": "Maximum seller obligation. Check that a foreign seller can legally act as importer (representation, VAT). [TO VERIFY:v26]"}, "point": {"risk": "the truck arrives at {dest}, cleared for import, ready for unloading"}}}, "choices": {"mode": {"prompt": {"1": "How do I travel to the port?", "2": "Pre-carriage mode to {polTerminal}"}, "unavailable": "Other modes are not available for this terminal in this module. [TO VERIFY:v39]", "options": [{"id": "truck", "title": "Truck", "tag": "Door to terminal, one handling", "body": {"1": "Door to terminal in one go — the most common way to reach the port.", "2": "Most flexible, single handling; exposed to congestion, road weight limits and terminal appointment slots."}}, {"id": "barge", "title": "Barge", "tag": "Cheaper per box, slower", "body": {"1": "A river boat carrying many containers at once: cheaper per box and greener, but slower — and it leaves earlier than the port deadline.", "2": "Economies of scale and lower CO₂ per TEU; needs a barge terminal nearby, an extra handling and an earlier cut-off. [TO VERIFY:v40]"}}, {"id": "rail", "title": "Rail", "tag": "Long distances", "body": {"1": "Good for long distances inland; the train runs to a rail terminal near the port.", "2": "Competitive over long distances; adds handlings at rail terminals and has its own cut-offs. [TO VERIFY:v40]"}}]}, "onMode": {"prompt": {"1": "How do I travel from the port to the customer?", "2": "On-carriage mode from {podTerminal}"}, "unavailable": "Other modes are not available from this terminal in this module.", "options": [{"id": "truck", "title": "Truck", "tag": "Direct to the door", "body": {"1": "The quickest way to the customer's door for most deliveries.", "2": "Door delivery with appointment; road limits apply (e.g. 44 t gross for 5+ axles in France). [TO VERIFY:v13]"}}, {"id": "barge", "title": "Barge", "tag": "Inland waterways", "body": {"1": "A river barge carries me inland, then a short truck trip reaches the door.", "2": "Barge to an inland terminal, then last-mile truck: lower cost per box over distance, more handlings. [TO VERIFY:v69]"}}, {"id": "rail", "title": "Rail", "tag": "Inland terminal + last mile", "body": {"1": "A train takes me to an inland terminal, then a truck does the last kilometres.", "2": "Rail shuttle to an inland terminal; free time and detention keep running during the inland leg. [TO VERIFY:v69]"}}]}, "haulage": {"prompt": {"1": "Who hired the transport?", "2": "Haulage mode (fixed at booking)"}, "options": [{"id": "merchant", "title": "Merchant haulage", "tag": "The cargo side hires the truck", "body": {"1": "The cargo side hires and pays the transport company directly. The carrier's job starts at the port.", "2": "The merchant contracts and pays the haulier; the carrier's responsibility typically starts at terminal receipt (port-to-port)."}}, {"id": "carrier", "title": "Carrier haulage", "tag": "The carrier organises the truck", "body": {"1": "The carrier organises the transport as part of its service and adds it to the invoice.", "2": "The carrier subcontracts and invoices the inland leg; its responsibility can start at the door, with an inland place of receipt on the B/L. [TO VERIFY:v43]"}}]}}, "glossary": {"shipper": {"term": "Shipper", "def": "The party sending the goods and named as shipper on the bill of lading — not always the factory: it can be a forwarder or, under EXW, the buyer's agent."}, "consignee": {"term": "Consignee", "def": "The party entitled to receive the goods at destination, named on the bill of lading (or the holder of a 'to order' B/L)."}, "notify-party": {"term": "Notify party", "def": "The company the carrier informs when the cargo arrives; being notify party gives no right to the goods by itself."}, "carrier": {"term": "Carrier", "def": "The shipping line that transports the container and issues the bill of lading."}, "freight-forwarder": {"term": "Freight forwarder", "def": "A logistics company that organises transport for a shipper or consignee: booking, documents, customs, trucking."}, "nvocc": {"term": "NVOCC", "def": "Non-Vessel Operating Common Carrier: books space with ocean carriers in its own name and issues its own (house) bills of lading."}, "booking": {"term": "Booking", "def": "A reservation of space on a vessel and of equipment (containers) for a given route and sailing."}, "booking-confirmation": {"term": "Booking confirmation", "def": "The carrier's confirmation of a booking: vessel and voyage, ports, equipment, empty pick-up depot and cut-offs."}, "release-order": {"term": "Release order / reference", "def": "The reference (or PIN) that authorises a haulier to collect a container — an empty from a depot, or a full box from an import terminal."}, "pin": {"term": "PIN code", "def": "A secret code the import terminal checks before releasing a full container to a truck (some ports now use secure digital pick-up systems instead)."}, "equipment-control": {"term": "Equipment control", "def": "The carrier team that manages the container fleet: right empty boxes in the right place, repositioning, repairs."}, "depot": {"term": "Depot", "def": "A yard where empty containers are stored, inspected, cleaned and repaired between uses."}, "terminal": {"term": "Terminal", "def": "The port facility where containers are received, stacked, and loaded onto or discharged from ships."}, "fcl": {"term": "FCL (Full Container Load)", "def": "A container used by a single shipper for its own cargo, stuffed at its premises."}, "lcl": {"term": "LCL (Less than Container Load)", "def": "A small shipment consolidated with other shippers' goods in one container at a CFS."}, "cfs": {"term": "CFS (Container Freight Station)", "def": "A warehouse where LCL cargo is consolidated into, or taken out of, containers."}, "teu": {"term": "TEU", "def": "Twenty-foot Equivalent Unit, the industry's standard measure: a 40' container counts as 2 TEU."}, "high-cube": {"term": "High cube", "def": "A container 9'6\" (about 2.90 m) high instead of 8'6\": ideal for light, bulky cargo."}, "reefer": {"term": "Reefer", "def": "A refrigerated container with its own cooling unit, powered by electricity at terminals and on board, or by a generator set on the road."}, "pti": {"term": "PTI (Pre-Trip Inspection)", "def": "A technical check of a reefer's refrigeration unit before it is released for a new shipment."}, "set-point": {"term": "Set point", "def": "The temperature the reefer unit is programmed to keep, given by the shipper in the booking."}, "genset": {"term": "Genset", "def": "A diesel generator clipped onto a reefer's chassis or frame to power it on the road or rail."}, "oog": {"term": "OOG (Out of Gauge)", "def": "Cargo that sticks out beyond the normal container dimensions (height, width or length) and needs special approval, stowage and lashing."}, "dg": {"term": "Dangerous goods (DG)", "def": "Hazardous cargo (flammable, toxic, corrosive…) shipped under the IMDG Code at sea, with declarations, labels and segregation rules."}, "imdg": {"term": "IMDG Code", "def": "International Maritime Dangerous Goods Code: IMO rules for packing, labelling, documenting, stowing and segregating dangerous goods at sea."}, "placard": {"term": "Placard", "def": "The large diamond-shaped label on a container showing the class of dangerous goods inside."}, "segregation": {"term": "Segregation", "def": "Keeping incompatible dangerous goods apart in the yard and on board, as required by the IMDG Code."}, "stuffing": {"term": "Stuffing", "def": "Loading goods into a container; the reverse is unstuffing (or stripping)."}, "live-load": {"term": "Live load", "def": "The truck waits while the container is stuffed (the alternative is drop and pick)."}, "ctu-code": {"term": "CTU Code", "def": "IMO/ILO/UNECE Code of Practice for Packing of Cargo Transport Units (2014): guidance on packing and securing cargo."}, "dunnage": {"term": "Dunnage", "def": "Material used to fill gaps and protect cargo: timber, airbags, cardboard."}, "slac": {"term": "SLAC", "def": "'Shipper's load, stow and count': B/L wording stating the carrier didn't see the packing and relies on the shipper's declaration."}, "seal": {"term": "Seal", "def": "A numbered, single-use lock on the container door: a broken or different seal shows the box may have been opened."}, "iso-17712": {"term": "ISO 17712", "def": "International standard for mechanical container seals; class H = high security."}, "vgm": {"term": "VGM (Verified Gross Mass)", "def": "Total weight of a packed container (cargo, packaging, pallets, dunnage and the container's tare), mandatory under SOLAS before loading."}, "solas": {"term": "SOLAS", "def": "The IMO International Convention for the Safety of Life at Sea, whose Chapter VI covers cargo, including the VGM rule."}, "tare": {"term": "Tare", "def": "The weight of the empty container, marked on its door."}, "csc-plate": {"term": "CSC plate", "def": "Safety approval plate under the International Convention for Safe Containers, showing maximum gross mass."}, "weighbridge": {"term": "Weighbridge", "def": "A large scale on which a whole truck can be weighed."}, "eir": {"term": "EIR (Equipment Interchange Receipt)", "def": "Record of a container's condition each time it changes hands at a gate (depot or terminal)."}, "pre-carriage": {"term": "Pre-carriage", "def": "Transport of the container from the shipper's premises to the port of loading."}, "on-carriage": {"term": "On-carriage", "def": "Transport of the container from the port of discharge to the consignee."}, "merchant-haulage": {"term": "Merchant haulage", "def": "The shipper or consignee (the 'merchant') arranges and pays the inland transport."}, "carrier-haulage": {"term": "Carrier haulage", "def": "The carrier arranges the inland transport as part of its service and invoices it."}, "pre-advice": {"term": "Pre-advice", "def": "Advance notice to a terminal that a specific container will be delivered, so the gate can match it to a booking."}, "cut-off": {"term": "Cut-off", "def": "A deadline set by the carrier or terminal: VGM, documentation (SI), customs, and the latest time a full box may enter the terminal (port or CY cut-off)."}, "si": {"term": "SI (Shipping Instructions)", "def": "The shipper's data — parties, cargo, weights, seal numbers — from which the carrier drafts the bill of lading."}, "bl": {"term": "B/L (Bill of Lading)", "def": "The carrier's transport document: receipt for the goods, evidence of the contract of carriage and, if negotiable, a document of title."}, "draft-bl": {"term": "Draft B/L", "def": "A preliminary version of the bill of lading, sent to the shipper for checking before the final B/L is issued."}, "negotiable-bl": {"term": "Negotiable ('to order') B/L", "def": "A B/L made out 'to order' that can be transferred by endorsement; the goods are released against an original."}, "sea-waybill": {"term": "Sea waybill", "def": "A non-negotiable transport document: the goods are released to the named consignee without presenting an original."}, "telex-release": {"term": "Express / telex release", "def": "The originals are surrendered at origin, so the carrier can release the cargo at destination without paper."}, "endorsement": {"term": "Endorsement", "def": "Signing the back of a negotiable B/L to transfer the right to the goods to the next holder."}, "loi": {"term": "LOI (Letter of Indemnity)", "def": "A guarantee asked by a carrier to release cargo without the original B/L — risky, and P&I clubs warn against it."}, "hs-code": {"term": "HS code", "def": "Harmonized System code: the international classification of goods (6 digits, extended nationally) used for duties, controls and statistics."}, "export-declaration": {"term": "Export declaration", "def": "The customs declaration lodged by (or for) the exporter to take goods out of a country."}, "import-declaration": {"term": "Import declaration", "def": "The customs declaration lodged by (or for) the importer to release goods for free circulation, with duties and import VAT."}, "customs-broker": {"term": "Customs broker", "def": "A licensed specialist who prepares and lodges customs declarations for importers or exporters."}, "manifest": {"term": "Manifest", "def": "The list of all cargo on board a vessel, compiled by the carrier from bills of lading and filed with customs."}, "ens": {"term": "ENS (Entry Summary Declaration)", "def": "Advance safety and security data on goods arriving in the EU, filed before loading for deep-sea container cargo."}, "ics2": {"term": "ICS2", "def": "Import Control System 2: the EU's advance cargo information system, used to risk-assess shipments before loading."}, "eori": {"term": "EORI number", "def": "The identification number every importer and exporter needs for customs formalities in the EU."}, "customs-hold": {"term": "Customs hold", "def": "A block placed by customs on a container: it cannot leave the terminal until documents are checked or the box is inspected."}, "gate-in": {"term": "Gate-in", "def": "The moment a container enters the terminal: data, seal and condition are checked and the box is handed over."}, "yard": {"term": "Yard", "def": "The terminal area where containers are stacked while waiting for a ship or for collection."}, "rtg": {"term": "RTG", "def": "Rubber-tyred gantry crane that stacks containers in the terminal yard."}, "quay-crane": {"term": "Quay crane (STS)", "def": "The giant ship-to-shore crane that loads and discharges containers."}, "stowage-plan": {"term": "Stowage plan / bay plan", "def": "The plan showing where every container goes on board, built from weights, destinations, DG and reefer constraints and exchanged as EDI BAPLIE."}, "lashing": {"term": "Lashing", "def": "Bars, turnbuckles and twistlocks that secure containers on deck against the ship's movements."}, "etd": {"term": "ETD / ETA", "def": "Estimated time of departure / arrival."}, "transshipment": {"term": "Transshipment", "def": "Moving a container from one ship to another at a hub port, for example from a feeder to a mainline vessel."}, "feeder": {"term": "Feeder", "def": "A smaller ship linking regional ports to a hub where mainline ships call."}, "hub": {"term": "Hub", "def": "A large port where containers are transferred between ships (e.g. Singapore)."}, "blank-sailing": {"term": "Blank sailing", "def": "A scheduled voyage that the carrier cancels; bookings are moved to another sailing."}, "shut-out": {"term": "Shut-out / rolled", "def": "A container that misses its planned ship (no VGM, late, overbooking) and is moved ('rolled') to a later sailing."}, "general-average": {"term": "General average", "def": "An old maritime rule: when sacrifices are made to save a ship (e.g. after a fire), all cargo interests share the cost in proportion to their value."}, "arrival-notice": {"term": "Arrival notice", "def": "The carrier's message to the consignee and notify party announcing the arrival of the cargo, with charges due."}, "delivery-order": {"term": "Delivery order", "def": "The carrier's instruction releasing the cargo to a named party once B/L, freight and charges are settled."}, "demurrage": {"term": "Demurrage", "def": "Charge for leaving a full container in the terminal beyond the free time."}, "detention": {"term": "Detention", "def": "Charge for keeping the carrier's container outside the terminal or depot beyond the free time."}, "free-time": {"term": "Free time", "def": "Number of days allowed before demurrage or detention charges start, set by tariff or contract."}, "thc": {"term": "THC", "def": "Terminal Handling Charge: cost of handling the container at the terminal, charged at origin and/or destination."}, "baf": {"term": "BAF", "def": "Bunker Adjustment Factor: a surcharge reflecting fuel costs."}, "edi": {"term": "EDI", "def": "Electronic Data Interchange between computer systems (e.g. UN/EDIFACT messages: VERMAS for the VGM, BAPLIE for the bay plan)."}, "pod-proof": {"term": "Proof of delivery (POD)", "def": "The document signed by the consignee when the goods are delivered, noting any reservations."}, "cmr": {"term": "CMR consignment note", "def": "The road transport document used for international road haulage in Europe under the CMR Convention."}, "unstuffing": {"term": "Unstuffing (stripping)", "def": "Unloading goods from a container."}, "mnr": {"term": "M&R", "def": "Maintenance and repair of containers, usually done at depots by contractors."}, "incoterms": {"term": "Incoterms", "def": "International rules (ICC, 2020 edition) that say who, seller or buyer, pays for each part of the transport and where the risk passes — they do not transfer ownership."}, "ispm15": {"term": "ISPM 15", "def": "International standard for wood packaging: heat treatment or fumigation, shown by a stamp."}, "letter-of-credit": {"term": "Letter of credit", "def": "A bank's undertaking to pay the seller against compliant documents, often including the original B/L."}}, "verification": [{"id": "v01", "claim": "SOLAS Chapter VI, Regulation 2 VGM requirement in force since 1 July 2016; no loading without VGM.", "source": "IMO — Res. MSC.380(94); MSC.1/Circ.1475"}, {"id": "v02", "claim": "Method 1 / Method 2 definitions; Method 2 certified/approved by the competent authority; calibration and vehicle tare deduction rules are national.", "source": "IMO MSC.1/Circ.1475; national implementing rules"}, {"id": "v03", "claim": "Definition of 'shipper' for VGM (named on B/L or contracting party).", "source": "IMO MSC.1/Circ.1475"}, {"id": "v05", "claim": "40' HC: height 9'6\", MGM 30,480 kg (some 32,500 kg), tare ≈ 3,750–4,200 kg, ≈ 76 m³.", "source": "ISO 668; carrier equipment specification pages"}, {"id": "v06", "claim": "40' container floor holds ≈ 24–25 euro-pallets.", "source": "Carrier equipment guides"}, {"id": "v07", "claim": "ISO 17712 class H high-security seals as standard for international containers.", "source": "ISO 17712; carrier seal policy"}, {"id": "v08", "claim": "CTU Code (2014) guidance on load distribution / centre of gravity.", "source": "IMO/ILO/UNECE CTU Code"}, {"id": "v09", "claim": "MSC Napoli (2007): ~20% of 660 containers checked > 3 t off declared weight.", "source": "UK MAIB investigation report 9/2008"}, {"id": "v10", "claim": "Shanghai → Le Havre transit ≈ 30–35 days via Suez; ≈ 40+ iffs"}, {"id": "v67", "claim": "EU import: customs declaration with HS code, customs value, duties and import VAT; EORI required; customs release sent to the terminal through port community systems.", "source": "Union Customs Code; French and Belgian customs; port community systems"}, {"id": "v68", "claim": "Release: one original B/L of the full set surrendered (or sea waybill / telex release / eB/L), collect freight and charges paid, release by PIN or secure digital pick-up (e.g. Antwerp certified pick-up).", "source": "Carrier import procedures; port community system documentation"}, {"id": "v69", "claim": "On-carriage options: Le Havre by road, rail and Seine barge; Antwerp-Bruges by road, barge and rail.", "source": "HAROPA Port; Port of Antwerp-Bruges"}, {"id": "v70", "claim": "Import detention from full gate-out to empty return; delivery appointments; POD / CMR for road transport.", "source": "Carrier tariffs; CMR Convention"}, {"id": "v71", "claim": "Empty return depot set by the carrier; damage recharges based on EIR; cleaning fees; reefer wash and PTI; tank cleaning certificate.", "source": "Carrier tariffs; tank cleaning industry standards (e.g. EFTCO)"}, {"id": "v72", "claim": "D&D disputes: billing must follow tariff/contract; some regulators (e.g. US FMC) set billing rules.", "source": "US FMC 46 CFR Part 541; carrier tariffs"}, {"id": "v73", "claim": "Singapore: world's largest transshipment hub, ≈ 39–41 million TEU per year; hub dwell typically 1–3 days.", "source": "Maritime and Port Authority of Singapore"}, {"id": "v74", "claim": "Port volumes: Antwerp-Bruges ≈ 13 million TEU; Le Havre (HAROPA) ≈ 3 million TEU per year.", "source": "Port of Antwerp-Bruges; HAROPA annual figures"}, {"id": "v75", "claim": "Delivery without original B/L exposes the carrier to misdelivery claims; LOIs carry risk.", "source": "P&I club guidance"}, {"id": "v76", "claim": "General average declared after incidents such as fires; cargo interests must provide GA security bef
