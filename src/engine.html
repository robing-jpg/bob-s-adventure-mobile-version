    </svg>`;
  };

  /* --- Steps 6 & 8: quay operations (load / discharge). Ship stacks, our box and the crane share one scale (K). --- */
  function quay(s, mode) {
    const c = container(), r = route(), { w, h } = boxDims(c), bw = w * K, bh = h * K, load = mode === 'load';
    const SX = 270, SY = 352, deck = SY - 30, tiers = [3, 3, 4, 4, 0, 4, 3], bayX = b => 30 + b * 171;
    const bx0 = 54, by0 = GY - 14 - bh, lift = 96;
    const slotX = SX + bayX(1), slotY = deck - 3 * TH - bh, dx = slotX - bx0;
    let deckSvg = '';
    tiers.forEach((n, b) => { if (!n) return; const x = bayX(b);
      deckSvg += `<rect x="${x - 3}" y="-36" width="171" height="7" fill="#33424F"/>`;
      for (let t = 0; t < n; t++) { const y = -30 - (t + 1) * TH + 1, k = b * 3 + t + 2;
        deckSvg += k % 3 === 0 ? ctr(x, y, 82, TH - 1, PALETTE[k % 7]) + ctr(x + 83, y, 82, TH - 1, PALETTE[(k + 3) % 7]) : ctr(x, y, 165, TH - 1, PALETTE[k % 7]); } });
    const bridgeX = bayX(4) + 8;
    // lashing bridges between bays (2 tiers high) and hatch covers under each bay
    const lashBridges = tiers.map((n, b) => b ? `<rect x="${bayX(b) - 5}" y="${-30 - 2 * TH}" width="4" height="${2 * TH}" fill="#55616D"/><rect x="${bayX(b) - 9}" y="${-30 - TH}" width="12" height="3" fill="#55616D"/>` : '').join('');
    const shipBody = `<path d="M0 -30 H1180 Q1232 -30 1222 10 L1192 52 H26 L0 -30 Z" fill="url(#gHull)" stroke="#132331" stroke-width="2"/>
      <rect x="2" y="-30" width="1196" height="6" fill="#E9EEF2" opacity=".9"/><path d="M1160 -30 h40 q22 0 24 -18 h-64 z" fill="#2E4A60" stroke="#132331" stroke-width="1.5"/>
      <rect x="1196" y="-82" width="4" height="34" fill="#55616D"/><circle cx="1198" cy="-84" r="3" fill="#F2F5F8"/>
      ${Array.from({ length: 14 }, (_, k) => `<circle cx="${70 + k * 80}" cy="-12" r="2.2" fill="#9FB3C2" opacity=".7"/>`).join('')}
      ${tiers.map((n, b) => `<rect x="${bayX(b) - 1}" y="-30" width="167" height="6" fill="#55616D"/>`).join('')}${lashBridges}
      <text x="60" y="12" font-size="15" font-weight="800" fill="#fff" letter-spacing="3">${esc(r.vessel)}</text>
      ${deckSvg}
      <rect x="${bridgeX}" y="-250" width="96" height="220" fill="#EEF2F5" stroke="#97A4AF"/><rect x="${bridgeX - 14}" y="-262" width="124" height="14" fill="#DDE3E8" stroke="#97A4AF"/>
      ${Array.from({ length: 6 }, (_, k) => `<rect x="${bridgeX + 8}" y="${-238 + k * 32}" width="80" height="10" fill="url(#gGlass)"/>`).join('')}
      <rect x="${bridgeX + 30}" y="-290" width="4" height="28" fill="#55616D"/><circle class="blink" cx="${bridgeX + 32}" cy="-294" r="3" fill="#FF5A4A"/>
      ${load ? `<g data-at="lash" data-delay="300" stroke="#1B2631" stroke-width="2.2">${[0, 1].map(i => `<line x1="${bayX(1) + 8 + i * 140}" y1="-30" x2="${bayX(1) + 40 + i * 80}" y2="${-30 - 2 * TH}"/><line x1="${bayX(1) + 40 + i * 80}" y1="-30" x2="${bayX(1) + 8 + i * 140}" y2="${-30 - 2 * TH}"/>`).join('')}</g>` : ''}`;
    const shipMoves = load ? 'start:1500,0;berth:0,0~2600;depart:1500,0~4200' : 'start:1500,0;arrive:0,0~3200';
    // our box: g0 = arrival (truck / ship), then up / across / down in one beat
    const loadChain = ['start:0,0;load:0,' + (lift - by0).toFixed(1) + '~900', `start:0,0;load:${dx.toFixed(1)},0@900~1300`, 'start:0,0;load:0,' + (slotY - lift).toFixed(1) + '@2300~900'];
    const disChain = [`start:${dx.toFixed(1)},0;discharge:0,0@900~1300`, 'start:0,' + (slotY - lift).toFixed(1) + ';discharge:0,0~900', 'start:0,' + (lift - by0).toFixed(1) + ';discharge:0,0@2300~900'];
    const g0 = load ? 'start:-640,0;berth:0,0~2200;depart:1500,0~4200' : 'start:1500,0;arrive:0,0~3200;yard:-760,0~2000';
    const lifts = load ? loadChain : disChain;
    const boxBody = `<g transform="translate(${bx0} ${by0}) scale(${K})">${boxSVG(c, { plate: false })}</g>`;
    // hoist ropes: from the head block up to the trolley (clipped at the trolley, so they shorten/lengthen as the box moves)
    const cables = `<g transform="translate(${bx0} ${by0})" stroke="#2B3238" stroke-width="2"><line x1="${bw / 2 - 9}" y1="-24" x2="${bw / 2 - 9}" y2="-600"/><line x1="${bw / 2 + 9}" y1="-24" x2="${bw / 2 + 9}" y2="-600"/></g>`;
    const spreader = `<g transform="translate(${bx0} ${by0})">${spreaderSVG(bw)}</g>`;
    const spAttrs = load ? 'data-until="load"' : 'data-until="discharge"';
    const trolleyTx = load ? `start:0,0;load:${dx.toFixed(1)},0@900~1300` : `start:${dx.toFixed(1)},0;discharge:0,0@900~1300`;
    const truckTx = load ? 'start:-640,0;berth:0,0~2200;load:-760,0@3400~1800' : 'start:-640,0;discharge:0,0~1400;yard:-760,0~2000';
    return `${svgOpen(s)}<defs><clipPath id="cableClip"><rect x="-700" y="64" width="2400" height="500"/></clipPath></defs>${sea(GY - 6)}
      <rect x="-700" y="${GY - 10}" width="964" height="120" fill="#B9C2C9"/><rect x="-700" y="${GY - 10}" width="964" height="6" fill="#fff" opacity=".4"/><rect x="258" y="${GY - 10}" width="8" height="120" fill="#7E8A95"/>
      ${skyline([[-60, 236, 46], [0, 252, 40]])}
      <g data-tx="${shipMoves}"><g transform="translate(${SX} ${SY})">${shipBody}<path d="M20 48 Q600 60 1196 48" stroke="#fff" stroke-width="3" fill="none" opacity=".55"/></g></g>
      ${quayCrane()}
      <g data-tx="${trolleyTx}"><g transform="translate(${bx0 + bw / 2 - 30} 50)"><rect x="0" y="0" width="60" height="14" rx="2" fill="#1E3446"/>${wheel(10, 0, 4)}${wheel(50, 0, 4)}
        <circle cx="21" cy="14" r="4" fill="#55616D"/><circle cx="39" cy="14" r="4" fill="#55616D"/>
        <rect x="-26" y="16" width="26" height="20" rx="3" fill="#E8C33A" stroke="#6B5410"/><rect x="-22" y="19" width="18" height="9" fill="url(#gGlass)"/><line x1="-13" y1="14" x2="-13" y2="16" stroke="#1E3446" stroke-width="3"/></g></g>
      <g ${spAttrs}><g clip-path="url(#cableClip)">${chain(lifts, cables)}</g>${chain(lifts, spreader)}</g>
      ${chain([truckTx], terminalTractor(bx0, bw))}
      ${chain([g0].concat(lifts), boxBody)}
      ${load ? tag(640, 84, `ETD ${plain('{etd}')} · ${r.vessel} ${r.voyage}`, 'data-at="docs" data-delay="600"') : tag(640, 84, plain(C.ui.arrivalNotice), 'data-at="yard" data-delay="1800"')}
      ${c.family === 'reefer' ? tag(420, 84, load ? 'PLUGGED ON BOARD ⚡ ' + plain('{setPoint}') : 'PLUGGED IN REEFER RACK ⚡', `data-at="${load ? 'lash' : 'yard'}" data-delay="1600"`, '#0B4F6C') : ''}
    </svg>`;
  }
  SCENES.loading = s => quay(s, 'load');
  SCENES.discharge = s => quay(s, 'discharge');

  /* --- Step 7: ocean voyage on a schematic map --- */
  SCENES.map = s => {
    const r = route(), M = r.map, c = container();
    const poly = pts => pts.map(p => p.join(',')).join(' ');
    const land = (C.mapLand || []).map(p => `<polygon points="${poly(p)}" fill="#EFE6D2" stroke="#C9B994" stroke-width="1.5"/>`).join('');
    const d = 'M' + M.path.map(p => p.join(' ')).join(' L');
    const alt = M.alt ? `<path d="M${M.alt.map(p => p.join(' ')).join(' L')}" fill="none" stroke="#7C8B97" stroke-width="2" stroke-dasharray="3 5" opacity=".8"/><text x="${M.altLabel[0]}" y="${M.altLabel[1]}" font-size="11" font-weight="700" fill="#55616D">${esc(plain(M.altText))}</text>` : '';
    const feeder = M.feeder ? `<path id="feederPath" d="M${M.feeder.map(p => p.join(' ')).join(' L')}" fill="none" stroke="#E07A24" stroke-width="3" stroke-dasharray="7 5"/>` : '';
    // Fractions along the route path for each beat (from vertex indices in route.map.at).
    const cum = [0]; for (let i = 1; i < M.path.length; i++) cum.push(cum[i - 1] + Math.hypot(M.path[i][0] - M.path[i - 1][0], M.path[i][1] - M.path[i - 1][1]));
    const total = cum[cum.length - 1];
    M.along = ['start:0'].concat(Object.keys(M.at).map(k => `${k}:${(cum[M.at[k]] / total).toFixed(4)}`)).join(';');
    const port = (p, main) => `<g><circle cx="${p.x}" cy="${p.y}" r="${main ? 7 : 5}" fill="${main ? '#1B2631' : '#fff'}" stroke="#1B2631" stroke-width="2"/><text x="${p.x + (p.dx || 10)}" y="${p.y + (p.dy || 4)}" font-size="12" font-weight="800" fill="#1B2631">${esc(p.name)}</text></g>`;
    const shipIcon = `<g><path d="M-22 0 H18 L24 -6 H-26 Z" fill="#1E3446"/><rect x="-18" y="-14" width="30" height="8" fill="#8FA3B3"/><rect x="-6" y="-14" width="8" height="8" fill="${c.family === 'reefer' ? '#E9EEF2' : 'var(--c-box)'}" stroke="#1B2631"/><rect x="10" y="-22" width="8" height="10" fill="#EEF2F5"/></g>`;
    return `${svgOpen(s)}<rect x="-700" y="-100" width="2360" height="700" fill="#A9D4EA"/>${land}
      <text x="20" y="450" font-size="11" fill="#33424F">${esc(plain(C.ui.mapNote))}</text>
      ${alt}<path id="routePath" d="${d}" fill="none" stroke="var(--c-primary)" stroke-width="3" stroke-dasharray="8 6"/>${feeder}
      ${M.ports.map(p => port(p, p.main)).join('')}
      ${M.feeder ? `<g id="feederShip" data-path="feederPath" data-along="start:0;depart:0;hub:1" data-d="2400" data-until="hub">${shipIcon}</g>` : ''}
      <g id="mainShip" data-path="routePath" data-along="${M.along}" data-d="2600" ${M.feeder ? 'data-at="hub"' : ''}>${shipIcon}</g>
      ${c.family === 'reefer' ? inset(690, 330, 250, 100, 'REMOTE REEFER MONITORING', ['Set point ' + plain('{setPoint}') + ' · supply air ✓', 'Alarms: none · power ✓', 'Readings sent several times a day']).replace('<g ', '<g data-at="ocean" ') : ''}
      ${tag(M.days[0], M.days[1], plain('{transit}'), 'data-at="arrive"', '#1D7048')}
    </svg>`;
  };

  /* --- Step 11: unstuffing at the consignee, empty return to the depot --- */
  SCENES.unstuff = s => {
    const c = container(), { w, h } = boxDims(c), f = c.family, t = c.id, y = GY - (h + 33);
    const open = f === 'dry' || f === 'reefer';
    const slots = open ? cartonSlots(w, h, y) : [];
    // loose cartons (NOT in the truck group): in the open box → into the consignee's warehouse; hidden before the truck leaves
    const loose = open ? `<g data-until="unstuff">${slots.slice().reverse().map((c, k) => `<g data-tx="start:0,0;unstuff:${c.sx - c.bx},${c.sy - c.by}@${k * 140}~900">${carton(c.bx, c.by)}</g>`).join('')}</g>` : '';
    let bg = ''; [430, 546, 662, 778].forEach((x, i) => { for (let k = 0; k < 3; k++) bg += `<rect x="${x}" y="${314 - k * 56}" width="112" height="54" fill="${PALETTE[(i + k) % 5]}" stroke="#6E7C88"/>`; });
    return `${svgOpen(s)}${ground()}
      ${warehouseSVG(20, plain(C.ui.consigneeWarehouse), { attrs: 'data-until="unstuff"' })}<g data-until="unstuff">${dockInterior()}</g>
      <g data-at="return" opacity=".9"><g opacity=".55">${bg}</g><rect x="20" y="20" width="236" height="30" rx="6" fill="#fff" stroke="#97A4AF"/><text x="138" y="41" text-anchor="middle" font-size="14" font-weight="800" fill="#1B2631">EMPTY DEPOT · ${esc(route().pod.toUpperCase())}</text>
        <rect x="80" y="${GY - 120}" width="140" height="120" fill="#D3DBE1" stroke="#97A4AF"/><text x="150" y="${GY - 96}" text-anchor="middle" font-size="11" font-weight="800" fill="#1B2631">${f === 'reefer' ? 'WASH + PTI' : f === 'tank' ? 'TANK CLEANING' : 'M&amp;R WORKSHOP'}</text></g>
      ${t === '40OT' || t === '40FR' ? `<g data-at="unstuff" data-until="unstuff"><line x1="${320 + w / 2}" y1="0" x2="${320 + w / 2}" y2="${y + 10}" stroke="#3F4750" stroke-width="3"/>${tag(320 + w / 2, 40, 'CRANE LIFTS THE CARGO OUT')}</g>` : ''}
      ${f === 'tank' ? `<g data-at="unstuff" data-until="unstuff"><path d="M${320 + w / 2} ${y + 6} C 260 ${y - 40}, 220 300, 160 300" stroke="#1B2631" stroke-width="7" fill="none"/>${tag(320 + w / 2 + 60, y - 40, 'DISCHARGING…', '', '#0B4F6C')}</g>` : ''}
      ${rig(c, { attrs: 'data-tx="start:0,0;return:1200,0~2400"', boxOpts: { wallAttr: open ? 'data-until="start"' : '', wall2Attr: open ? 'data-at="return"' : '', plate: true, cargo: false } })}${loose}
      ${rig(c, { attrs: 'data-tx="start:-1200,0;gatein:0,0~2400;depart:1200,0~2600"', boxOpts: { plate: true, cargo: false } })}
      ${inset(470, 14, 232, 112, 'EIR — EMPTY RETURN', [`Container ${CONTAINER_NO}`, 'Empty, clean ✓', 'Damage: none recorded', 'Detention clock: STOP'], 'data-at="gatein" data-delay="2400"')}
      ${tag(782, 150, '⏱ IMPORT DETENTION STOPS', 'data-at="gatein" data-delay="2600"', '#1D7048')}
    </svg>`;
  };

  // Narrator avatar (also used in the menu).
  function avatar(w) {
    return `<svg viewBox="0 0 120 90" width="${w}" aria-hidden="true"><rect x="6" y="14" width="108" height="62" rx="6" fill="var(--c-box)" stroke="var(--c-box-dark)" stroke-width="3"/>
      ${[22, 38, 54, 70, 86, 102].map(x => `<line x1="${x}" y1="18" x2="${x}" y2="72" stroke="#000" opacity=".12" stroke-width="4"/>`).join('')}
      <ellipse cx="44" cy="40" rx="8" ry="9" fill="#fff"/><ellipse cx="76" cy="40" rx="8" ry="9" fill="#fff"/><circle cx="46" cy="42" r="4" fill="#1B2631"/><circle cx="78" cy="42" r="4" fill="#1B2631"/>
      <path d="M46 56 q14 10 28 0" stroke="#1B2631" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`;
  }

  /* ---------- Start-up ---------- */
  function buildClouds() {
    $('#clouds').innerHTML = [[8, 120, 70, -10], [22, 90, 95, -45], [14, 150, 120, -80], [30, 70, 85, -20]].map(([top, w, dur, delay]) =>
      `<span class="cloud" style="top:${top}%;width:${w}px;animation-duration:${dur}s;animation-delay:${delay}s"></span>`).join('');
  }
  applyConfig(); mountDefs(); buildClouds(); retryUnsent();
  /* MOBILE: one surface at a time — body.surface hides the narration and fact while a sheet, a document,
     the transfer moment or a popover is open. */
  const surf = () => { document.body.classList.toggle('surface', ['#sheet', '#docv', '#xfer', '#pop'].some(q => $(q).classList.contains('open'))); };
  ['#sheet', '#docv', '#xfer', '#pop'].forEach(q => new MutationObserver(surf).observe($(q), { attributes: true, attributeFilter: ['class'] }));
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { const a = document.activeElement; if (a && a.id === 'mNick') a.scrollIntoView({ block: 'center' }); });
  $('.rotate .rbob').innerHTML = avatar(64);
  addEventListener('orientationchange', () => setTimeout(placeHs, 300));
  S = load();
  if (S && (S.v !== 3 || !S.settings)) S = null;
  if (S) { draft = Object.assign({}, S.settings); initChoices(); }
  // Bob's intro opens the game every time; saved progress is resumed from the menu ("Resume").
  if (S) S.screen = 'menu';
  renderIntro();

  // Test/debug hook (console only).
  window.__cj = { state: () => S, C, renderIntro, goStep, go, openQuestion, startQuiz, renderSummary, renderMenu, consult,
    answerRight: () => { const s = step(); answer(R(s.question).options.find(o => o.correct).id); },
    consultAll: () => { essentials(step()).forEach(h => { const arr = S.consulted[S.step] || (S.consulted[S.step] = []); if (!arr.includes(h.id)) arr.push(h.id); }); save(); renderHs(); renderBar(); },
    footprint: () => footprint(), closeXfer, resultItems: () => resultItems(), results: () => loadResults(),
    reset: () => { try { localStorage.removeItem(STORE); } catch (e) {} location.reload(); } };
})();
</script>
</body>
</html>
